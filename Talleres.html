/* ══════════════════════════════════════════════════════════════════════════
   ARMÁ EL 11 — motor
   ──────────────────────────────────────────────────────────────────────────
   Portado tal cual del prototipo validado. No cambió un número: los que
   están acá son los que pasaron el backtest sobre 8 ligas.

   La regla que ordena todo: NUNCA se mira el partido que se está simulando.
   Los planteles y las fuerzas salen de los partidos ANTERIORES. Si mirara el
   partido, la simulación sería una profecía autocumplida y el juego no
   tendría gracia.
   ══════════════════════════════════════════════════════════════════════════ */

const BASE = "https://v3.football.api-sports.io", LEAGUE = 128;
const MEDIA_LIGA = 6.5;
const FORMS = ["4-4-2","4-3-3","4-2-3-1","3-5-2","5-3-2","4-5-1","3-4-3","4-1-4-1"];

/* Fuerza de un jugador = promedio de sus ratings en los partidos previos.
   6.5 es el rating medio de la liga: por debajo resta, por encima suma.
   La confianza sube con los minutos — a quien jugó poco se le cree menos. */
function fuerza(p){
  if(!p.ratings.length) return { v: MEDIA_LIGA, conf: 0 };
  const v = p.ratings.reduce((a,b)=>a+b,0) / p.ratings.length;
  const conf = Math.min(1, p.mins/180);            // 2 partidos completos = confianza plena
  return { v: MEDIA_LIGA + (v-MEDIA_LIGA)*(.45+.55*conf), conf };
}

/* Castigo por jugar fuera de puesto, en puntos de rating.
   La API sólo distingue G/D/M/F, así que un extremo figura como M aunque
   juegue de F: mover a alguien entre medio y ataque casi no cuesta. Poner a
   un defensor de nueve sí. Y al arco, cualquiera que no sea arquero es un
   desastre. Las claves van en orden alfabético, que es como las arma la
   función — ese detalle me costó un bug entero.                           */
const PENAL = { DG:1.6, GM:2.2, FG:2.6, DM:0.40, DF:0.85, FM:0.15 };
function penalPuesto(real, slot){
  if(!real || real===slot) return 0;
  return PENAL[[real,slot].sort().join("")] ?? 0.5;
}

function slotsDe(f){
  const l = f.split("-").map(Number).filter(n=>n>0), s = [{cat:"G",n:1}];
  s.push({cat:"D", n:l[0]});
  if(l.length===2){ s.push({cat:"M", n:l[1]}); }
  else {
    for(let i=1;i<l.length-1;i++) s.push({cat:"M", n:l[i]});
    s.push({cat:"F", n:l[l.length-1]});
  }
  return s;
}

function lineas(xi){
  const g = x => xi.filter(p=>p&&p.slotCat===x).map(p => fuerza(p).v - penalPuesto(p.pos,p.slotCat));
  const m = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : MEDIA_LIGA;
  const arq=m(g("G")), def=m(g("D")), med=m(g("M")), ata=m(g("F"));
  return { arq, def, med, ata,
    DEF: def*.72 + arq*.28,
    MED: med,
    ATA: ata*.68 + med*.32 };
}

/* Perillas. Ninguna puede ser una mejora gratis — cada una cobra su precio:
   LINEA   riesgo simétrico: sube o baja las chances de los dos lados
   PRESION le corta la salida al rival pero le regala contras. El castigo es
           ADITIVO, así que pesa mucho más cuando el rival es flojo:
           presionar a un equipo chico es mal negocio, a uno grande es barato
   RITMO   escala el partido entero: más goles de los dos lados
   ANCHO   depende de con qué jugadores contás (se resuelve en bonusAncho)  */
const KNOBS = [
  { id:"linea",   n:"Línea defensiva", izq:"Baja",        der:"Alta" },
  { id:"presion", n:"Presión",         izq:"Repliegue",   der:"Alta" },
  { id:"ancho",   n:"Ancho de juego",  izq:"Por adentro", der:"Por afuera" },
  { id:"ritmo",   n:"Ritmo",           izq:"Controlado",  der:"Alto" },
];

function tacticas(k){
  let mine=1, theirs=1, theirsFlat=0; const notas=[];
  const lin=k.linea/100;
  mine *= 1+0.13*lin; theirs *= 1+0.20*lin;
  if(lin> .35) notas.push("Con la línea alta generás más, pero le dejás la espalda al rival.");
  if(lin<-.35) notas.push("Con la línea baja te exponés menos, pero también creás menos.");

  const pre=k.presion/100;
  mine *= 1+0.14*pre;
  if(pre>0){ theirsFlat += 0.26*pre;
    if(pre>.35) notas.push("Presionando alto le cortás la salida, pero cada pelota que te ganan es una contra franca.");
  } else { theirs *= 1+0.12*pre;
    if(pre<-.35) notas.push("Replegado le cedés el balón: te llegan menos, pero vos también llegás menos.");
  }

  const rit=k.ritmo/100;
  mine *= 1+0.11*rit; theirs *= 1+0.11*rit;
  if(rit> .35) notas.push("Ritmo alto: partido de ida y vuelta, más goles de los dos lados.");
  if(rit<-.35) notas.push("Ritmo controlado: partido cerrado, pocos goles.");

  return { mine, theirs, theirsFlat, notas, ancho:k.ancho/100 };
}

function bonusAncho(xi, anchoVal){
  const lat = xi.filter(p=>p&&p.slotCat==="D").slice(1,-1);
  const ext = xi.filter(p=>p&&p.slotCat==="F");
  const afuera = [...lat,...ext].map(p=>fuerza(p).v);
  const med = xi.filter(p=>p&&p.slotCat==="M").map(p=>fuerza(p).v);
  const prom = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : MEDIA_LIGA;
  const dif = (prom(afuera)-prom(med))*anchoVal;
  return 1 + Math.max(-.12, Math.min(.12, dif*0.10));
}

const BASE_LOCAL=1.36, BASE_VISITA=1.12;
function xgDe(A,B,esLocal,mult,anchoA){
  const base = esLocal ? BASE_LOCAL : BASE_VISITA;
  /* z = diferencia de rating en desvíos, topada: en el fútbol real ni el
     mejor equipo contra el peor pasa de ~3 goles esperados.               */
  const z = Math.max(-2.2, Math.min(2.2, (A.ATA-B.DEF)/0.62));
  return Math.max(.18, Math.min(3.4, base*Math.exp(0.30*z)*mult*anchoA));
}

const poissonUno = l => { const L=Math.exp(-l); let k=0,p=1;
  do { k++; p*=Math.random(); } while(p>L); return k-1; };
const poisson = poissonUno;

function simular(xgA, xgB, n=6000){
  let w=0,d=0,l=0; const marc={};
  for(let i=0;i<n;i++){
    const a=poisson(xgA), b=poisson(xgB);
    if(a>b)w++; else if(a===b)d++; else l++;
    const k=a+"-"+b; marc[k]=(marc[k]||0)+1;
  }
  const top=Object.entries(marc).sort((x,y)=>y[1]-x[1])[0];
  return { win:w/n*100, draw:d/n*100, loss:l/n*100,
           marcador:top[0], probMarcador:top[1]/n*100, xgA, xgB };
}

/* Re-simulación condicionada por expulsión: el equipo con uno menos pierde
   ataque y concede más, pero solo por el tiempo que quedaba por jugar.    */
function simExpulsion(xgA, xgB, rojas){
  let a=xgA, b=xgB;
  rojas.forEach(r=>{
    const resto=Math.max(0,(90-r.min))/90, jugado=1-resto;
    if(r.esMio){ a=a*(jugado+resto*0.68); b=b*(jugado+resto*1.42); }
    else       { b=b*(jugado+resto*0.68); a=a*(jugado+resto*1.42); }
  });
  return simular(a,b);
}

/* Arma el once más fuerte disponible respetando la formación. */
function autoXI(pool, form){
  const slots=slotsDe(form), usados=new Set(), xi=[];
  for(const linea of slots)
    for(let i=0;i<linea.n;i++){
      const cand = pool.filter(p=>!usados.has(p.id))
        .map(p=>({p, v: fuerza(p).v - penalPuesto(p.pos, linea.cat)}))
        .sort((a,b)=>b.v-a.v)[0];
      if(cand){ usados.add(cand.p.id); xi.push({...cand.p, slotCat:linea.cat}); }
      else xi.push(null);
    }
  return xi;
}

const aRGB=h=>{h=h.replace("#","");if(h.length===3)h=[...h].map(c=>c+c).join("");
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const aHEX=([r,g,b])=>"#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(r)+.7152*f(g)+.0722*f(b);};
const CT=(a,b)=>{const x=lum(aRGB(a)),y=lum(aRGB(b));return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mezclar=(h,c,p)=>aHEX(aRGB(h).map((v,i)=>v*(1-p)+aRGB(c)[i]*p));
function aHSL([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return[0,0,l];const s=l>.5?d/(2-mx-mn):d/(mx+mn);
  const h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;return[h*60,s,l];}
function deHSL([h,s,l]){h=((h%360)+360)%360;if(!s){const v=Math.round(l*255);return[v,v,v];}
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return t.map(v=>Math.round((v+m)*255));}
function legible(hex,fondo,min=4.5){const osc=lum(aRGB(fondo))>.5;let[h,s,l]=aHSL(aRGB(hex));
  for(let i=0;i<70;i++){const c=aHEX(deHSL([h,s,l]));if(CT(c,fondo)>=min)return c;
    l+=osc?-.015:.015;if(l<=0||l>=1)break;}return osc?"#000000":"#FFFFFF";}
const tintaSobre=h=>CT("#101418",h)>=CT("#FFFFFF",h)?"#101418":"#FFFFFF";
const saturar=(h,k)=>{const[x,s,l]=aHSL(aRGB(h));return aHEX(deHSL([x,Math.min(1,s*k),l]));};
function patronCSS(t,c1,c2){switch(t){
  case "bastones":return `repeating-linear-gradient(90deg,${c1} 0 6.5vw,${c2} 6.5vw 13vw)`;
  case "franja":  return `linear-gradient(180deg,${c1} 0 30%,${c2} 30% 62%,${c1} 62% 100%)`;
  case "banda":   return `linear-gradient(114deg,${c1} 0 30%,${c2} 30% 56%,${c1} 56% 100%)`;
  case "mitades": return `linear-gradient(100deg,${c1} 0 48%,${c2} 52% 100%)`;
  default:        return `radial-gradient(120% 90% at 50% 0%,${c2} 0%,${c1} 70%)`;}}
const ptsEstrella=(cx,cy,r)=>{const p=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.42:r;
    p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(" ");};
/* Cuántas se DIBUJAN, que no es lo mismo que cuántas tiene.
   Boca lleva 74 títulos y en el escudo de la camiseta pone 50: ni el club
   las muestra todas. Pasada la docena dejan de leerse como estrellas y
   quedan como manchas, así que el fondo muestra unas cuantas y el número
   verdadero se guarda aparte para escribirlo donde corresponda.          */
const TOPE_ESTRELLAS = 12;
function estrellasFondo(n,color){ if(!n)return "none";
  n = Math.min(n, TOPE_ESTRELLAS);
  const W=1000,H=620,porFila=n<=6?n:14,filas=Math.ceil(n/porFila);
  const tam=n<=3?30:n<=8?26:Math.max(11,26-n*.24); let g="",hechas=0;
  for(let f=0;f<filas&&hechas<n;f++){const enFila=Math.min(porFila,n-hechas),R=560+f*78;
    const arco=Math.min(1.5,.16*enFila);
    for(let k=0;k<enFila;k++,hechas++){const t=enFila===1?0:-arco/2+(arco*k)/(enFila-1);
      g+=`<polygon points='${ptsEstrella(W/2+R*Math.sin(t),700-R*Math.cos(t),tam)}'/>`;}}
  return `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'><g fill='${color}'>${g}</g></svg>`)}")`;}
function hojaMinima(lav,tin,pA,pB,min=4.5){
  for(let b=.45;b<=1.001;b+=.03){let peor=Infinity;
    for(const f of lav) for(const pp of [pA,pB]){const eff=mezclar(f,pp,b);
      for(const t of tin) peor=Math.min(peor,CT(t,eff));}
    if(peor>=min)return Math.min(1,b);} return 1;}

function pintarColores(){
  const T=TEMAS[temaReal()],fondo=T.fondo,r=document.documentElement.style,osc=temaReal()==="oscuro";
  r.setProperty("--fondo",fondo); r.setProperty("--tinta",T.tinta);
  r.setProperty("--tinta-2",T.tinta2); r.setProperty("--tinta-3",T.tinta3);
  r.setProperty("--borde",T.borde); r.setProperty("--barra",T.barra);
  r.setProperty("--acento",CLUB.color); r.setProperty("--sobre-acento",tintaSobre(CLUB.color));
  r.setProperty("--acento-txt",legible(CLUB.color,fondo));
  r.setProperty("--acento-suave",mezclar(CLUB.color,fondo,.88));
  const c1=saturar(CLUB.color,1.5), c2=saturar(CLUB.color2,1.5);
  const cE=CT(CLUB.color2,fondo)>=CT(CLUB.color,fondo)?c2:c1;
  const satDe=h=>aHSL(aRGB(h))[1];
  const tinte=satDe(c1)>=.25?c1:c2, tinte2=tinte===c1?c2:c1;
  const tintas=[T.tinta,T.tinta2,T.tinta3];
  let pA=T.papel,pB=T.papel;
  for(let k=(osc?.22:.18);k>=0;k-=.02){
    pA=mezclar(T.papel,tinte,k); pB=mezclar(T.papel,tinte2,k*.45);
    if(Math.min(...[pA,pB].flatMap(p=>tintas.map(t=>CT(t,p))))>=6.2) break;}
  const lavados=[c1,c2,cE].map(c=>mezclar(fondo,c,OP));
  const beta=hojaMinima(lavados,tintas,pA,pB);
  const rgba=(h,a)=>{const[x,y,z]=aRGB(h);return `rgba(${x},${y},${z},${a})`;};
  r.setProperty("--seña",patronCSS(CLUB.patron,c1,c2));
  r.setProperty("--seña-op",OP);
  r.setProperty("--seña-blur",(CLUB.patron==="bastones"?18:60)+"px");

  r.setProperty("--estrellas-op",OP*.5);
  r.setProperty("--hoja",patronCSS(CLUB.patron,rgba(pA,beta),rgba(pB,beta)));
  r.setProperty("--papel",pA);
  document.getElementById("btema").textContent=osc?"☀":"☾";
}

const J={ key:"", reqs:0, temporada:2026, fixtures:[], fx:null, pool:{A:[],B:[]},
  nom:{A:"",B:""}, id:{A:CLUB.apiId,B:0}, esLocalA:true, xiA:[], xiB:[],
  formA:"4-3-3", formB:"4-3-3", K:{linea:0,presion:0,ancho:0,ritmo:0},
  sim:null, real:null, paso:"key", msg:"", err:"" };

async function api(path, params={}){
  const url=BASE+path+(Object.keys(params).length?"?"+new URLSearchParams(params):"");
  const r=await fetch(url,{headers:{"x-apisports-key":J.key}});
  J.reqs++;
  const j=await r.json();
  if(j.errors&&Object.keys(j.errors).length&&!Array.isArray(j.errors))
    throw new Error(Object.values(j.errors).join(" · "));
  return j.response||[];
}

async function plantel(fids, teamId){
  const map=new Map();
  for(const fid of fids){
    let resp; try{ resp=await api("/fixtures/players",{fixture:fid}); }catch(e){ continue; }
    (resp||[]).forEach(eq=>{
      if(eq.team.id!==teamId) return;
      (eq.players||[]).forEach(j=>{
        const st=j.statistics?.[0]||{}, g=st.games||{};
        if(!g.minutes) return;
        const id=j.player.id;
        if(!map.has(id)) map.set(id,{id,nombre:j.player.name,pos:g.position?.[0]||"M",ratings:[],mins:0,apar:0});
        const p=map.get(id);
        if(g.rating) p.ratings.push(parseFloat(g.rating));
        p.mins+=g.minutes||0; p.apar++;
      });
    });
  }
  return [...map.values()].sort((a,b)=>fuerza(b).v-fuerza(a).v);
}

const JUGADO = f => ["FT","AET","PEN"].includes(f.fixture.status.short);

async function cargarTemporada(){
  J.err=""; J.msg="Cargando la temporada…"; pintar();
  try{
    const fx=await api("/fixtures",{team:J.id.A,season:J.temporada,league:LEAGUE});
    /* Antes solo traía los terminados y eso convertía el juego en un museo.
       El gancho es simular el partido del domingo, no el de mayo.        */
    J.fixtures=fx.filter(f=>JUGADO(f) || f.fixture.status.short==="NS")
                 .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date));
    if(!J.fixtures.length) throw new Error("No hay partidos en "+J.temporada+".");
    J.proximo=J.fixtures.find(f=>!JUGADO(f));
    J.msg=J.fixtures.filter(JUGADO).length+" jugados · "+
          J.fixtures.filter(f=>!JUGADO(f)).length+" por venir · "+J.reqs+" pedidos";
    J.paso="fixture";
    const guardado = leerPronostico();
    if(guardado && guardado.c === CLUB.id && guardado.t === J.temporada){
      pintar(); return restaurar(guardado);
    }
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* Reconstruye un pronóstico guardado: busca el partido, arma los planteles
   igual que siempre y vuelve a poner los mismos jugadores en los mismos
   puestos. Si el partido ya se jugó, ofrece revelar de una.              */
async function restaurar(g){
  const i = J.fixtures.findIndex(f => f.fixture.id === g.f);
  if(i < 0){ J.err = "El pronóstico es de un partido que no está en esta temporada."; return pintar(); }
  await elegirPartido(i);
  if(J.paso !== "armar") return;
  J.formA = g.fa; J.formB = g.fb; J.K = g.k || J.K;
  const rearmar = (ids, form, pool) => slotsDe(form).flatMap(l =>
    Array.from({length:l.n}, () => ({cat:l.cat}))).map((slot, k) => {
      const p = pool.find(x => x.id === ids[k]);
      return p ? {...p, slotCat: slot.cat} : null;
    });
  J.xiA = rearmar(g.a, g.fa, J.pool.A).map((p,k)=> p || autoXI(J.pool.A,g.fa)[k]);
  J.xiB = rearmar(g.b, g.fb, J.pool.B).map((p,k)=> p || autoXI(J.pool.B,g.fb)[k]);
  J.msg = "Pronóstico recuperado del link" + (J.jugado ? " — este partido ya se jugó." : ".");
  pintar();
}

async function elegirPartido(i){
  J.err=""; J.fx=J.fixtures[i]; J.jugado=JUGADO(J.fx); J.real=null; J.sim=null;
  J.esLocalA = J.fx.teams.home.id===J.id.A;
  J.id.B = J.esLocalA? J.fx.teams.away.id : J.fx.teams.home.id;
  J.nom.A = J.esLocalA? J.fx.teams.home.name : J.fx.teams.away.name;
  J.nom.B = J.esLocalA? J.fx.teams.away.name : J.fx.teams.home.name;
  J.msg="Armando los planteles con los partidos ANTERIORES. No miro este.";
  pintar();
  try{
    const antes = f => new Date(f.fixture.date) < new Date(J.fx.fixture.date);
    const mios = J.fixtures.filter(antes).slice(-3);
    let rivales=[];
    try{
      const all=await api("/fixtures",{team:J.id.B,season:J.temporada,league:LEAGUE});
      rivales=all.filter(f=>["FT","AET","PEN"].includes(f.fixture.status.short)&&antes(f))
        .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date)).slice(-3);
    }catch(e){}
    J.pool.A=await plantel(mios.map(f=>f.fixture.id), J.id.A);
    J.pool.B=await plantel(rivales.map(f=>f.fixture.id), J.id.B);
    if(J.pool.A.length<11||J.pool.B.length<11)
      throw new Error("No hay suficientes partidos previos. Elegí uno más avanzado en la temporada.");
    J.xiA=autoXI(J.pool.A,J.formA); J.xiB=autoXI(J.pool.B,J.formB);
    J.msg=J.pool.A.length+" jugadores tuyos · "+J.pool.B.length+" del rival · "+J.reqs+" pedidos";
    J.paso="armar";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

function simular11(){
  if(J.animando) return;
  const t=tacticas(J.K);
  const LA=lineas(J.xiA), LB=lineas(J.xiB);
  const xgA=xgDe(LA,LB,J.esLocalA,t.mine,bonusAncho(J.xiA,t.ancho));
  const xgB=xgDe(LB,LA,!J.esLocalA,t.theirs,1)+t.theirsFlat;
  J.animando=true;
  const b=$("bsim"); if(b){ b.disabled=true; b.textContent="Jugando…"; }
  document.getElementById("campo")?.scrollIntoView({behavior:"smooth",block:"center"});
  animarPartido(xgA, xgB, marc=>{
    J.animando=false;
    J.sim=simular(xgA,xgB); J.sim.notas=t.notas; J.sim.estaVez=marc;
    J.paso="resultado"; pintar();
    setTimeout(()=>document.querySelector(".res")?.scrollIntoView({behavior:"smooth",block:"center"}),90);
  });
}

async function revelar(){
  J.err=""; J.msg="Buscando el once del DT y lo que pasó…"; pintar();
  try{
    const [al,ev]=await Promise.all([
      api("/fixtures/lineups",{fixture:J.fx.fixture.id}),
      api("/fixtures/events",{fixture:J.fx.fixture.id}),
    ]);
    const mio=al.find(x=>x.team.id===J.id.A);
    const rojas=(ev||[]).filter(e=>e.type==="Card"&&/Red/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed||45, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const penales=(ev||[]).filter(e=>e.type==="Goal"&&/Missed Penalty/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const g=J.fx.goals, misG=J.esLocalA?g.home:g.away, susG=J.esLocalA?g.away:g.home;
    J.real={ once:(mio?.startXI||[]).map(x=>x.player), formacion:mio?.formation,
      misG, susG, rojas, penales,
      simConRojas: rojas.length? simExpulsion(J.sim.xgA,J.sim.xgB,rojas) : null };
    J.msg=""; J.paso="revelado";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* ── LA CANCHA ────────────────────────────────────────────────────────────
   Los dos equipos en el MISMO campo, como en PC Fútbol: el tuyo abajo
   atacando para arriba, el rival arriba atacando para abajo. Tocás un
   globito y elegís quién lo ocupa.                                       */
function coordsDe(form, arriba){
  const slots=slotsDe(form), filas=slots.length, out=[];
  slots.forEach((l,i)=>{
    const t=i/(filas-1);
    const y = arriba ? 7 + t*36 : 93 - t*36;
    for(let j=0;j<l.n;j++) out.push({ x:(j+1)/(l.n+1)*100, y, cat:l.cat });
  });
  return out;
}
const apellido = nom => { const w=String(nom||"").trim().split(/\s+/); return w[w.length-1]||"—"; };

function campoHTML(){
  const cA=coordsDe(J.formA,false), cB=coordsDe(J.formB,true);
  const globo=(p,c,lado,i)=>`
    <div class="jug" style="left:${c.x}%;top:${c.y}%" data-lado="${lado}" data-slot="${i}" data-cat="${c.cat}">
      <div class="b" style="background:${lado==="A"?CLUB.color:"#B3261E"};color:#fff">${c.cat}</div>
      <div class="n">${esc(apellido(p&&p.nombre))}</div></div>`;
  return `<div class="campo" id="campo">
    <div class="ln" style="left:0;right:0;top:50%;height:0"></div>
    <div class="ln" style="left:50%;top:50%;width:24%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div>
    <div class="ln" style="left:24%;right:24%;top:-2px;height:13%"></div>

    ${cB.map((c,i)=>globo(J.xiB[i],c,"B",i)).join("")}
    ${cA.map((c,i)=>globo(J.xiA[i],c,"A",i)).join("")}
    <div class="pelota" id="pelota" style="left:50%;top:50%"></div>
    <div class="reloj" id="reloj" hidden>0'</div>
    <div class="gol" id="golazo">¡GOL!</div>
  </div>
  <div class="equipos">
    <span class="e"><span class="pt" style="background:#B3261E"></span>${esc(J.nom.B)}</span>
    <span class="e">${esc(J.nom.A)}<span class="pt" style="background:${CLUB.color}"></span></span>

}

/* ── EL PARTIDO ANIMADO ───────────────────────────────────────────────────
   Lo que se ve es UNA de las 6000 simulaciones, no un promedio. Los goles
   se sortean con la misma Poisson que usa el modelo, así que lo que pasa en
   pantalla es una realización honesta del pronóstico — no una animación
   decorativa que después se contradice con el número.                     */
function animarPartido(xgA, xgB, alTerminar){
  const gA=poissonUno(xgA), gB=poissonUno(xgB);
  const minutos = n => Array.from({length:n},()=>3+Math.floor(Math.random()*86)).sort((a,b)=>a-b);
  const eventos=[...minutos(gA).map(m=>({m,lado:"A"})), ...minutos(gB).map(m=>({m,lado:"B"}))]
    .sort((a,b)=>a.m-b.m);
  const posesion = xgA/(xgA+xgB);
  const pel=$("pelota"), rel=$("reloj"), gol=$("golazo");
  if(!pel) return alTerminar({A:gA,B:gB});
  rel.hidden=false; rel.textContent="0'";
  let min=0, marc={A:0,B:0}, k=0;
  const reloj=setInterval(()=>{
    min+=3;
    if(min>90){ clearInterval(reloj); rel.textContent="90'  "+marc.A+"-"+marc.B;
      setTimeout(()=>alTerminar(marc), 500); return; }
    let x=14+Math.random()*72;
    let y = Math.random()<posesion ? 12+Math.random()*36 : 52+Math.random()*36;
    let huboGol=false;
    while(k<eventos.length && eventos[k].m<=min){
      const e=eventos[k++]; marc[e.lado]++; huboGol=true;
      x=50; y = e.lado==="A" ? 5 : 95;
    }
    pel.style.left=x+"%"; pel.style.top=y+"%";
    rel.textContent = min+"'  "+marc.A+"-"+marc.B;
    if(huboGol){ gol.classList.add("on"); setTimeout(()=>gol.classList.remove("on"), 550); }
  }, 235);
}

/* ── elegir jugador para un puesto ── */
function abrirPicker(lado, slot, cat){
  const pool=J.pool[lado], xi=(lado==="A"?J.xiA:J.xiB);
  const enCancha=new Set(xi.filter(Boolean).map(p=>p.id));
  const ord=[...pool].map(p=>({p, v: fuerza(p).v - penalPuesto(p.pos,cat)}))
    .sort((a,b)=>b.v-a.v);
  const d=document.createElement("div"); d.className="picker";
  d.innerHTML=`<div class="hoja2">
    <h4>¿Quién juega de ${cat==="G"?"arquero":cat==="D"?"defensor":cat==="M"?"volante":"delantero"}?</h4>
    <p class="aviso" style="margin:0 0 10px">El número es su fuerza EN ESTE PUESTO: ya tiene descontado
    el castigo por jugar fuera de posición.</p>
    ${ord.map(o=>`<div class="opt${enCancha.has(o.p.id)?" enCancha":""}" data-id="${o.p.id}">
      <span class="p">${o.p.pos}</span><span>${esc(o.p.nombre)}</span>
      <span class="v">${o.v.toFixed(2)}</span></div>`).join("")}
  </div>`;
  d.onclick=e=>{
    const o=e.target.closest(".opt");
    if(!o){ if(e.target===d) d.remove(); return; }
    const p=pool.find(x=>x.id===+o.dataset.id);
    const arr=(lado==="A"?J.xiA:J.xiB);
    const yaEsta=arr.findIndex(q=>q&&q.id===p.id);
    if(yaEsta>=0 && yaEsta!==slot){                   // ya jugaba: los intercambia
      const otro=arr[slot];
      arr[yaEsta]= otro? {...otro, slotCat:arr[yaEsta].slotCat} : null;
    }
    arr[slot]={...p, slotCat:cat};
    d.remove(); pintar();
  };
  document.body.appendChild(d);
}

        <div style="display:flex;gap:9px;margin-top:6px">

        <p class="nota">${acerto
          ? "El pronóstico dio en el resultado."
          : "Le erramos. Sin excusas: el modelo dijo otra cosa y el partido dijo esta."}</p>
        ${cab}
      </div>`;
    }
    return out;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════════════════
   EL PRONÓSTICO VIAJA EN EL LINK
   ──────────────────────────────────────────────────────────────────────────
   Un pronóstico sobre un partido que todavía no se jugó hay que poder
   guardarlo. Sin backend la tentación es el almacenamiento del navegador,
   pero eso muere en cuanto cambiás de teléfono y no se puede compartir.

   Va en el hash de la URL. Tiene tres ventajas de una: sobrevive a recargar,
   se puede mandar por WhatsApp, y es EXACTAMENTE el mecanismo que va a
   necesitar "desafiá a un amigo" — el link ya es el pronóstico.
   ══════════════════════════════════════════════════════════════════════════ */
const b64 = {
  poner: o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,""),
  sacar: t => JSON.parse(decodeURIComponent(escape(atob(t)))),
};
function linkDelPronostico(){
  const once = xi => xi.map(p => p ? p.id : 0);
  return location.origin + location.pathname + "#p=" + b64.poner({
    c: CLUB.id, t: J.temporada, f: J.fx.fixture.id,
    fa: J.formA, fb: J.formB, a: once(J.xiA), b: once(J.xiB), k: J.K,
  });
}
function leerPronostico(){
  const m = location.hash.match(/#p=([A-Za-z0-9+/]+)/);
  if(!m) return null;
  try { return b64.sacar(m[1]); } catch(e){ return null; }
}

/* ══════════════════ render y eventos ══════════════════ */
function pintar(){
  pintarColores();
  $("vista").innerHTML = tab==="feed"?vistaFeed() : tab==="juego"?vistaJuego() : vistaNumeros();
  document.querySelectorAll("#barra button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  if(tab==="juego") enganchar();
}

function enganchar(){
  const k=$("k"); if(k) k.oninput=e=>J.key=e.target.value.trim();
  const t=$("temp"); if(t) t.onchange=e=>J.temporada=+e.target.value;
  const bc=$("bcargar"); if(bc) bc.onclick=()=>{
    if(!J.key){ J.err="Pegá la API key primero."; pintar(); return; } cargarTemporada(); };
  document.querySelectorAll(".fx").forEach(el=>el.onclick=()=>{
    el.setAttribute("aria-selected","true"); elegirPartido(+el.dataset.fx); });
  const fa=$("fA"), fb=$("fB");
  if(fa) fa.onchange=e=>{ J.formA=e.target.value; J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  if(fb) fb.onchange=e=>{ J.formB=e.target.value; J.xiB=autoXI(J.pool.B,J.formB); pintar(); };
  document.querySelectorAll(".jug").forEach(g=>g.onclick=()=>{
    if(J.animando) return;
    abrirPicker(g.dataset.lado, +g.dataset.slot, g.dataset.cat);
  });
  document.querySelectorAll("input[data-k]").forEach(r=>r.oninput=e=>{
    J.K[e.target.dataset.k]=+e.target.value;
    const k=KNOBS.find(x=>x.id===e.target.dataset.k), v=+e.target.value;
    e.target.closest(".perilla").querySelector(".pv").textContent =
      Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%";
  });
  const bs=$("bsim"); if(bs) bs.onclick=simular11;
  const ba=$("bauto"); if(ba) ba.onclick=()=>{ J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  const br=$("brev"); if(br) br.onclick=revelar;
  const bg=$("bguardar");
  if(bg) bg.onclick=async()=>{
    const link=linkDelPronostico();
    location.hash = link.split("#")[1];
    try{ await navigator.clipboard.writeText(link);
      $("avisoLink").textContent="Copiado. Guardalo o mandátelo: cuando termine el partido, ese link te muestra la comparación.";
    }catch(e){
      $("avisoLink").textContent="No pude copiarlo solo, pero ya está en la barra de direcciones: copiala de ahí.";
    }
  };
}
