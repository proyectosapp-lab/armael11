<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los 30 · señas para aprobar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E13;color:#EEF1F6;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
header{padding:26px 20px 14px;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:24px;letter-spacing:-.5px}
header p{margin:6px 0 0;color:#8B95A6;font-size:13.5px;max-width:640px;line-height:1.6}
.barra{display:flex;gap:7px;padding:14px 20px 0;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.barra button{border:1px solid #2A313D;background:#151A22;color:#C3CBD8;padding:7px 13px;
  border-radius:9px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}
.barra button[aria-pressed="true"]{background:#fff;color:#0B0E13;border-color:#fff}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px;
  padding:16px 20px 60px;max-width:1180px;margin:0 auto}
.club{border-radius:16px;overflow:hidden;border:1px solid #232A35;background:#12161D;
  position:relative}
.seña{position:relative;height:112px;overflow:hidden}
.lav{position:absolute;inset:-25%;filter:blur(16px);transform:scale(1.2)}
.est{position:absolute;inset:0;background-position:center top;background-size:cover;
  background-repeat:no-repeat;filter:blur(1.5px)}
.mono{position:absolute;left:12px;bottom:10px;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-1px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
.cuerpo{padding:11px 13px 13px}
.cuerpo h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.cuerpo .ciu{font-size:11.5px;color:#8B95A6;margin-top:1px}
.datos{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;font-size:11px;
  color:#8B95A6}
.sw{width:15px;height:15px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
.tag{background:#1B2129;border-radius:6px;padding:2px 7px;font-weight:650;color:#A4AEBE}
.crudo{margin-top:8px;font-size:10.5px;color:#6E7889;line-height:1.5}
.crudo b{color:#8B95A6;font-weight:650}
.alerta{margin-top:8px;font-size:11px;color:#FFB4A8;background:#331A18;border-radius:8px;
  padding:6px 9px;line-height:1.45}
.bloq{margin-top:7px;font-size:10.5px;color:#7FB2E8;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Los 30 · señas para aprobar</h1>
  <p>Cada tarjeta muestra cómo va a verse el fondo de ese club. Los colores los traduje de las
  palabras que pusiste en la planilla, así que <b>todos son aproximados</b>: mirá cuál está
  mal y decime el nombre del club — es más rápido que mandarme 30 códigos de color.</p>
</header>
<nav class="barra" id="barra">
  <button data-f="todos" aria-pressed="true">Todos</button>
  <button data-f="bastones">Bastones</button>
  <button data-f="liso">Lisos</button>
  <button data-f="banda">Banda</button>
  <button data-f="franja">Franja</button>
  <button data-f="otros">Otros</button>
  <button data-f="revisar">Para revisar</button>
</nav>
<div class="rejilla" id="rejilla"></div>

<script>
/*CLUBES*/

const aRGB=h=>{h=h.replace("#","");if(h.length===3)h=[...h].map(c=>c+c).join("");
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const aHEX=([r,g,b])=>"#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(r)+.7152*f(g)+.0722*f(b);};
const CT=(a,b)=>{const x=lum(aRGB(a)),y=lum(aRGB(b));return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function aHSL([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return[0,0,l];const s=l>.5?d/(2-mx-mn):d/(mx+mn);
  const h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;return[h*60,s,l];}
function deHSL([h,s,l]){h=((h%360)+360)%360;if(!s){const v=Math.round(l*255);return[v,v,v];}
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return t.map(v=>Math.round((v+m)*255));}
const saturar=(h,k)=>{const[x,s,l]=aHSL(aRGB(h));return aHEX(deHSL([x,Math.min(1,s*k),l]));};
const tintaSobre=h=>CT("#101418",h)>=CT("#FFFFFF",h)?"#101418":"#FFFFFF";

/* El patrón "uve" es nuevo: lo pidió la camiseta de Vélez. Dos diagonales
   espejadas, cada una en su mitad, arman la V.                            */
function patronCSS(t,c1,c2){switch(t){
  case "bastones":return `repeating-linear-gradient(90deg,${c1} 0 22px,${c2} 22px 44px)`;
  case "franja":  return `linear-gradient(180deg,${c1} 0 30%,${c2} 30% 62%,${c1} 62% 100%)`;
  case "banda":   return `linear-gradient(114deg,${c1} 0 30%,${c2} 30% 56%,${c1} 56% 100%)`;
  case "mitades": return `linear-gradient(100deg,${c1} 0 48%,${c2} 52% 100%)`;
  case "uve":     return `linear-gradient(58deg,transparent 0 36%,${c2} 36% 62%,transparent 62%) left/50% 100% no-repeat,`
                       + `linear-gradient(302deg,transparent 0 36%,${c2} 36% 62%,transparent 62%) right/50% 100% no-repeat,${c1}`;
  default:        return `radial-gradient(120% 100% at 50% 0%,${c2} 0%,${c1} 72%)`;}}

const ptsEstrella=(cx,cy,r)=>{const p=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.42:r;
    p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(" ");};
/* Cuántas se DIBUJAN, que no es lo mismo que cuántas tiene.
   Boca lleva 74 títulos y en el escudo de la camiseta pone 50: ni el club
   las muestra todas. Pasada la docena dejan de leerse como estrellas y
   quedan como manchas, así que el fondo muestra unas cuantas y el número
   verdadero se guarda aparte para escribirlo donde corresponda.          */
const TOPE_ESTRELLAS = 12;
function estrellasFondo(n,color){ if(!n)return "none";
  n = Math.min(n, TOPE_ESTRELLAS);
  const W=1000,H=620,porFila=n<=6?n:14,filas=Math.ceil(n/porFila);
  const tam=n<=3?30:n<=8?26:Math.max(11,26-n*.24); let g="",hechas=0;
  for(let f=0;f<filas&&hechas<n;f++){const enFila=Math.min(porFila,n-hechas),R=560+f*78;
    const arco=Math.min(1.5,.16*enFila);
    for(let k=0;k<enFila;k++,hechas++){const t=enFila===1?0:-arco/2+(arco*k)/(enFila-1);
      g+=`<polygon points='${ptsEstrella(W/2+R*Math.sin(t),700-R*Math.cos(t),tam)}'/>`;}}
  return `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'><g fill='${color}'>${g}</g></svg>`)}")`;}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FONDO="#0B0E13";
let filtro="todos";

function tarjeta(c){
  const c1=saturar(c.color,1.5), c2=saturar(c.color2,1.5);
  const cE=CT(c.color2,FONDO)>=CT(c.color,FONDO)?c2:c1;
  const alertas=[];
  if(c.estrellas>12) alertas.push("Cargaste <b>"+c.estrellas+" estrellas</b>. A partir de una docena dejan de leerse como estrellas y quedan como textura. ¿Va igual?");
  if(!c.ciudad && c.bloqueadores.length) alertas.push("Choca de nombre con otro club y <b>no tiene ciudad</b>: sin eso no hay con qué distinguirlos.");
  return `<div class="club" data-p="${c.patron}" data-rev="${alertas.length?1:0}">
    <div class="seña">
      <div class="lav" style="background:${patronCSS(c.patron,c1,c2)}"></div>
      <div class="est" style="background-image:${estrellasFondo(c.estrellas,cE)};opacity:.5"></div>
      <div class="mono" style="background:${c.color};color:${tintaSobre(c.color)}">${esc(c.ini)}</div>
    </div>
    <div class="cuerpo">
      <h2>${esc(c.nom)}</h2>
      <div class="ciu">${esc(c.ciudad||"— sin ciudad —")}</div>
      <div class="datos">
        <span class="sw" style="background:${c.color}"></span>
        <span class="sw" style="background:${c.color2}"></span>
        <span class="tag">${esc(c.patron)}</span>
        <span class="tag">${c.estrellas} ★</span>
      </div>
      <div class="crudo"><b>Pusiste:</b> ${esc(c._colorCrudo||"—")}${c._color2Crudo?" / "+esc(c._color2Crudo):""}
        &nbsp;→&nbsp; ${c.color} ${c.color2}</div>
      ${c.bloqueadores.length?`<div class="bloq"><b>Bloqueadores:</b> ${esc(c.bloqueadores.join(" · "))}</div>`:""}
      ${alertas.map(a=>`<div class="alerta">${a}</div>`).join("")}
    </div></div>`;
}

function pintar(){
  const ok=c=> filtro==="todos" ? true
    : filtro==="otros" ? !["bastones","liso","banda","franja"].includes(c.patron)
    : filtro==="revisar" ? (c.estrellas>12 || (!c.ciudad && c.bloqueadores.length))
    : c.patron===filtro;
  document.getElementById("rejilla").innerHTML=CLUBES.filter(ok).map(tarjeta).join("");
  document.querySelectorAll("#barra button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filtro));
}
document.getElementById("barra").onclick=e=>{const b=e.target.closest("button");
  if(!b)return; filtro=b.dataset.f; pintar();};
pintar();
</script>
</body>
</html>
