  if(e.seAcabo)   return "Usaste las " + e.tope + " simulaciones de este mes" + donde + "." + renueva;
  return "Te quedan " + e.quedan + " de " + e.tope + " simulaciones" + donde + "." + renueva;
}

/* ── EL CONTADOR Y LOS PRECIOS, ABAJO DEL BOTÓN DE SIMULAR ───────────────
   Van acá y no adentro del panel de cuenta por una razón concreta: ese panel
   solo se abre si la persona ya tiene cuenta, y el que está probando la app
   por primera vez —que es exactamente a quien hay que contarle que esto
   algún día se paga— no la tiene. El precio se ve donde se siente el tope. */
function bloqueCupo(){
  const liga = ligaAhora();
  const e = estadoCupo({ ...CUPO, bloquea: frenaElCupo(), liga });
  /* Sin límite Y con la liga adentro del plan no hay nada que ofrecer. */
  if(e.ilimitado && e.entraLiga)
    return `<p class="aviso" style="margin-top:10px">${esc(textoCupo(e, CUPO.hasta, liga))}</p>`;

  /* ── ACÁ SE COMPRA, Y NO EN OTRO LADO ──────────────────────────────────
     Esto eran tres `<span>` con los precios, de adorno: los botones que de
     verdad compran vivían adentro del panel de cuenta, y ese panel solo
     dibuja los planes si la persona YA entró y YA eligió usuario. O sea que
     el que abría la app y quería pagar veía los precios y no tenía dónde
     tocar. Fausto lo dijo derecho: "no hay un solo botón para comprar".

     El razonamiento original era correcto —el precio se ve donde se siente
     el tope— y estaba a medio hacer: se mostró el precio y no el botón. Los
     dos van juntos, en el mismo lugar, para todos.

     Al que no tiene cuenta no se le esconde el botón: se le abre la cuenta.
     El plan tiene que quedar atado a alguien, y eso se explica en el momento
     en que hace falta, no antes. */
  return `<p class="aviso" style="margin-top:10px">
      <b>${esc(textoCupo(e, CUPO.hasta, liga))}</b>
      ${CUPO_CFG.cobrando
        ? "Con un plan simulás sin límite y sin avisos."
        : "Cuando se pase de diez va a hacer falta un plan; todavía no se cobra nada."}
    </p>${tarjetasDePlan()}`;
}

/* ── LOS TRES BOTONES DE PLAN ────────────────────────────────────────────
   Una sola definición, usada en los dos lugares donde aparecen: abajo del
   botón de Simular —donde se siente el tope— y adentro del panel de cuenta.
   Estaban duplicados y por eso uno de los dos se quedó sin botones.

   Adentro de la app de Play, la compra la hace Play. Si su facturación
   todavía no está disponible —la versión instalada es anterior, o los
   productos no están dados de alta— los botones se apagan y se dice por
   qué. Lo que NO se hace nunca es ofrecer Mercado Pago ni mandar a pagar
   afuera: eso es exactamente lo que Google prohíbe. */
/* ══════════════════ INSTALAR LA APP DESDE LA WEB ══════════════════════
   Chrome avisa que la app se puede instalar con un evento, y si nadie lo
   atiende el navegador se guarda la oferta para sí mismo, escondida en su
   menú. Acá se lo queda la app para poder ofrecerlo donde se ve.

   Se captura lo antes posible —el evento llega una sola vez y temprano— y
   por eso este bloque va arriba de todo lo demás. */
/* ── DE DÓNDE VINO ESTA PERSONA ──────────────────────────────────────────
   Va acá arriba, antes que nada, por una razón concreta: lo primero que
   hace es SACAR el `?c=` de la barra de direcciones. Cuanto más tarde se
   haga, más chance hay de que alguien copie el link con el código adentro
   y se lo mande a quince amigos; a partir de ahí el anuncio figura
   trayendo gente que llegó por un amigo y el número deja de servir.

   Si la persona no vino de una campaña —la enorme mayoría— no hace nada.
   El `typeof` es porque sin backend el archivo ni se carga.            */
if(typeof arrancarCampana === "function"){ try{ arrancarCampana(); }catch(e){} }
const contar = h => { try{ if(typeof hitoCampana === "function") hitoCampana(h); }catch(e){} };
/* Lo mismo pero para TODOS, no solo para el que vino de un anuncio, y una
   vez por día en vez de una vez en la vida. Es lo que contesta la pregunta
   que Play Console con doce testers no contesta: cuántos volvieron hoy, y
   cuántos de esos entraron por el ícono de la app y no por el navegador.
   `esDeLaTienda()` se le pasa hecho porque la regla del referrer vive acá. */
const usar = h => { try{ if(typeof usoDiario === "function") usoDiario(h, esDeLaTienda()); }catch(e){} };

let PROMPT_INSTALAR = null;
if(typeof window !== "undefined"){
  window.addEventListener("beforeinstallprompt", ev => {
    ev.preventDefault();
    PROMPT_INSTALAR = ev;
    try{ pintar(); }catch(e){}
  });
  window.addEventListener("appinstalled", () => {
    PROMPT_INSTALAR = null;
    /* Vale más que una simulación: el instalado es el que puede volver
       solo y el único que puede recibir el aviso del once del DT. */
    contar("instalo");
    try{ pintar(); }catch(e){}
  });
}

function bloqueInstalar(){
  let modo = "no";
  try{
    modo = modoDeInstalacion(window, { enLaTienda: esDeLaTienda(), hayPrompt: !!PROMPT_INSTALAR });
  }catch(e){ return ""; }
  if(modo === "no" || modo === "ya" || modo === "tienda") return "";

  /* En iPhone no hay evento: hay que explicar los dos toques. Y no es un
     detalle de comodidad —en iOS los avisos SOLO llegan si la app se agregó
     a la pantalla de inicio—, así que se dice para qué sirve hacerlo. */
  if(modo === "ios")
    return `<div class="pendiente" style="margin-top:12px">
      <b>Agregala a tu pantalla de inicio.</b><br>
      Tocá el botón de Compartir de Safari y elegí <b>Agregar a inicio</b>.
      Queda con ícono propio, abre sin barra del navegador y es la única forma
      de que te llegue el aviso cuando sale el once del DT.</div>`;

  return `<button class="acc" id="binstalar" style="width:100%;margin-top:12px">
      Instalar Armá el 11</button>
    <p class="aviso" style="margin:6px 0 0">Queda con ícono propio, abre sin la barra
      del navegador y te puede avisar cuando sale el once del DT.</p>`;
}

function tarjetasDePlan(){
  /* ── OJO CON EL ORDEN, QUE YA NOS MORDIÓ ──────────────────────────────
     Esto ahora se dibuja en la PORTADA, o sea en el primer `pintar()`, y
     las variables de la cuenta (`conBackend`, `PLANES`, `PLAY_OK`) se
     declaran bastante más abajo con `const`/`let`. Hasta que esa línea no
     corre, nombrarlas no da `undefined`: tira ReferenceError, y como pasa
     adentro de `pintar()` se lleva puesto el dibujo entero y la portada
     queda en blanco.

     Y OJO CON EL ATAJO QUE NO FUNCIONA: `typeof` **no** salva de esto. Con
     una variable que no existe, `typeof` devuelve "undefined" y listo; con
     un `const` declarado más abajo, tira igual. Es la diferencia entre "no
     existe" y "todavía no nació", y solo la segunda es un error. Por eso va
     un try/catch, que es feo y es lo único que sirve.

     Una vez que `PLANES` tiene algo, el script ya corrió completo y el
     resto se puede nombrar normalmente. */
  try{
    if(!conBackend || !PLANES.length) return "";
  }catch(e){ return ""; }
  const porPlay = esDeLaTienda();
  const playListo = !porPlay || PLAY_OK !== false;
  const apagado = comprando || !CUPO_CFG.cobrando || !playListo;
  /* ── POR QUÉ EL TEXTO Y EL BOTÓN SON DOS COSAS ────────────────────────
     Antes cada plan ERA un botón: un `.boton.flaco` de ancho completo, o
     sea un rectángulo transparente, con borde gris fino, texto alineado a
     la izquierda y el precio en gris claro adentro. Tres de esos, uno
     abajo del otro, no se leen como botones: se leen como tres cajitas de
     texto. Fausto lo dijo así, "texto encasillado", y tenía razón: no
     había ni una sola señal de que eso se pudiera apretar. Ni relleno, ni
     sombra, ni una palabra que dijera qué pasa si lo tocás.

     Ahora el texto es texto —nombre, precio, qué incluye— y al lado hay
     un botón de verdad, con el mismo relleno verde y la misma sombra que
     el botón de Simular, que es el botón que todo el mundo ya aprendió a
     apretar en esta app. Y dice "Comprar", que es exactamente lo que
     hace: un botón que no dice qué hace no es mucho mejor que una caja.

     Se fue también el recuadro de cada plan. Con el botón adentro, el
     borde no sumaba nada y agregaba ruido; una línea fina entre planes
     alcanza para separarlos y ocupa la mitad del alto.

     El `data-plan` sigue en el botón, que es lo que engancha `[data-plan]`:
     lo que cambió es cómo se ve, no cómo se compra. */
  const tarjeta = p => `<div class="plan">
      <div class="plan-txt">
        <b>${esc(p.nombre || "Plan")}</b>
        <span><b class="plan-precio">${esc(plata(p.precio))}</b> por mes · ${esc(p.detalle || "")}</span>
      </div>
      <button class="acc plan-btn" data-plan="${esc(p.id)}" ${apagado ? "disabled" : ""}
        >Comprar</button>
    </div>`;

  return `<div class="planes">${PLANES.map(tarjeta).join("")}</div>
    <p class="aviso" style="margin-top:8px">${!CUPO_CFG.cobrando
      ? "<b>Todavía no se cobra nada.</b> Los precios están acá para que sepas de antemano cuánto va a salir cuando se prenda."
      : !playListo
        ? "<b>La compra desde la app todavía no está disponible.</b> " +
          (PLAY_POR_QUE ? esc(PLAY_POR_QUE) + " " : "") +
          "Si ya tenés un plan, entrá con tu cuenta y lo vas a tener acá."
        : porPlay
          ? "Se paga con Google Play. Se vence solo: no queda nada debitándose todos los meses."
          : "Se paga con Mercado Pago. Se vence solo: no queda nada debitándose todos los meses."}</p>`;
}

/* ── QUE TOCASTE ──────────────────────────────────────────────────────────
   La lista de lo que la persona cambio respecto de lo que la app puso sola.
   Vacia = "tal cual viene". Se muestra debajo del boton ANTES de simular y
   en la tarjeta del resultado DESPUES, y es lo que hace visible que las
   perillas, el once y la formacion entran en la cuenta: si simulaste con
   presion alta, el resultado dice "con presion alta". Sin esto, la relacion
   entre tocar una perilla y el numero que sale era un acto de fe. */
function ajustes(){
  const a = [];
  const ids = J.xiA.filter(Boolean).map(p=>p.id);
  const cambiados = ids.filter(id=>!J.auto.xiA.includes(id)).length;
  if(J.auto.xiA.length && cambiados) a.push(cambiados===1 ? "1 cambio en el once" : cambiados+" cambios en el once");
  if(J.auto.formA && J.formA!==J.auto.formA) a.push("formación "+J.formA);
  const pl = planteoDe(J.K), plB = planteoDe(J.KB);
  if(pl && pl!=="normal") a.push("planteo: "+(PLANTEOS.find(x=>x.id===pl)||{}).n.toLowerCase());
  else if(!pl) a.push("perillas propias");
  if(plB && plB!=="normal") a.push("rival: "+(PLANTEOS.find(x=>x.id===plB)||{}).n.toLowerCase());
  else if(!plB) a.push("perillas del rival");
  const cuantas = T => Object.keys(INDICACIONES_POR_DEFECTO)
    .filter(k=>(T||{})[k]!==INDICACIONES_POR_DEFECTO[k]).length;
  const ind = cuantas(J.IND) + cuantas(J.INDB);
  if(ind) a.push(ind===1 ? "1 indicación" : ind+" indicaciones");
  const d = J.desde;
  if(d.minuto>0||d.golesA||d.golesB||d.rojasA||d.rojasB) a.push("desde el "+d.minuto+"'");
  return a;
}

/* ── LA FIRMA DE LOS AJUSTES ──────────────────────────────────────────────
   Todo lo que entra en la cuenta, en un solo texto: el partido, los dos
   onces en su orden, las dos formaciones, las perillas de los dos, las
   indicaciones y desde donde se simula. Dos usos:
     1. es la SEMILLA del azar de las 6.000 simulaciones -mismos ajustes,
        mismos porcentajes, hasta el decimal-;
     2. y es lo que permite saber si algo cambio desde la ultima vez. */
function firmaDeAjustes(){
  const ids = xi => xi.map(p=>p?p.id:0).join(",");
  const k = K => [K.linea,K.presion,K.ancho,K.ritmo].join(",");
  const d = J.desde;
  return [J.fx?.fixture?.id || J.liga || "", J.id.A, J.id.B, ids(J.xiA), ids(J.xiB), J.formA, J.formB,
          k(J.K), k(J.KB),
          /* LAS DOS TANDAS. Con una sola acá, cambiarle una indicación al
             rival daba la MISMA semilla y por lo tanto el mismo resultado:
             la pantalla ofrecería una palanca que no mueve nada. */
          Object.keys(INDICACIONES_POR_DEFECTO).map(x=>J.IND[x]).join(","),
          Object.keys(INDICACIONES_POR_DEFECTO).map(x=>J.INDB[x]).join(","),
          d.minuto, d.golesA, d.golesB, d.rojasA, d.rojasB,
          /* QUIÉN falta, no solo cuántos. Sin esto, cambiar al expulsado de
             defensor a delantero daría la misma semilla y el mismo
             resultado: una palanca que se ve y no hace nada. */
          faltan("A").join(","), faltan("B").join(",")].join("|");
}

/* ── TU ONCE CONTRA EL DEL DT ────────────────────────────────────────────
   Se cruza por id cuando la API lo trae -que es siempre en las formaciones
   reales- y por apellido sin tildes cuando no, que es lo que pasa en las
   pruebas y en algun dato viejo. Devuelve tres listas que suman once. */
/* "G. Baez Corradi" es Baez Corradi, no Corradi: se sacan las iniciales de
   adelante y se deja el resto. "M. A. Galarza" queda Galarza. */
function apellidoDe(n){
  const t=String(n||"").trim().split(/\s+/).filter(Boolean);
  let iniciales=0;
  while(t.length>1 && /^[A-ZÁÉÍÓÚÑ]\.?$/.test(t[0])){ t.shift(); iniciales++; }
  /* "G. Baez Corradi" trae iniciales: lo que queda es el apellido entero.
     "Santiago Fernandez" no trae: lo primero es el nombre, y se saca. */
  if(iniciales) return t.length>2 ? t[t.length-1] : t.join(" ");
  return t[t.length-1];
}
const plano2 = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function compararOnces(mio, dt){
  const mios = (mio||[]).filter(Boolean), suyos = dt||[];
  const igual = (a,b) => (a.id && b.id) ? a.id===b.id
    : plano2(apellidoDe(a.nombre||a.name)) === plano2(apellidoDe(b.name||b.nombre));
  const coinciden = suyos.filter(p=>mios.some(m=>igual(m,p)));
  const soloDT   = suyos.filter(p=>!mios.some(m=>igual(m,p)));
  const soloVos  = mios.filter(m=>!suyos.some(p=>igual(m,p)));
  return { coinciden, soloDT, soloVos };
}

/* La frase de "con que se simulo". Una sola linea, sin bullets. */
function conQue(lista){
  if(!lista.length) return "Tal cual viene: el once que viene jugando, formación "+J.formA+" y planteo normal.";
  return "Con tus ajustes: "+lista.join(" · ")+".";
}

/* Cuantas quedan, para escribirlo EN EL BOTON. Un contador al costado de la
   pantalla no lo mira nadie antes de apretar; en el boton, si. */
function restanEnBoton(){
  const e = estadoCupo({ ...CUPO, bloquea: frenaElCupo(), liga: ligaAhora() });
  if(!e.entraLiga) return "otra liga";
  return e.ilimitado ? "" : "te quedan " + e.quedan;
}

/* Pura y sin efectos, para poder probarla con casos concretos. */
/* ── UNA CADA DOS SIMULACIONES ───────────────────────────────────────────
   Antes esto era solo tiempo: uno cada sesenta segundos. Salía parecido
   -la simulación dura veinte- pero dependía de a qué ritmo apretara cada
   uno, y con el modo sin animación salía mucho menos seguido. Ahora se
   cuenta lo que se quiere contar: SIMULACIONES.

   `desdeAviso` son las simulaciones hechas desde el último aviso, contando
   la de ahora. No es `hechas % 2` a propósito: si un aviso se saltea por el
   piso de tiempo, la cuenta sigue desde donde quedó en vez de desfasarse
   para siempre.

   Los sesenta segundos QUEDAN, abajo de todo, porque no son una elección
   nuestra: es el mínimo que impone AdSense entre dos avisos. Si las dos
   reglas chocan, gana la que muestra menos. Perder un aviso es barato;
   mostrar dos seguidos es una infracción.                                */
function tocaAviso({ hayRed, hechas, desdeAviso, ultimo, ahora, premium }){
  if(!hayRed) return false;
  if(premium) return false;                    /* es lo que compró */
  if(hechas <= 1) return false;                /* la primera es gratis */
  if((desdeAviso ?? hechas) < AVISO.CADA) return false;
  return (ahora - ultimo) >= AVISO.ESPERA;
}

/* ── DÓNDE SE ENCHUFA LA RED, Y DÓNDE NO ─────────────────────────────────
   Hasta y50 las REGLAS estaban escritas y probadas y no había ningún aviso:
   `momentoDeAviso` decidía que correspondía uno y no pasaba nada. Esto es
   la otra mitad.

   El formato es un banner que aparece DEBAJO DE LA CANCHA mientras el
   partido se juega, y no un cartel que hay que cerrar para seguir. Es la
   misma idea que ya estaba escrita arriba: los veinte segundos SON el
   aviso, el rato durante el cual la app puede mostrar uno sin interrumpir
   nada. Lo que compra el premium es sacarlo Y que la espera pase a seis
   segundos; si el aviso frenara el partido, el premium estaría comprando
   que la app deje de molestar, que es otra clase de producto.

   TRES CANDADOS, y el tercero es el que importa de verdad:

     1. Tiene que haber red configurada (`hayRed`).
     2. El que pagó no ve ninguno.
     3. **ADENTRO DE LA APP DE PLAY, NUNCA.** AdSense es un producto para
        SITIOS WEB. Un AdSense corriendo adentro del webview de una app es
        una infracción de la política de Google, y la sanción no es sobre el
        aviso: es sobre la cuenta entera, que es de donde sale la plata. La
        app de la tienda va sin avisos hasta que exista AdMob, que es otro
        producto, otra cuenta y otro SDK. Este `if` de una línea es lo único
        que separa las dos cosas, así que no se saca. */
let PUBLI_AHORA = false;

function sePuedePublicidad(){
  try{
    if(!hayRed()) return false;
    if(PREMIUM.activo) return false;
    if(typeof esDeLaTienda === "function" && esDeLaTienda()) return false;
    const p = window.SITIO.publicidad;
    return !!(p && p.cliente && p.bloque);
  }catch(e){ return false; }
}

/* El hueco. Se dibuja con alto mínimo reservado a propósito: si el aviso
   entra de golpe y empuja la cancha hacia abajo justo cuando la persona
   está mirando el partido, el aviso deja de ser algo que se tolera y pasa a
   ser algo que molesta. Y lleva la palabra "Publicidad" arriba porque un
   aviso que se disfraza de contenido es exactamente lo que no queremos
   hacer. */
function bloqueDePublicidad(){
  if(!PUBLI_AHORA || !sePuedePublicidad()) return "";
  const p = window.SITIO.publicidad;
  return `<div class="publi" id="publi">
      <small>Publicidad</small>
      <ins class="adsbygoogle" style="display:block"
        data-ad-client="${esc(p.cliente)}" data-ad-slot="${esc(p.bloque)}"
        data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>`;
}

/* Google pide un `push` por cada hueco. Un push de más sobre el MISMO `ins`
   tira "All 'ins' elements in the DOM with class=adsbygoogle already have
   ads in them", y como `pintar()` redibuja la pantalla entera varias veces
   por partido, eso pasaría en cada cuadro. La marca en el elemento es lo
   que lo evita. Todo envuelto: si el script no cargó -bloqueador, red
   caída, cuenta suspendida- el partido tiene que seguir igual. */
function empujarPublicidad(){
  try{
    const ins = document.querySelector("#publi ins.adsbygoogle");
    if(!ins || ins.dataset.empujado) return false;
    ins.dataset.empujado = "1";
    (window.adsbygoogle = window.adsbygoogle || []).push({});
    return true;
  }catch(e){ return false; }
}

/* Devuelve una promesa que se resuelve cuando se puede seguir. Hoy resuelve
   en el acto: el aviso no frena nada, se dibuja al costado del partido. */
async function momentoDeAviso(){
  /* Se cuenta ANTES de preguntar: la simulación de ahora es la que puede
     llevar el aviso, no la siguiente. */
  simulacionesHechas++; simsDesdeAviso++;
  const toca = tocaAviso({ hayRed: hayRed(), hechas: simulacionesHechas,
                           desdeAviso: simsDesdeAviso,
                           ultimo: ultimoAviso(), ahora: Date.now(),
                           premium: PREMIUM.activo });
  PUBLI_AHORA = false;
  if(!toca) return "sin aviso";
  simsDesdeAviso = 0;
  anotarAviso(Date.now());
  /* Acá se enchufa la red, y en ningún otro lado. */
  PUBLI_AHORA = sePuedePublicidad();
  return "aviso";
}

/* ── EL PARTIDO ANIMADO ───────────────────────────────────────────────────
   Lo que se ve es UNA de las 6000 simulaciones, no un promedio. Los goles
   se sortean con la misma Poisson que usa el modelo, así que lo que pasa en
   pantalla es una realización honesta del pronóstico — no una animación
   decorativa que después se contradice con el número.                     */
/* ── LOS JUGADORES SE MUEVEN ─────────────────────────────────────────────
   Antes rebotaba una pelota sola entre veintidós globitos clavados, y se
   notaba: no parecía un partido, parecía un salvapantallas.

   Esto no simula nada —la simulación ya está hecha, son 6.000 partidos— es
   la puesta en escena. Cada jugador se corre hacia la pelota una fracción de
   la distancia, y esa fracción cae con la distancia: el que está cerca va a
   buscarla, el que está lejos apenas se acomoda. El arquero casi no se mueve
   y no se despega del arco. Un temblor chico arriba de todo para que no
   parezcan piezas de metegol moviéndose en bloque.

   Se hace con una variable CSS y no tocando left/top, para no pelear con el
   translate(-50%,-50%) que centra el globito.                            */
/* ── EL BLOQUE SE MUEVE, NO TIEMBLA ──────────────────────────────────────
   Fausto: "los globitos no pasan la mitad de la cancha". Tenía razón y era
   estructural, no una impresión. Los números de antes:

   · Las formaciones ocupan el 36% de la cancha: el de abajo va del 93 al
     57, el de arriba del 7 al 43. La mitad está en el 50. En reposo NO
     había un solo jugador pasando la mitad, y quedaba una franja de 14
     puntos en el medio que nadie pisaba nunca.
   · El movimiento estaba topeado en ±17. Un delantero parado en 57 llegaba
     como mucho a 40: apenas cruzaba. Para pisar el área rival (13)
     necesitaba moverse 44, casi el triple del tope.
   · Y el desplazamiento de bloque competía contra ESE MISMO tope junto con
     la atracción a la pelota, así que en la práctica se anulaban.

   Lo que cambia, y son tres cosas distintas:

   1. EL BLOQUE TIENE SU PROPIO PRESUPUESTO. Se calcula aparte y se suma
      aparte, con un rango de ±30 en vez de pelear por los 17 de la
      atracción. Un equipo que ataca se lleva a sus once treinta puntos
      arriba, que es lo que se ve desde la tribuna.
   2. EL BLOQUE TAMBIÉN SE CORRE DE COSTADO. Un equipo real bascula hacia
      donde está la pelota. Sin eso, los once suben y bajan como un ascensor
      y el partido pasa siempre por el medio.
   3. LA CASILLA DEJA DE SER SAGRADA. Antes cada uno volvía siempre a su
      punto y el ruido era de ±2: nadie se cruzaba con nadie. Ahora el ruido
      es mayor y depende del ritmo, así que las líneas se mezclan.

   Y todo termina clavado adentro de la cancha: por muy volcado que esté un
   equipo, un globito afuera del rectángulo no se lee como presión, se lee
   como un error de dibujo.                                              */
/* ── EL TANTEADOR, UN SOLO LUGAR ─────────────────────────────────────────
   Lo usan las dos tarjetas —la simulación y la realidad— y así no se pueden
   ir separando. Los nombres salen de `J.nom`, con tu club primero, que es la
   misma convención que la línea de abajo de la cancha y el xG. */
const tanteador = (a, b) => `<div class="marcador">
    <span class="eq">${esc(J.nom.A)}</span><b>${String(a).trim()}</b>
    <i>-</i>
    <b>${String(b).trim()}</b><span class="eq">${esc(J.nom.B)}</span>
  </div>`;

/* ── LO QUE ACÁ NO VA, Y NO ES UN OLVIDO ─────────────────────────────────
   Acá vivía `cuanRaro()`: "el partido que viste sale 1 de cada 8". La idea
   era buena —un 3-0 abajo de "partido parejo" desconcierta hasta que
   alguien dice cuánto de raro es— y aun así se fue el 20/9/2026, con todo
   el resto de las aclaraciones de abajo del resultado.

   Se anota acá para que ninguna sesión futura la reinvente creyendo que
   ayuda. La regla está en `claude/nada-de-aclaraciones.md` y se resume en
   un renglón: abajo del resultado van el marcador, el xG y lo que elegiste.
   Nada que explique cómo funciona el motor.

   La rareza del marcador sigue existiendo en `J.partido.prob`: si alguna
   vez hay que mostrarla, hay dónde. Lo que no hay es permiso.          */

const CANCHA = { alto: [3, 97], ancho: [3, 97] };
/* EL ARQUERO TIENE SU METRO Y NADIE MÁS LO PISA. Los de afuera llegan hasta
   el borde del área chica ajena y hasta el borde de la propia, pero no
   arriba del arquero: dos globitos en el mismo punto no son dos jugadores,
   son un borrón. */
const PISO = [12, 88];
const ARCO = { A: [89, 97], B: [3, 11] };
const entre = (v, [a, b]) => Math.max(a, Math.min(b, v));

function moverJugadores(campo, bx, by){
  const r = campo.getBoundingClientRect();
  const K = J.K || {}, KB = J.KB || {};
  const rit = (K.ritmo||0)/100;
  /* Con ritmo alto el equipo se estira, se junta más rápido y se desordena
     más. Es la perilla que más se tiene que ver en movimiento. */
  const amplitud = 1 + 0.6*rit;

  campo.querySelectorAll(".jug").forEach(el => {
    const x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top);
    if(isNaN(x0) || isNaN(y0)) return;
    const arquero = el.dataset.cat === "G";
    const mio = el.dataset.lado === "A";
    /* Cada equipo lee las perillas de SU técnico. El bloque del rival
       responde a lo que puso el rival, no a lo tuyo. */
    const suK = mio ? K : KB;
    const pre = (suK.presion||0)/100, lin = (suK.linea||0)/100;

    /* ── 1. EL BLOQUE ────────────────────────────────────────────────────
       `fase` va de -1 (la pelota en mi área: repliego) a +1 (la pelota en
       la del otro: me vuelco). Con presión alta el equipo sale a buscar más
       arriba; con línea alta arranca de más adelante siempre.            */
    const suArco = mio ? 100 : 0;
    /* LA FASE NO ES LINEAL. Con la cuenta lineal, la pelota a veinte puntos
       de la mitad daba una fase de 0,4: el equipo "atacaba" a medias casi
       todo el partido, porque la pelota rara vez llega al fondo. Y un equipo
       que ataca a medias todo el partido es un equipo que nunca cruza la
       mitad -que fue la queja, por segunda vez-. Un equipo que tiene la
       pelota en campo rival YA esta volcado; lo que cambia con la
       profundidad es cuanto mas. Por eso se multiplica por 1,6 y se recorta:
       a un tercio del campo rival ya esta a fase entera. */
    const fase = entre(1.6 * (Math.abs(by - suArco) - 50) / 50, [-1, 1]);
    const haciaAdelante = mio ? -1 : 1;
    /* EL BLOQUE NO SE MUEVE EN UNA PIEZA: SE ESTIRA. Un equipo que ataca no
       se corre treinta puntos entero como un bloque de metegol — el
       delantero se mete en el área y el central se queda cerca de la
       mitad. Sin esto, o los delanteros no llegan nunca al área, o los
       defensores terminan de delanteros. Es la diferencia entre un equipo
       y un cardumen. */
    /* Los factores se subieron despues de MEDIR el partido animado de verdad,
       no el sondeo con la pelota en el area: con 0,75 / 1 / 1,4 el
       defensor mas adelantado llegaba a 64, el volante a 46 y el delantero
       a 25. O sea: solo el delantero cruzaba, y el bloque se quedaba en su
       mitad. Con estos, atacando, la linea de defensores pisa la mitad, los
       volantes entran claramente en campo rival y el delantero llega al
       area. Que es lo que hace un equipo que ataca. */
    const ESTIRA = { G: 0.2, D: 1.0, M: 1.2, F: 1.5 };
    const estira = ESTIRA[el.dataset.cat] ?? 1;
    /* Y AL REPLEGAR SE INVIERTE. El que más sube atacando es el que menos
       baja defendiendo: el delantero queda arriba esperando la contra,
       mientras los defensores se hunden. Con el mismo factor para los dos
       lados, el 9 terminaba defendiendo adentro de su propia área — que es
       exactamente lo que no hace un 9. */
    const factor = fase >= 0 ? estira : (2 - estira);
    const empuje = (30 + 12*pre) * amplitud;
    let mov = haciaAdelante * (fase * empuje * factor + lin * 6);

    /* ── AL REPLEGAR NO HAY LUGAR PARA TODOS ─────────────────────────────
       Un central ya está parado a doce puntos de su propio arco. Si
       repliega treinta y cuatro como decía la cuenta, termina adentro del
       área chica, arriba del arquero — y eso es exactamente lo que se veía:
       cuatro defensores y un arquero en el mismo metro cuadrado.
       El repliegue de cada uno se limita AL ESPACIO QUE TIENE DETRÁS. El
       que está lejos se hunde, el que ya está hundido se queda donde está.
       Así el bloque se COMPRIME, que es lo que hace un equipo defendiendo,
       en vez de amontonarse contra la línea. */
    const retrocede = mio ? mov > 0 : mov < 0;
    if (retrocede && !arquero) {
      const espacio = Math.max(0, mio ? PISO[1] - y0 : y0 - PISO[0]);
      mov = Math.sign(mov) * Math.min(Math.abs(mov), espacio);
    }
    /* Techo propio: con ritmo y presión al máximo, la cuenta se pasaría de
       la cancha y los once terminarían apilados contra el arco. */
    const bloqueY = entre(mov, arquero ? [-5, 5] : [-40, 40]);

    /* De costado: el equipo bascula hacia la pelota. El arquero también, un
       poco, que es lo que hace un arquero de verdad. */
    const bloqueX = (bx - 50) / 50 * (arquero ? 4 : 9) * amplitud;

    /* ── 2. LA ATRACCIÓN, con su propio tope ─────────────────────────── */
    const dx = bx - x0, dy = by - y0;
    const lejos = Math.hypot(dx, dy);
    const k = (arquero ? .05 : .30) * Math.max(0, 1 - lejos / 62) * amplitud;
    const topeAtraccion = arquero ? 5 : 16;
    const cerca = v => entre(v, [-topeAtraccion, topeAtraccion]);

    /* ── 3. EL DESORDEN ──────────────────────────────────────────────── */
    const ruido = () => (Math.random() - .5) * (arquero ? 1.2 : 5) * amplitud;

    /* El arquero no se despega del arco pase lo que pase: es lo único que
       de verdad tiene una casilla. */
    const y = arquero
      ? entre(y0 + bloqueY + cerca(dy*k) + ruido(), mio ? ARCO.A : ARCO.B)
      : entre(y0 + bloqueY + cerca(dy*k) + ruido(), PISO);
    const x = entre(x0 + bloqueX + cerca(dx*k) + ruido(), CANCHA.ancho);

    el.style.setProperty("--dx", ((x - x0) / 100 * r.width ).toFixed(1) + "px");
    el.style.setProperty("--dy", ((y - y0) / 100 * r.height).toFixed(1) + "px");
  });
}

function quietos(campo){
  campo.classList.remove("jugando");
  campo.querySelectorAll(".jug").forEach(el => {
    el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); });
}

/* ── PRIMERO PASA EL PARTIDO, DESPUES SE MIRA ────────────────────────────
   Estaban pegados: los goles se sorteaban adentro de la animacion, asi que
   el unico modo de saber como termino era mirar los veinte segundos, y la
   unica forma de volver a verlo era simular de nuevo - gastando otra del
   cupo por un partido que ya estaba pagado.

   Ahora se separan. `generarPartido` sortea el partido entero -cuantos goles
   y en que minuto- y devuelve el guion. `mostrarPartido` lo pone en escena.
   Con eso salen gratis las dos cosas que pidieron los testers: el modo
   flash, que es generar sin mostrar; y volver a ver el mismo partido, que es
   mostrar sin generar.

   LA REGLA QUE ORDENA ESTO: una simulacion es UN PARTIDO, y ese partido se
   mira las veces que uno quiera. El cupo cuenta partidos generados, no veces
   que se miran. Cobrar por mirar de nuevo algo que ya se genero seria cobrar
   dos veces por lo mismo.                                                */
function generarPartido(xgA, xgB, desde){
  /* `xgA`/`xgB` ya vienen recortados por el tiempo que queda. Si el partido
     arranca en el minuto 60 con 1-0, el reloj arranca en 60 y el marcador en
     1-0, y se juegan los treinta que faltan. */
  const D = desde || { minuto:0, golesA:0, golesB:0 };
  const desdeMin = Math.max(0, Math.min(89, D.minuto|0));
  /* El sorteo pasa por `sortearMarcador`, que descarta las rarezas -menos de
     1 en 100 con estos goles esperados- y devuelve cuán probable era el que
     quedó. El porqué está escrito en juego.js. */
  const { gA, gB, prob } = sortearMarcador(xgA, xgB);
  const queda = Math.max(1, 90-desdeMin);
  const minutos = n => Array.from({length:n},
    ()=>desdeMin+1+Math.floor(Math.random()*queda)).sort((a,b)=>a-b);
  const eventos=[...minutos(gA).map(m=>({m,lado:"A"})), ...minutos(gB).map(m=>({m,lado:"B"}))]
    .sort((a,b)=>a.m-b.m);
  return { eventos, desdeMin, posesion: xgA/(xgA+xgB), arranca:{ A:D.golesA|0, B:D.golesB|0 },
           prob, marc: { A:(D.golesA|0)+gA, B:(D.golesB|0)+gB } };
}

function mostrarPartido(part, alTerminar){
  const { eventos, desdeMin, posesion } = part;
  const pel=$("pelota"), rel=$("reloj"), gol=$("golazo"), campo=$("campo");
  if(!pel) return alTerminar(part.marc);
  campo?.classList.add("jugando");
  let min=desdeMin, marc={...part.arranca}, k=0;
  /* UNA SOLA CONVENCIÓN, TU CLUB PRIMERO, y el número al lado del nombre.
     El reloj vive ENTRE los dos nombres, así que el orden pasó a significar
     algo: un "1-0" suelto se lee de izquierda a derecha y con los nombres
     al revés decía lo contrario. Ahora ni siquiera hay que deducirlo: cada
     gol está pegado a su equipo y el reloj solo cuenta minutos. Tu club va
     primero en la línea, en el resultado final y en el xG. */
  const gA_ = $("golA"), gB_ = $("golB");
  const pintarGoles = () => {
    if(gA_){ gA_.hidden=false; gA_.textContent=marc.A; }
    if(gB_){ gB_.hidden=false; gB_.textContent=marc.B; }
  };
  rel.hidden=false; rel.textContent=min+"'";
  pintarGoles();
  const reloj=setInterval(()=>{
    min+=1;
    if(min>90){ clearInterval(reloj); rel.textContent="90'"; pintarGoles();
      if(campo) quietos(campo);
      setTimeout(()=>alTerminar(marc), 500); return; }
    let x=14+Math.random()*72;
    let y = Math.random()<posesion ? 12+Math.random()*36 : 52+Math.random()*36;
    let huboGol=false;
    while(k<eventos.length && eventos[k].m<=min){
      const e=eventos[k++]; marc[e.lado]++; huboGol=true;
      x=50; y = e.lado==="A" ? 5 : 95;
    }
    pel.style.left=x+"%"; pel.style.top=y+"%";
    if(campo) moverJugadores(campo, x, y);
    rel.textContent = min+"'"; pintarGoles();
    /* EL GOL SE SIENTE EN LA MANO. Adentro de la app de iPhone el teléfono
       vibra con cada gol del partido simulado; en el navegador esto no
       existe y `vibrar` devuelve false sin hacer nada. Es la diferencia más
       concreta entre la app y el sitio, y la que un revisor de Apple puede
       comprobar en diez segundos. */
    if(huboGol){ gol.classList.add("on"); setTimeout(()=>gol.classList.remove("on"), 550);
      if(typeof vibrar === "function") vibrar("gol"); }
  /* ── POR QUÉ EL PARTIDO DURA VEINTE SEGUNDOS ────────────────────────
     Dos razones, y ninguna es estética.

     La primera: se ve mejor. Antes el reloj saltaba de tres en tres minutos
     y la pelota daba treinta saltos; ahora avanza de a un minuto y da
     noventa. Es un reloj de partido, no un contador.

     La segunda es de producto y es la que hay que respetar: veinte segundos
     por simulación significa que TRES simulaciones seguidas tardan sesenta,
     que es justo el mínimo que AdSense impone entre dos avisos. Con eso, la
     cadencia de publicidad sale sola —una cada tres— sin programar ninguna
     regla de frecuencia y sin pasarse de lo que permite la política.

     Por eso el ritmo YA NO ACELERA EL RELOJ. Antes lo acortaba hasta un 22%
     y eso movía la duración; el ritmo se sigue viendo, pero en cómo se
     mueven los jugadores (ver `amplitud` en moverJugadores), que es donde
     tiene sentido que se vea. Si algún día alguien quiere que esto sea más
     ágil: acortarlo abajo de veinte segundos rompe la cuenta de arriba.  */
  }, Math.round(duracionSim() / 90));
}

/* ── elegir jugador para un puesto ── */
function abrirPicker(lado, slot, cat){
  const pool=J.pool[lado], xi=(lado==="A"?J.xiA:J.xiB);
  const enCancha=new Set(xi.filter(Boolean).map(p=>p.id));
  /* Los que no sumaron un minuto van al final y van avisados. De ellos no
     sabemos nada: su "fuerza" es la media de la liga porque no hay con que
     calcularla, y sin el cartel eso se lee como un jugador promedio y no como
     lo que es, un jugador sobre el que no tenemos dato. */
  const ord=[...pool].map(p=>({p, v: fuerza(p).v - penalPuesto(p.pos,cat)}))
    .sort((a,b)=>(b.p.mins>0)-(a.p.mins>0) || b.v-a.v);
  const d=document.createElement("div"); d.className="picker";
  d.innerHTML=`<div class="hoja2">
    <h4>¿Quién juega de ${cat==="G"?"arquero":cat==="D"?"defensor":cat==="M"?"volante":"delantero"}?</h4>
    <p class="aviso" style="margin:0 0 10px">El número es su fuerza EN ESTE PUESTO: ya tiene descontado
    el castigo por jugar fuera de posición.</p>
    ${ord.map(o=>`<div class="opt${enCancha.has(o.p.id)?" enCancha":""}" data-id="${o.p.id}">
      <span class="p">${o.p.pos}</span><span>${esc(o.p.nombre)}</span>
      ${o.p.mins>0?"":`<span class="sinmin">sin minutos</span>`}
      <span class="v">${o.v.toFixed(2)}</span></div>`).join("")}
  </div>`;
  d.onclick=e=>{
    const o=e.target.closest(".opt");
    if(!o){ if(e.target===d) d.remove(); return; }
    const p=pool.find(x=>x.id===+o.dataset.id);
    const arr=(lado==="A"?J.xiA:J.xiB);
    const yaEsta=arr.findIndex(q=>q&&q.id===p.id);
    if(yaEsta>=0 && yaEsta!==slot){                   // ya jugaba: los intercambia
      const otro=arr[slot];
      arr[yaEsta]= otro? {...otro, slotCat:arr[yaEsta].slotCat} : null;
    }
    arr[slot]={...p, slotCat:cat};
    d.remove(); pintar();
  };
  document.body.appendChild(d);
}

/* Una tarjeta de planteo: los botones armados arriba y las cuatro perillas
   abajo. Es lo MISMO estado — los botones escriben las perillas y las
   perillas mandan. Cuál está encendido se deduce con `planteoDe`, así que
   mover una perilla a mano apaga el botón solo: no hay dos verdades que
   puedan quedar en desacuerdo. */
/* ── CÓMO SE LLAMA CADA LADO ────────────────────────────────────────────
   Fausto, 19/9: "la app sigue mostrando tu equipo y rival cuando querés
   simular un partido, pero eso se presta a confusión cuando querés simular
   un partido de la liga de Perú".

   Tiene razón, y la distinción es exacta. En la página de un club, A es el
   equipo del hincha y "tu / el rival" es la voz del producto: está bien,
   y es parte de lo que hace que la app se sienta de uno.

   En un partido de otra liga no hay ningún "vos". Alianza Lima no es tu
   equipo y Sporting Cristal no es el rival: son dos equipos ajenos, y el
   único texto que no confunde es el nombre de cada uno. Peor todavía con
   las perillas: "el planteo del rival" cuando los dos te dan igual no dice
   de quién estás hablando.

   Lo que NO cambia: "tu once" y "tu simulación" siguen diciendo "tu",
   también en Perú. Ese once lo armaste vos de verdad. */
const partidoPropio = () => !J.liga;
const nombreLado = lado => (J.nom && J.nom[lado]) || (lado === "A" ? "Local" : "Visitante");
/* Recortado, porque va adentro de etiquetas de formulario en dos columnas:
   "Universitario de Deportes" entero parte la fila y desalinea las dos. */
const nombreCorto = (lado, tope = 16) => {
  const s = nombreLado(lado);
  return s.length > tope ? s.slice(0, tope - 1).trim() + "…" : s;
};

function tarjetaPlanteo(lado){
  const mio = lado === "A";
  const K = mio ? J.K : J.KB;
  const activo = planteoDe(K);
  const attr = mio ? "data-k" : "data-kb";

  /* La sugerencia, cuando hay un expulsado. Se ofrece, no se aplica: cambiarle
     el planteo a alguien sin que lo pida es decidir por él en su propio juego. */
  const conUnoMenos = mio ? J.desde.rojasA > 0 : J.desde.rojasB > 0;
  const ganando = mio ? J.desde.golesA > J.desde.golesB : J.desde.golesB > J.desde.golesA;
  const sug = planteoSugerido({ conUnoMenos, ganando });
  const nombreSug = sug ? (PLANTEOS.find(p=>p.id===sug)||{}).n : "";
  const ofrecer = sug && activo !== sug
    ? `<p class="aviso" style="margin:6px 0 0">Con uno menos, lo normal es
        ${mio?"que te metas":"que se meta"} atrás.
        <button class="gh" data-sug="${lado}" data-sugv="${sug}"
          style="margin-left:6px">${esc(nombreSug)}</button></p>`
    : "";

  const elegido = PLANTEOS.find(p=>p.id===activo);
  return `<h3 class="sec">${partidoPropio() ? (mio ? "Tu planteo" : "El planteo del rival")
      : "El planteo de " + esc(nombreLado(lado))}</h3>
    <div class="tarjeta">
      <nav class="filtros">${PLANTEOS.map(p=>
        `<button class="chip" data-pl="${lado}" data-plv="${p.id}"
          aria-pressed="${p.id===activo}">${esc(p.n)}</button>`).join("")}
        ${activo?"":`<button class="chip" aria-pressed="true" disabled>A mano</button>`}
      </nav>
      ${/* El "Normal" dice "sin nada cargado para ningún lado": explicar que
            no pasa nada ocupa un renglón fijo en todas las pantallas. Las
            otras sí cuentan algo y se muestran. */
        !elegido ? `<p class="aviso" style="margin:2px 0 8px">Las perillas están
          movidas a mano. Tocá un planteo para volver a uno armado.</p>`
        : elegido.id === "normal" ? ""
        : `<p class="aviso" style="margin:2px 0 8px">${esc(elegido.dice)}</p>`}
      ${ofrecer}
      ${KNOBS.map(k=>{const v=K[k.id];return `
        <div class="perilla"><div class="ph"><b>${k.n}</b>
          <span class="pv">${Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%"}</span></div>
          <input type="range" min="-100" max="100" value="${v}" ${attr}="${k.id}">
          <div class="ends"><span>${k.izq}</span><span>${k.der}</span></div></div>`;}).join("")}
      ${indicacionesHTML(lado)}
    </div>`;
}

/* ── LAS INDICACIONES, ADENTRO DE LA TARJETA DE CADA EQUIPO ──────────────
   Fausto: "la parte de indicaciones está en un solo equipo. ¿A cuál
   modifica?". Modificaba al A y nada lo decía.

   La respuesta no fue ponerle un título que aclare a cuál: fue MUDARLAS
   adentro de la tarjeta del equipo, que ya tiene su nombre arriba. Un
   bloque suelto con una etiqueta se puede seguir leyendo mal; un bloque que
   vive adentro de la tarjeta de Real Madrid, no. Y de paso desaparece un
   encabezado de la pantalla, que es lo otro que pidió.

   ─── LO QUE SE SACÓ DE TEXTO, Y POR QUÉ ESO Y NO OTRA COSA ───────────────
   La explicación larga del final —"son del planteo y no de cada jugador a
   propósito…"— era buena y estaba en el peor lugar posible: se lee una vez
   en la vida y ocupaba cinco renglones en todas las pantallas para siempre.

   Y la frase de cada opción se muestra SOLO si la opción no es la de por
   defecto. "Cada uno cubre su sector. Es lo normal y no cuesta nada" es
   texto que explica que no pasa nada: tres renglones, uno por grupo, que
   están ahí justamente cuando no hay nada para contar. Cuando elegís algo
   que sí mueve el número, la frase aparece y dice cuánto.                */
function indicacionesHTML(lado){
  const IND = lado === "A" ? J.IND : J.INDB;
  return `<div style="margin-top:6px">${INDICACIONES.map(g=>{
    const eleg = IND[g.id] || g.opciones[0].v;
    const o = g.opciones.find(x=>x.v===eleg) || g.opciones[0];
    const porDefecto = eleg === INDICACIONES_POR_DEFECTO[g.id];
    return `<div class="perilla" style="padding-bottom:2px">
      <div class="ph"><b>${g.n}</b></div>
      <nav class="filtros" style="padding-bottom:4px">${g.opciones.map(x=>
        `<button class="chip" data-ind="${g.id}" data-indlado="${lado}" data-val="${x.v}"
          aria-pressed="${x.v===eleg}">${x.n}</button>`).join("")}</nav>
      ${porDefecto ? "" : `<p class="aviso" style="margin:0">${esc(o.dice)}</p>`}
    </div>`;}).join("")}</div>`;
}

function vistaJuego(){
  const cab = J.err?`<div class="err">${esc(J.err)}</div>`:"";
  const msg = J.msg?`<div class="cargando">${esc(J.msg)}</div>`:"";

  if(J.paso==="key" && window.CACHE) return `
    <h3 class="sec">El 11 de la fecha</h3>
    <div class="tarjeta"><div class="cargando">Cargando el partido…</div>${cab}</div>`;

  if(J.paso==="key") return `
    <h3 class="sec">El 11 de la fecha</h3>
    <div class="tarjeta">
      <p class="bajada" style="margin-top:0">Ponés tu once, el once del rival, tocás dos o tres ajustes
      y simulás. Después revelás qué puso el DT y qué pasó de verdad.</p>
      <label for="k">Tu API key de API-Football</label>
      <input type="password" id="k" placeholder="pegala acá" autocomplete="off" spellcheck="false">
      <p class="aviso">Queda solo en tu navegador y viaja únicamente a api-sports.io.
      No se guarda en ningún lado ni sale de tu teléfono.</p>
      <div class="fila2" style="margin-top:12px">
        <div><label for="temp">Temporada</label>
          <select id="temp">${[2026,2024,2023].map(y=>`<option${y===J.temporada?" selected":""}>${y}</option>`).join("")}</select></div>
        <div style="display:flex;align-items:flex-end"><button class="acc" id="bcargar" style="width:100%">Cargar</button></div>
      </div>
      ${msg}${cab}
    </div>`;

  /* ── LAS LIGAS, AGRUPADAS POR ZONA ──────────────────────────────────────
     Con once ligas, una lista suelta obliga a leerlas todas para encontrar
     la tuya. Agrupadas por continente, el que busca México mira cinco y el
     que busca Italia mira seis.

     Las que no traen zona —una liga bajada por una corrida anterior a este
     cambio— no se pierden: caen al final, sin título si son las únicas. Una
     pantalla nunca puede esconder una liga que la app sí tiene.         */
  const ZONAS = [["america", "América"], ["europa", "Europa"]];
  const botonDeLiga = L => {
    const m = medidaDe(L);
    return `<button class="lg" data-liga="${esc(L.slug)}" aria-pressed="${L.slug===J.liga}">
      ${bandera(L.slug)}
      <span class="lg-t"><b>${esc(L.pais)}</b><small>${esc(L.nombre)}</small></span>
      ${m ? `<span class="lg-m">${esc(m.corto)}</span>` : ""}
    </button>`;
  };
  const listaDeLigas = ls => {
    const puestas = new Set();
    let out = ZONAS.map(([z, titulo]) => {
      const dela = ls.filter(L => (L.zona || "") === z);
      dela.forEach(L => puestas.add(L.slug));
      return dela.length ? `<h4 class="zona">${titulo}</h4>
        <div class="ligas">${dela.map(botonDeLiga).join("")}</div>` : "";
    }).join("");
    const resto = ls.filter(L => !puestas.has(L.slug));
    if(resto.length) out += (out ? `<h4 class="zona">Otras</h4>` : "") +
      `<div class="ligas">${resto.map(botonDeLiga).join("")}</div>`;
    return out;
  };

  /* La lista de otras ligas. Solo aparece si hay ligas publicadas: sin
     ellas, la app es exactamente la de antes. */
  const otrasLigas = () => {
    const ls = ligasParaSimular();
    if(!ls.length) return "";
    return `<h3 class="sec">${PORTADA ? "Elegí la liga" : "Simulá cualquier liga del mundo"}</h3>
      <div class="tarjeta">
        <p class="bajada" style="margin-top:0">${PORTADA
          ? "Cualquier partido de la próxima fecha. Cada liga corre con sus propios números: no se juegan los mismos goles en Argentina que en Inglaterra."
          : "Elegí un país y simulá cualquier partido de su próxima fecha, con los planteles armados con lo que hicieron antes. Cada liga corre con SUS números: no se juegan los mismos goles en Argentina que en Inglaterra."}</p>
        ${listaDeLigas(ls)}
        <p class="aviso" style="margin:10px 0 0">${esc(QUE_ES_EL_PROMEDIO)}</p>
        ${J.liga && (window.LIGAS||{})[J.liga] ? (()=>{ const L=window.LIGAS[J.liga];
          /* ── LOS PARTIDOS, CON BOTÓN ────────────────────────────────
             Misma corrección que la de los planes, mismo motivo. Esto era
             una `.mini`: filas de texto de 13.5px con un `›` al final y un
             `role="button"` que solo ve el lector de pantalla. Para el ojo
             era una lista, no diez cosas apretables.

             Ahora el partido es texto y al lado va un botón `.acc` que
             dice "Simular". El `data-part` se mudó al botón, que es lo que
             engancha `[data-part]`: cambió dónde se toca, no qué pasa.

             Clase propia y no `.mini`: esa la usan otras pantallas y
             pisarla acá les cambiaría el aspecto sin que nadie lo pida. */
          /* LA FECHA ENTERA, CON LO QUE YA PASÓ. El que terminó muestra el
             resultado en vez de la hora, y el botón dice otra cosa: no es
             lo mismo "simular" un partido que falta que uno que ya se
             jugó. El segundo es la pregunta que hace un hincha el lunes.  */
          /* EL RELOJ MANDA CUANDO EL ARCHIVO CALLA. El estado lo escribe la
             ronda completa, una vez por día, así que puede decir "no
             empezó" de un partido de hace veinte horas. `estadoDePartido`
             mira las dos cosas; el porqué está en juego.js.

             Y los jugados van al final. No es prolijidad: es la primera
             pantalla del que llegó de un anuncio. Si arriba hay un partido
             de ayer lo va a tocar, y va a estrenar la app simulando algo
             cuyo resultado ya sabe — que es la peor manera de conocer un
             modelo que habla de probabilidades y no de certezas. */
          const ahora = new Date();
          const enOrden = ordenarPartidos(L.partidos, ahora);
          const primerJugado = enOrden.findIndex(p => estadoDePartido(p, ahora) === "jugado");
          return `<div class="partidos" style="margin-top:10px">${enOrden.map((p,i)=>{
            const est = estadoDePartido(p, ahora), hayGol = p.golL != null && p.golV != null;
            /* "Ya se jugó" sin marcador es un estado de verdad y hay que
               decirlo: lo sabemos por la hora, todavía no por el dato. */
            const cuando = est === "jugado"
              ? (hayGol ? "Terminó " + p.golL + "-" + p.golV : "Ya se jugó")
              : est === "enJuego"
              ? (hayGol ? "En juego · " + p.golL + "-" + p.golV : "Se está jugando")
              : cuandoJuega(p.fecha);
            const sep = i === primerJugado && i > 0
              ? `<div class="part-sep">Ya se jugaron</div>` : "";
            return sep + `<div class="part">
              <div class="part-txt">
                <b>${esc(nombreDeEquipo(L,p.local))} <span class="vs">vs</span> ${esc(nombreDeEquipo(L,p.visita))}</b>
                <span>${esc([nombreDeFecha(p.ronda), cuando].filter(Boolean).join(" · "))}</span>
              </div>
              <button class="${est === "jugado" ? "gh" : "acc"} part-btn" data-part="${p.id}"
                >${est === "jugado" ? "¿Y si…?" : "Simular"}</button>
            </div>`;}).join("")}</div>
            <p class="aviso" style="margin-top:8px">${L.calibrada
              ? "Calibrada con " + L.calibrada.partidos + " partidos de " + L.calibrada.temporada + "."
              : "Todavía sin calibrar: la temporada recién arranca y uso los números de respaldo."}
              ${(m=>m?esc(m.largo):"")(medidaDe(L))}</p>`;
          })() : ""}
      </div>`;
  };

  if(J.paso==="liga"){
    if(!PORTADA) return otrasLigas() + cab;
    const ligas = otrasLigas() || `<h3 class="sec">Elegí la liga</h3>
      <div class="tarjeta"><p class="bajada" style="margin-top:0">Las ligas se están cargando.
        Mientras tanto, <a href="index.html?elegir">elegí tu club</a> y simulá su próximo partido.</p></div>`;
    /* ── EL CUPO Y LOS PLANES, EN LA PORTADA ──────────────────────────
       Fausto, 19/9: "la compra debería estar también en la portada, está
       todo muy en scroll infinito y si no bajo no me entero". Tenía razón:
       antes esto aparecía únicamente abajo del resultado, o sea DESPUÉS de
       simular. El que abría la app y quería pagar no encontraba dónde.

       Va después del gancho y antes de las ligas, en ese orden y no en
       otro: primero qué es la app, después cuánto te queda y cómo seguir,
       y recién ahí la lista larga. El contador —"te quedan N gratis este
       mes"— no es un cartel de venta, es información que la persona
       necesita antes de gastar la primera. */
    return heroPortada() +
      `<div class="tarjeta" style="margin-top:12px">${bloqueInstalar()}${bloqueCupo()}</div>` +
      ligas + cab;
  }

  if(J.paso==="fixture"){
    /* EL ATAJO. La devolucion de los testers fue "tarda mucho prepararla".
       Desde aca eran cuatro toques hasta un resultado: elegir el partido,
       esperar los planteles, bajar hasta el boton, simular. Este boton hace
       los cuatro. El que quiera mover el once y las perillas sigue tocando
       la fila, como siempre. */
    const fila=(f,i)=>{const loc=f.teams.home.id===J.id.A, ya=JUGADO(f);
      return `<div class="fx" data-fx="${i}">
        <span class="d">${f.fixture.date.slice(5,10)}</span>
        <span style="flex:1">${esc(f.teams.home.name)} <span style="color:var(--tinta-3)">vs</span> ${esc(f.teams.away.name)}</span>
        ${ya?`<span class="lv">${f.goals.home}-${f.goals.away}</span>`
            :`<span class="sello">próximo</span>`}
        <span class="lv">${loc?"local":"visita"}</span>
        <span class="chev" aria-hidden="true">›</span></div>`;};
    /* El partido que viene es una tarjeta y no un renglon: hay que elegir
       entre dos caminos, y dos caminos en un renglon de treinta caracteres no
       se leen. Los ya jugados siguen siendo renglones, que ahi no hay
       decision: se tocan y listo. */
    const proximoHTML=(f,i)=>{const loc=f.teams.home.id===J.id.A;
      return `<div class="fxp" data-fxp="${i}">
        <div class="fxp-meta"><span class="sello">próximo</span>
          <span>${f.fixture.date.slice(8,10)}/${f.fixture.date.slice(5,7)}</span><span>·</span>
          <span>${loc?"de local":"de visitante"}</span></div>
        <div class="fxp-eq">${esc(f.teams.home.name)} <i>vs</i> ${esc(f.teams.away.name)}</div>
        <div class="fxp-acc">
          <button class="gh" data-fx="${i}">Armar mi partido <span aria-hidden="true">›</span></button>
          <button class="acc" data-ya="${i}">Simular tal cual</button>
        </div>
        ${bloqueAviso(true)}</div>`;};
    const porVenir=J.fixtures.map((f,i)=>[f,i]).filter(([f])=>!JUGADO(f)).slice(0,4);
    const jugados =J.fixtures.map((f,i)=>[f,i]).filter(([f])=>JUGADO(f)).reverse().slice(0,12);
    /* Las otras ligas van DESPUÉS de lo que viene y ANTES de los doce
       partidos ya jugados. Antes estaban al final de todo y no las
       encontraba nadie: es la función que se puede vender en cualquier
       país, y estaba a doce filas de scroll de distancia. Arriba de todo
       tampoco va —esta app abre en el club de uno, y eso no se toca—, pero
       la primera pantalla tiene que dejarla ver. */
    return `
    ${porVenir.length?`<h3 class="sec">Lo que viene</h3>
      <div class="tarjeta">
        <p class="bajada" style="margin-top:0"><b>Armalo vos</b> —el once, la formación y el
        planteo cambian el resultado— o <b>simulá tal cual viene</b>, sin tocar nada.</p>
        ${porVenir.map(([f,i])=>proximoHTML(f,i)).join("")}
      </div>`:""}
    ${otrasLigas()}
    <h3 class="sec">Ya jugados</h3>
    <div class="tarjeta">
      <p class="bajada" style="margin-top:0"><b>Armá tu once, simulá, y compará</b> con el once que
        puso el DT y con lo que pasó de verdad. Acá se revela enseguida.</p>
      ${jugados.map(([f,i])=>fila(f,i)).join("")}
      ${msg}${cab}
    </div>`;
  }

  if(J.paso==="armar"||J.paso==="resultado"||J.paso==="revelado"){
    const armado=`
      ${J.paso==="armar" ? avisoDeLaFoto() + avisoDeFormaciones() : ""}
      <h3 class="sec">Tocá un jugador para cambiarlo</h3>
      ${campoHTML()}
      ${bloqueDePublicidad()}
      <div class="fila2" style="margin-top:11px">
        <div><label>${partidoPropio() ? "Tu formación" : esc(nombreCorto("A"))}</label>
          <select id="fA">${FORMS.map(f=>`<option${f===J.formA?" selected":""}>${f}</option>`).join("")}</select></div>
        <div><label>${partidoPropio() ? "La del rival" : esc(nombreCorto("B"))}</label>
          <select id="fB">${FORMS.map(f=>`<option${f===J.formB?" selected":""}>${f}</option>`).join("")}</select></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="gh" id="bauto" style="padding:8px 12px;font-size:13px">Volver a los que vienen jugando</button>
      </div>
      ${tarjetaPlanteo("A")}
      ${tarjetaPlanteo("B")}
      <div class="tarjeta">
      </div>

      <h3 class="sec">¿El partido ya empezó?</h3>
      <div class="tarjeta">
        <p class="bajada" style="margin-top:0">Poné cómo va y se simula lo que falta.</p>
        <div class="fila2">
          <div><label for="dmin">Minuto</label>
            <input type="number" id="dmin" min="0" max="89" step="1" value="${J.desde.minuto}"></div>
          <div><label for="drA">Expulsados</label>
            <select id="drA">
              <option value="0-0"${J.desde.rojasA===0&&J.desde.rojasB===0?" selected":""}>Ninguno</option>
              <option value="0-1"${J.desde.rojasB===1?" selected":""}>${partidoPropio() ? "Al rival, uno menos" : esc(nombreCorto("B",12)) + ", uno menos"}</option>
              <option value="1-0"${J.desde.rojasA===1?" selected":""}>${partidoPropio() ? "A vos, uno menos" : esc(nombreCorto("A",12)) + ", uno menos"}</option>
            </select></div>
        </div>
        <div class="fila2" style="margin-top:8px">
          <div><label for="dgA">${partidoPropio() ? "Tus goles" : "Goles de " + esc(nombreCorto("A",12))}</label>
            <input type="number" id="dgA" min="0" max="9" step="1" value="${J.desde.golesA}"></div>
          <div><label for="dgB">${partidoPropio() ? "Sus goles" : "Goles de " + esc(nombreCorto("B",12))}</label>
            <input type="number" id="dgB" min="0" max="9" step="1" value="${J.desde.golesB}"></div>
        </div>
        ${quienFaltaHTML("A") + quienFaltaHTML("B")}
        ${J.desde.minuto>0?`<p class="nota" style="margin-top:10px">Se simulan
          los ${90-J.desde.minuto} minutos que faltan y se le suma el
          ${J.desde.golesA}-${J.desde.golesB} que ya está. Cómo se juegan esos
          minutos lo decidís vos, arriba.</p>`:""}
      </div>

      <div class="segm" role="group" aria-label="Cómo verlo" style="margin-top:14px">
        <button data-ver="1" aria-pressed="${J.ver}">Ver el partido <small>20 s</small></button>
        <button data-ver="0" aria-pressed="${!J.ver}">Solo el resultado</button>
      </div>
      <!-- EL BOTÓN SIEMPRE A LA VISTA. Los testers dijeron "engorroso", y
           el motivo era el scroll: cinco pantallazos de perillas antes de
           poder simular. Esta caja es sticky al pie: se ve desde el primer
           segundo, pegada arriba de la barra, y recién cuando el scroll
           llega a su lugar natural -el final de los ajustes- se queda ahí
           y deja ver el resultado que sale debajo. -->
      <div class="simbox">
        <button class="acc" id="bsim">${
          J.desde.minuto>0?"Simular desde el "+J.desde.minuto+"'":"Simular"}<span
            class="cuantas">${esc(restanEnBoton())}</span></button>
        <p class="conque" id="conque">${esc(conQue(ajustes()))}</p>
      </div>
      ${bloqueCupo()}`;

    const deOtraLiga = J.liga && (window.LIGAS||{})[J.liga];
    let out = (deOtraLiga
      ? `<div class="tarjeta" style="margin-bottom:10px;display:flex;
           justify-content:space-between;align-items:center;gap:10px">
          <span><b>${esc(window.LIGAS[J.liga].nombre)}</b><br>
            <span class="sub">${esc(J.nom.A)} vs ${esc(J.nom.B)}</span></span>
          <button class="gh" id="bvolver">${PORTADA ? "Volver a las ligas" : "Volver a mi club"}</button>
        </div>`
      : "") + armado;
    if(J.sim){
      const s=J.sim, margen=s.win-s.loss;
      const veredicto = margen>12?"Salís favorito" : margen<-12?"Salís de perdedor" : "Partido parejo";
      out+=`<h3 class="sec">Tu simulación</h3><div class="tarjeta">
        <div class="res">
          <div style="flex:${s.win};background:#12A150">${s.win.toFixed(0)}%</div>
          <div style="flex:${s.draw};background:#9AA3B0">${s.draw.toFixed(0)}%</div>
          <div style="flex:${s.loss};background:#D64550">${s.loss.toFixed(0)}%</div>
        </div>
        <div class="meta"><b>${veredicto}</b><span>·</span><span>ganás / empatás / perdés</span></div>
        ${/* ── POR QUÉ ACÁ NO ESTÁ "EL MARCADOR MÁS PROBABLE" ─────────────
             Fausto, 20/9: "por mera estadística el 1 a 1 se va a repetir más
             que la mayoría. Una victoria puede ser 1-0, 2-0, 2-1, etc., y
             las categorías de empates son más reducidas, por eso el
             resultado se repite más".

             Tiene razón y es la trampa clásica de la moda contra la suma.
             El marcador más repetido de 6.000 partidos casi siempre es un
             empate o un 1-0, porque los empates concentran su probabilidad
             en pocos marcadores —1-1, 0-0, 2-2— mientras que ganar la
             reparte entre muchos. Se podía leer "el modelo dice 1-1" arriba
             de una barra que decía 55% de ganar, y las dos cosas eran
             ciertas al mismo tiempo. Un número que hay que explicar para
             que no confunda es un número que no va.

             Queda lo que sí significa algo: la barra —la suma de todos los
             marcadores de cada clase— y el partido sorteado, que es UNO de
             los 6.000 y se presenta como tal. */""}
        ${J.visto && s.estaVez ? tanteador(s.estaVez.A, s.estaVez.B) : ""}
        ${/* ── NADA DE EXPLICAR EL MOTOR ABAJO DEL RESULTADO ──────────────
             Fausto, 20/9/2026, mirando la pantalla: "¿qué son todas esas
             advertencias y aclaraciones abajo del resultado? Ya dejamos
             establecido que todas esas cosas no van. Grabalo en piedra".

             Tenía razón, y es la misma regla de y60 que yo había aplicado a
             un renglón cuando valía para el bloque entero: un número que hay
             que explicar para que no confunda es un número que no va — y un
             número que no confunde no necesita que lo expliquen.

             Lo que se fue, y no vuelve sin que lo pida:
               · "uno de los 6.000 posibles", pegado al xG
               · "el partido que viste sale 1 de cada 8"
               · el párrafo del marcador insólito y el resorteo
               · las notas de cada perilla y de cada indicación
               · "Mismos ajustes, mismo resultado", con su explicación

             Queda el xG, que es un dato y no una aclaración, y la etiqueta
             "el partido que acabás de ver", que NO es una advertencia: es lo
             que impide leer el 0-1 como si fuera el pronóstico, que es
             exactamente el error que sacamos en y60. Sin ella el bloque
             vuelve a decir dos cosas a la vez.

             LA REGLA, para no discutirla de nuevo: abajo del resultado van
             el marcador, el xG y lo que ELEGISTE. Cómo funciona el motor se
             cuenta en otro lado, una vez.                                */ ''}
        <div class="meta" style="justify-content:center">${J.visto && s.estaVez
          ? "el partido que acabás de ver · " : ""}xG ${
          s.xgA.toFixed(2)} a ${s.xgB.toFixed(2)}</div>
        <p class="conque res-conque">${esc(s.conQue || "")}</p>
        ${/* Lo único que sobrevive es el precio, que no es una aclaración sobre
             el modelo sino sobre el cupo: "¿esto me gasta una simulación?" es
             una pregunta real y se contesta en cuatro palabras.          */ ''}
        ${J.partido && !J.visto ? `<button class="gh" id="bver" style="width:100%;margin-top:10px">
            Ver uno de los 6.000 partidos posibles</button>
          <p class="aviso" style="margin:6px 0 0">No gasta otra simulación.</p>` : ""}
        ${s.ajustes && !s.ajustes.length ? `<button class="gh" id="bplanteo" style="width:100%;margin-top:10px">
            Cambiar el once o el planteo y volver a simular</button>` : ""}
        ${J.paso!=="revelado" ? pieDelResultado() : ""}
        ${msg}${cab}
      </div>`;
    }
    if(J.real){
      const R=J.real, gano=R.misG>R.susG, empate=R.misG===R.susG;
      const acerto = (gano&&J.sim.win>J.sim.loss&&J.sim.win>J.sim.draw)
                   || (empate&&J.sim.draw>=J.sim.win&&J.sim.draw>=J.sim.loss)
                   || (!gano&&!empate&&J.sim.loss>J.sim.win);
      const cmp = compararOnces(J.xiA, R.once);
      const nombre = p => esc(apellidoDe(p.name || p.nombre || ""));
      out+=`<h3 class="sec">${R.pendiente ? "El once del DT" : "La realidad"}</h3><div class="tarjeta">
        ${R.pendiente ? `<div class="meta" style="justify-content:center">
            <b>Salió la formación oficial.</b> El partido todavía no se juega.</div>`
          : tanteador(R.misG, R.susG) + `<div class="meta" style="justify-content:center">lo que pasó de verdad</div>`}

        <!-- TU ONCE CONTRA EL DEL DT. Esto es la razón de ser de la
             pestaña: elegís, después ves qué eligió el técnico, y después
             el resultado le da la razón a uno, al otro o a ninguno. Era
             una lista de nombres y no se veía la comparación. -->
        <div class="vsdt">
          <div class="vsdt-cab">
            <b>Tu once contra el del DT</b>
            <span class="sello">${cmp.coinciden.length} de 11</span>
          </div>
          <div class="vsdt-forma">
            <span>Vos <b>${esc(J.formA)}</b></span><i>·</i>
            <span>El DT <b>${esc(R.formacion || "?")}</b></span>
          </div>
          ${cmp.soloDT.length ? `<div class="vsdt-grupo"><span class="vsdt-t">El DT puso y vos no</span>
            <div class="vsdt-chips">${cmp.soloDT.map(p=>`<span class="vsdt-chip dt">${p.pos?`<b>${esc(p.pos)}</b>`:""}${nombre(p)}</span>`).join("")}</div></div>` : ""}
          ${cmp.soloVos.length ? `<div class="vsdt-grupo"><span class="vsdt-t">Vos pusiste y el DT no</span>
            <div class="vsdt-chips">${cmp.soloVos.map(p=>`<span class="vsdt-chip vos">${p.pos?`<b>${esc(p.pos)}</b>`:""}${nombre(p)}</span>`).join("")}</div></div>` : ""}
          ${cmp.coinciden.length ? `<div class="vsdt-grupo"><span class="vsdt-t">Los dos</span>
            <div class="vsdt-chips">${cmp.coinciden.map(p=>`<span class="vsdt-chip">${p.pos?`<b>${esc(p.pos)}</b>`:""}${nombre(p)}</span>`).join("")}</div></div>` : ""}
          ${!R.once.length ? `<p class="aviso">Todavía no está la formación de este partido.</p>` : ""}
        </div>
        ${R.rojas.length?`<p class="nota"><b>Expulsión:</b> ${R.rojas.map(r=>
          esc(r.quien||"")+" ("+(r.esMio?"tuyo":"del rival")+", "+r.min+"')").join(" · ")}.
          ${R.simConRojas?`Con eso adentro, la simulación pasa a
          ${R.simConRojas.win.toFixed(0)}% / ${R.simConRojas.draw.toFixed(0)}% / ${R.simConRojas.loss.toFixed(0)}%.`:""}</p>`:""}
        ${R.penales.length?`<p class="nota"><b>Penal errado:</b> ${R.penales.map(p=>
          esc(p.quien||"")+" ("+(p.esMio?"tuyo":"del rival")+", "+p.min+"')").join(" · ")}.</p>`:""}
        ${(() => {
          const D = R.simDT, S = J.sim;
          if(R.pendiente){
            /* Antes del partido: dos columnas y la pregunta abierta. La
               tercera llega cuando termine. */
            const pct = k => s => s[k].toFixed(0) + "%";
            const fila = (n, f) => `<tr><th class="l">${n}</th><td>${f(S)}</td>${D ? `<td>${f(D)}</td>` : ""}</tr>`;
            const dif = D ? (S.win - D.win) : 0;
            const frase = !D ? ""
              : Math.abs(dif) < 3 ? "Con tu once y con el del DT el partido pinta casi igual."
              : dif > 0 ? `<b>Con tu once el modelo te da ${dif.toFixed(0)} puntos más de ganar</b> que con el del DT.`
              : `<b>Con el once del DT el modelo da ${(-dif).toFixed(0)} puntos más de ganar</b> que con el tuyo.`;
            return `<div class="tres">
              <div class="flab" style="margin-top:14px">Tu once · el del DT</div>
              <div class="wrap"><table class="tres-t">
                <thead><tr><th class="l"></th><th>Tu once</th>${D ? "<th>El del DT</th>" : ""}</tr></thead>
                <tbody>
                  ${fila("Ganás", pct("win"))}${fila("Empatás", pct("draw"))}${fila("Perdés", pct("loss"))}
                  ${/* "Más probable" salió en y60: ver el comentario largo en
                       la tarjeta del resultado. Comparar dos modas entre sí es
                       todavía peor que mostrar una sola. */""}
                  ${fila("xG", s => s.xgA.toFixed(2) + " a " + s.xgB.toFixed(2))}
                </tbody></table></div>
              <p class="nota" style="margin-top:8px">${frase}${J.liga ? "" : ` Cuando termine el partido, la tercera columna
                dice quién leyó mejor: guardá el link y volvé.`}</p>
              ${J.liga ? "" : `<button class="acc" id="bguardar" style="width:100%;margin-top:10px">Copiar el link de mi pronóstico</button>
              <p class="aviso" id="avisoLink"></p>`}
            </div>`;
          }
          const paso = gano ? "ganó" : empate ? "empató" : "perdió";
          const fila = (n, f) => `<tr><th class="l">${n}</th><td>${f(S)}</td>${D ? `<td>${f(D)}</td>` : ""}</tr>`;
          const pct = k => s => s[k].toFixed(0) + "%";
          const marca = k => (gano && k==="win") || (empate && k==="draw") || (!gano && !empate && k==="loss") ? " ✓" : "";
          const tuya = leyoMejor(S, R.misG, R.susG), suya = leyoMejor(D, R.misG, R.susG);
          const veredicto = !D ? ""
            : Math.abs(tuya - suya) < 3 ? "Los dos onces le daban casi lo mismo a lo que pasó: empate técnico."
            : tuya > suya ? `<b>Tu once leyó mejor el partido:</b> le daba ${tuya.toFixed(0)}% a lo que pasó; el del DT, ${suya.toFixed(0)}%.`
            : `<b>El DT leyó mejor el partido:</b> su once le daba ${suya.toFixed(0)}% a lo que pasó; el tuyo, ${tuya.toFixed(0)}%.`;
          return `<div class="tres">
            <div class="flab" style="margin-top:14px">Tu once · el del DT · lo que pasó</div>
            <div class="wrap"><table class="tres-t">
              <thead><tr><th class="l"></th><th>Tu once</th>${D ? "<th>El del DT</th>" : ""}</tr></thead>
              <tbody>
                ${fila("Ganás" + marca("win"), pct("win"))}
                ${fila("Empatás" + marca("draw"), pct("draw"))}
                ${fila("Perdés" + marca("loss"), pct("loss"))}
                ${fila("xG", s => s.xgA.toFixed(2) + " a " + s.xgB.toFixed(2))}
              </tbody></table></div>
            <p class="nota" style="margin-top:8px">${esc(J.nom.A)} <b>${paso} ${R.misG}-${R.susG}</b>.
              ${veredicto}
              ${!D ? (acerto ? " Tu simulación dio en el resultado." : " Tu simulación le erró.") : ""}
              ${D ? "" : ""}</p>
            ${D ? `<p class="aviso" style="margin:6px 0 0">El once del DT se simuló con el mismo rival, las mismas perillas y
              las mismas indicaciones que el tuyo: lo único que cambia es quién juega. No gasta una simulación.</p>` : ""}
          </div>`;
        })()}
        ${cab}
      </div>`;
    }
    return out;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════════════════
   EL PRONÓSTICO VIAJA EN EL LINK
   ──────────────────────────────────────────────────────────────────────────
   Un pronóstico sobre un partido que todavía no se jugó hay que poder
   guardarlo. Sin backend la tentación es el almacenamiento del navegador,
   pero eso muere en cuanto cambiás de teléfono y no se puede compartir.

   Va en el hash de la URL. Tiene tres ventajas de una: sobrevive a recargar,
   se puede mandar por WhatsApp, y es EXACTAMENTE el mecanismo que va a
   necesitar "desafiá a un amigo" — el link ya es el pronóstico.
   ══════════════════════════════════════════════════════════════════════════ */
const b64 = {
  poner: o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,""),
  sacar: t => JSON.parse(decodeURIComponent(escape(atob(t)))),
};
function linkDelPronostico(){
  const once = xi => xi.map(p => p ? p.id : 0);
  return location.origin + location.pathname + "#p=" + b64.poner({
    c: CLUB.id, t: J.temporada, f: J.fx.fixture.id,
    fa: J.formA, fb: J.formB, a: once(J.xiA), b: once(J.xiB), k: J.K,
  });
}
function leerPronostico(){
  const m = location.hash.match(/#p=([A-Za-z0-9+/]+)/);
  if(!m) return null;
  try { return b64.sacar(m[1]); } catch(e){ return null; }
}

/* ══════════════════ render y eventos ══════════════════ */
function pintar(){
  pintarColores();
  /* El borrador se guarda acá y no en cada función que toca el equipo. Hay
     ocho lugares que lo modifican —sumar, sacar, cambiar formación, poner
     la cinta, el banco— y el día que alguien agregue el noveno se va a
     olvidar de llamar al guardado. Desde acá no se puede olvidar. */
  guardarBorrador();
  $("vista").innerHTML = tab==="feed"?vistaFeed() : tab==="juego"?vistaJuego()
                       : tab==="fantasy"?vistaFantasy() : vistaNumeros();
  document.querySelectorAll("#barra button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  if(tab==="juego") enganchar();
  if(tab==="fantasy") engancharFantasy();
}

function enganchar(){
  /* Los botones de plan viven abajo del botón de Simular y se redibujan en
     cada pintar(), así que hay que volver a engancharlos acá. Antes solo se
     enganchaban al dibujar el panel de cuenta, y por eso los de la vista
     principal eran de adorno. */
  if(typeof engancharPremium === "function") engancharPremium();
  /* El aviso, si esta simulación lleva. Va acá y no en `pintar()` porque
     tiene que correr DESPUÉS de que el HTML esté en el documento: Google
     busca el `ins` en el DOM, no en una cadena. */
  if(typeof empujarPublicidad === "function") empujarPublicidad();
  /* "Hoy este teléfono abrió la app." Va acá y no arriba del todo por una
     razón concreta: arriba, `esDeLaTienda()` todavía no puede leer la
     constante `PAQUETE` —está declarada más abajo con `const`, y `typeof`
     no protege de eso— así que caería en su rama de emergencia y contaría
     mal justo lo que venimos a medir. Acá ya está todo definido.
     El propio contador se encarga de que sea una sola vez por día, así que
     llamarlo en cada `enganchar()` no cuesta nada. */
  usar("abrio");
  /* El refresco de datos de la app de iPhone. Solo existe adentro del
     .ipa —el archivo lo agrega `empaquetar-ios.mjs`, no viaja en la web— y
     él solo se encarga de arrancar una sola vez. Arranca acá, con la
     pantalla YA dibujada de la foto: nada de esto puede hacer esperar al
     primer partido. Lo que llegue redibuja. */
  try{
    if(typeof arrancarDatosIos === "function")
      arrancarDatosIos({ alAplicar: () => { try{ pintar(); }catch(e){} } });
  }catch(e){}
  /* El botón de instalar. El evento del navegador se puede disparar UNA
     sola vez y solo desde un gesto de la persona, así que se llama derecho
     acá adentro del click y después se suelta. */
  const bi = $("binstalar");
  if(bi) bi.onclick = async () => {
    if(!PROMPT_INSTALAR) return;
    const ev = PROMPT_INSTALAR;
    bi.disabled = true;
    try{
      ev.prompt();
      const r = await ev.userChoice;
      /* Si dijo que no, el navegador no vuelve a ofrecerlo en esta visita:
         guardar el evento gastado sería dejar un botón que ya no hace nada. */
      if(r && r.outcome !== "accepted") bi.textContent = "Lo podés instalar después, desde el menú del navegador";
      PROMPT_INSTALAR = null;
    }catch(e){ PROMPT_INSTALAR = null; }
    pintar();
  };
  const k=$("k"); if(k) k.oninput=e=>J.key=e.target.value.trim();
  const t=$("temp"); if(t) t.onchange=e=>J.temporada=+e.target.value;
  const bc=$("bcargar"); if(bc) bc.onclick=()=>{
    if(!J.key){ J.err="Pegá la API key primero."; pintar(); return; } cargarTemporada(); };
  document.querySelectorAll(".fx, .fxp [data-fx]").forEach(el=>el.onclick=()=>{
    el.setAttribute("aria-selected","true"); elegirPartido(+el.dataset.fx); });
  /* El boton vive DENTRO de la fila, asi que hay que frenar el click ahi
     mismo: si no, la fila tambien lo escucha y se arma el partido dos veces,
     la segunda pisando a la primera. */
  document.querySelectorAll("[data-ya]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    await elegirPartido(+b.dataset.ya);
    if(!J.err) simular11(true);
  });
  const fa=$("fA"), fb=$("fB");
  if(fa) fa.onchange=e=>{ J.formA=e.target.value; J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  if(fb) fb.onchange=e=>{ J.formB=e.target.value; J.xiB=autoXI(J.pool.B,J.formB); pintar(); };
  document.querySelectorAll(".jug").forEach(g=>g.onclick=()=>{
    if(J.animando) return;
    abrirPicker(g.dataset.lado, +g.dataset.slot, g.dataset.cat);
  });
  const moverPerilla = (attr, dest, mueveCancha) =>
    document.querySelectorAll("input["+attr+"]").forEach(r=>r.oninput=e=>{
      const id=e.target.dataset[attr==="data-k"?"k":"kb"], v=+e.target.value;
      dest[id]=v;
      const k=KNOBS.find(x=>x.id===id);
      e.target.closest(".perilla").querySelector(".pv").textContent =
        Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%";
      if(mueveCancha) colocarJugadores();
      /* El botón del planteo se apaga solo si las perillas ya no son las
         suyas. Se repinta al soltar, no en cada pixel: repintar mientras
         arrastrás el dedo te saca el dedo de encima del control. */
      clearTimeout(J.__repinta);
      J.__repinta = setTimeout(()=>{ if(!J.animando) pintar(); }, 450);
    });
  moverPerilla("data-k",  J.K,  true);
  moverPerilla("data-kb", J.KB, false);

  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{
    const K = planteo(b.dataset.plv); if(!K) return;
    Object.assign(b.dataset.pl==="A" ? J.K : J.KB, K);
    pintar();
  });
  document.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{
    const K = planteo(b.dataset.sugv); if(!K) return;
    Object.assign(b.dataset.sug==="A" ? J.K : J.KB, K);
    pintar();
  });
  document.querySelectorAll("[data-liga]").forEach(b=>b.onclick=()=>{
    /* Se mira ANTES de tocar `J.liga`: el mismo botón abre y cierra, y
       solo hay que bajar cuando abre. Bajar al cerrar sería perseguir a
       alguien que acaba de decir que no quería ver eso. */
    const abre = J.liga !== b.dataset.liga;
    J.liga = abre ? b.dataset.liga : null; J.err=""; pintar();
    if(abre) bajarALosPartidos();
  });
  document.querySelectorAll("[data-part]").forEach(el=>{
    const ir = () => simularDeLiga(J.liga, el.dataset.part);
    el.onclick = ir;
    /* OJO: desde que esto es un `<button>` de verdad, Enter y Espacio ya
       disparan `click` solos. Dejar además el `keydown` llamaba a `ir()`
       DOS veces, y cada una gasta una simulación del cupo. El teclado se
       atiende a mano solo si el elemento no es un botón. */
    if(el.tagName !== "BUTTON")
      el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  });
  const bv=$("bvolver"); if(bv) bv.onclick=volverAMiClub;

  /* Con `onclick=simular11` el navegador le pasa el evento del click como
     primer argumento, y un evento es un objeto: siempre verdadero. O sea que
     el boton de ver el partido habria simulado en modo flash. */
  const bs=$("bsim"); if(bs) bs.onclick=()=>simular11(!J.ver);
  document.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{ J.ver = b.dataset.ver==="1"; pintar(); });
  document.querySelectorAll("[data-aviso]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); tocarAviso(); });
  const bpl=$("bplanteo"); if(bpl) bpl.onclick=()=>{
    document.querySelector(".planteo, #campo")?.scrollIntoView({behavior:"smooth",block:"start"}); };
  /* `bver` y no `bv`: `bv` ya era el de volver a mi club, veinte lineas mas
     abajo, y dos const con el mismo nombre en el mismo bloque no es un aviso,
     es la pagina entera que no arranca. Van tres veces en este proyecto. */
  const bverp=$("bver"); if(bverp) bverp.onclick=verElPartido;
  const ba=$("bauto"); if(ba) ba.onclick=()=>{ J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
