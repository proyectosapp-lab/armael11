/* ── EL PARTIDO ANIMADO ───────────────────────────────────────────────────
   Lo que se ve es UNA de las 6000 simulaciones, no un promedio. Los goles
   se sortean con la misma Poisson que usa el modelo, así que lo que pasa en
   pantalla es una realización honesta del pronóstico — no una animación
   decorativa que después se contradice con el número.                     */
/* ── LOS JUGADORES SE MUEVEN ─────────────────────────────────────────────
   Antes rebotaba una pelota sola entre veintidós globitos clavados, y se
   notaba: no parecía un partido, parecía un salvapantallas.

   Esto no simula nada —la simulación ya está hecha, son 6.000 partidos— es
   la puesta en escena. Cada jugador se corre hacia la pelota una fracción de
   la distancia, y esa fracción cae con la distancia: el que está cerca va a
   buscarla, el que está lejos apenas se acomoda. El arquero casi no se mueve
   y no se despega del arco. Un temblor chico arriba de todo para que no
   parezcan piezas de metegol moviéndose en bloque.

   Se hace con una variable CSS y no tocando left/top, para no pelear con el
   translate(-50%,-50%) que centra el globito.                            */
function moverJugadores(campo, bx, by){
  const r = campo.getBoundingClientRect();
  const rit=(J.K.ritmo||0)/100, pre=(J.K.presion||0)/100;
  /* Con ritmo alto el equipo se estira y se junta más rápido. */
  const amplitud = 1 + 0.6*rit;

  campo.querySelectorAll(".jug").forEach(el => {
    const x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top);
    if(isNaN(x0) || isNaN(y0)) return;
    const arquero = el.dataset.cat === "G";
    const mio = el.dataset.lado === "A";

    /* ── LA FASE, que era lo que faltaba ────────────────────────────────
       Antes cada jugador se corría un poquito hacia la pelota y listo: el
       equipo, COMO equipo, no se desplazaba nunca. Un bloque real sube
       entero cuando la pelota está en campo rival y baja entero cuando la
       tiene el otro. Eso es lo que se ve desde la tribuna.             */
    const suArco = mio ? 100 : 0;
    const fase = (Math.abs(by - suArco) - 50) / 50;   // -1 replegado · +1 volcado
    const haciaAdelante = mio ? -1 : 1;
    const bloque = arquero ? fase * 2
                           : haciaAdelante * fase * (7 + 5*pre) * amplitud;

    const dx = bx - x0, dy = by - y0;
    const lejos = Math.hypot(dx, dy);
    const k = (arquero ? .04 : .34) * Math.max(0, 1 - lejos / 58) * amplitud;
    const tope = arquero ? 4 : 17;
    const ruido = () => (Math.random() - .5) * 2.2 * amplitud;
    const px = Math.max(-tope, Math.min(tope, dx * k + ruido()));
    const py = Math.max(-tope, Math.min(tope, dy * k + bloque + ruido()));
    el.style.setProperty("--dx", (px / 100 * r.width ).toFixed(1) + "px");
    el.style.setProperty("--dy", (py / 100 * r.height).toFixed(1) + "px");
  });
}

function quietos(campo){
  campo.classList.remove("jugando");
  campo.querySelectorAll(".jug").forEach(el => {
    el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); });
}

function animarPartido(xgA, xgB, alTerminar){
  const gA=poissonUno(xgA), gB=poissonUno(xgB);
  const minutos = n => Array.from({length:n},()=>3+Math.floor(Math.random()*86)).sort((a,b)=>a-b);
  const eventos=[...minutos(gA).map(m=>({m,lado:"A"})), ...minutos(gB).map(m=>({m,lado:"B"}))]
    .sort((a,b)=>a.m-b.m);
  const posesion = xgA/(xgA+xgB);
  const pel=$("pelota"), rel=$("reloj"), gol=$("golazo"), campo=$("campo");
  if(!pel) return alTerminar({A:gA,B:gB});
  rel.hidden=false; rel.textContent="0'";
  campo?.classList.add("jugando");
  let min=0, marc={A:0,B:0}, k=0;
  const reloj=setInterval(()=>{
    min+=3;
    if(min>90){ clearInterval(reloj); rel.textContent="90'  "+marc.A+"-"+marc.B;
      if(campo) quietos(campo);
      setTimeout(()=>alTerminar(marc), 500); return; }
    let x=14+Math.random()*72;
    let y = Math.random()<posesion ? 12+Math.random()*36 : 52+Math.random()*36;
    let huboGol=false;
    while(k<eventos.length && eventos[k].m<=min){
      const e=eventos[k++]; marc[e.lado]++; huboGol=true;
      x=50; y = e.lado==="A" ? 5 : 95;
    }
    pel.style.left=x+"%"; pel.style.top=y+"%";
    if(campo) moverJugadores(campo, x, y);
    rel.textContent = min+"'  "+marc.A+"-"+marc.B;
    if(huboGol){ gol.classList.add("on"); setTimeout(()=>gol.classList.remove("on"), 550); }
  }, Math.round(235 * (1 - 0.22*((J.K.ritmo||0)/100))));
}

/* ── elegir jugador para un puesto ── */
function abrirPicker(lado, slot, cat){
  const pool=J.pool[lado], xi=(lado==="A"?J.xiA:J.xiB);
  const enCancha=new Set(xi.filter(Boolean).map(p=>p.id));
  const ord=[...pool].map(p=>({p, v: fuerza(p).v - penalPuesto(p.pos,cat)}))
    .sort((a,b)=>b.v-a.v);
  const d=document.createElement("div"); d.className="picker";
  d.innerHTML=`<div class="hoja2">
    <h4>¿Quién juega de ${cat==="G"?"arquero":cat==="D"?"defensor":cat==="M"?"volante":"delantero"}?</h4>
    <p class="aviso" style="margin:0 0 10px">El número es su fuerza EN ESTE PUESTO: ya tiene descontado
    el castigo por jugar fuera de posición.</p>
    ${ord.map(o=>`<div class="opt${enCancha.has(o.p.id)?" enCancha":""}" data-id="${o.p.id}">
      <span class="p">${o.p.pos}</span><span>${esc(o.p.nombre)}</span>
      <span class="v">${o.v.toFixed(2)}</span></div>`).join("")}
  </div>`;
  d.onclick=e=>{
    const o=e.target.closest(".opt");
    if(!o){ if(e.target===d) d.remove(); return; }
    const p=pool.find(x=>x.id===+o.dataset.id);
    const arr=(lado==="A"?J.xiA:J.xiB);
    const yaEsta=arr.findIndex(q=>q&&q.id===p.id);
    if(yaEsta>=0 && yaEsta!==slot){                   // ya jugaba: los intercambia
      const otro=arr[slot];
      arr[yaEsta]= otro? {...otro, slotCat:arr[yaEsta].slotCat} : null;
    }
    arr[slot]={...p, slotCat:cat};
    d.remove(); pintar();
  };
  document.body.appendChild(d);
}

function vistaJuego(){
  const cab = J.err?`<div class="err">${esc(J.err)}</div>`:"";
  const msg = J.msg?`<div class="cargando">${esc(J.msg)}</div>`:"";

  if(J.paso==="key" && window.CACHE) return `
    <h3 class="sec">El 11 de la fecha</h3>
    <div class="tarjeta"><div class="cargando">Cargando el partido…</div>${cab}</div>`;

  if(J.paso==="key") return `
    <h3 class="sec">El 11 de la fecha</h3>
    <div class="tarjeta">
      <p class="bajada" style="margin-top:0">Ponés tu once, el once del rival, tocás dos o tres ajustes
      y simulás. Después revelás qué puso el DT y qué pasó de verdad.</p>
      <label for="k">Tu API key de API-Football</label>
      <input type="password" id="k" placeholder="pegala acá" autocomplete="off" spellcheck="false">
      <p class="aviso">Queda solo en tu navegador y viaja únicamente a api-sports.io.
      No se guarda en ningún lado ni sale de tu teléfono.</p>
      <div class="fila2" style="margin-top:12px">
        <div><label for="temp">Temporada</label>
          <select id="temp">${[2026,2024,2023].map(y=>`<option${y===J.temporada?" selected":""}>${y}</option>`).join("")}</select></div>
        <div style="display:flex;align-items:flex-end"><button class="acc" id="bcargar" style="width:100%">Cargar</button></div>
      </div>
      ${msg}${cab}
    </div>`;

  if(J.paso==="fixture"){
    const fila=(f,i)=>{const loc=f.teams.home.id===J.id.A, ya=JUGADO(f);
      return `<div class="fx" data-fx="${i}">
        <span class="d">${f.fixture.date.slice(5,10)}</span>
        <span style="flex:1">${esc(f.teams.home.name)} <span style="color:var(--tinta-3)">vs</span> ${esc(f.teams.away.name)}</span>
        ${ya?`<span class="lv">${f.goals.home}-${f.goals.away}</span>`
            :`<span class="sello">próximo</span>`}
        <span class="lv">${loc?"local":"visita"}</span></div>`;};
    const porVenir=J.fixtures.map((f,i)=>[f,i]).filter(([f])=>!JUGADO(f)).slice(0,4);
    const jugados =J.fixtures.map((f,i)=>[f,i]).filter(([f])=>JUGADO(f)).reverse().slice(0,12);
    return `
    ${porVenir.length?`<h3 class="sec">Lo que viene</h3>
      <div class="tarjeta">
        <p class="bajada" style="margin-top:0">Armá tu once ANTES de que se juegue. Cuando termine
        el partido volvés con tu link y comparás.</p>
        ${porVenir.map(([f,i])=>fila(f,i)).join("")}
      </div>`:""}
    <h3 class="sec">Ya jugados</h3>
    <div class="tarjeta">
      <p class="bajada" style="margin-top:0">Acá podés revelar el once del DT enseguida.</p>
      ${jugados.map(([f,i])=>fila(f,i)).join("")}
      ${msg}${cab}
    </div>`;
  }

  if(J.paso==="armar"||J.paso==="resultado"||J.paso==="revelado"){
    const armado=`
      <h3 class="sec">Tocá un jugador para cambiarlo</h3>
      ${campoHTML()}
      <div class="fila2" style="margin-top:11px">
        <div><label>Tu formación</label>
          <select id="fA">${FORMS.map(f=>`<option${f===J.formA?" selected":""}>${f}</option>`).join("")}</select></div>
        <div><label>La del rival</label>
          <select id="fB">${FORMS.map(f=>`<option${f===J.formB?" selected":""}>${f}</option>`).join("")}</select></div>
      </div>
      <h3 class="sec">Ajustes</h3>
      <div class="tarjeta">${KNOBS.map(k=>{const v=J.K[k.id];return `
        <div class="perilla"><div class="ph"><b>${k.n}</b>
          <span class="pv">${Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%"}</span></div>
          <input type="range" min="-100" max="100" value="${v}" data-k="${k.id}">
          <div class="ends"><span>${k.izq}</span><span>${k.der}</span></div></div>`;}).join("")}
        <div style="display:flex;gap:9px;margin-top:6px">
          <button class="acc" id="bsim" style="flex:1">Simular mi once</button>
          <button class="gh" id="bauto">Los mejores</button>
        </div>
      </div>`;

    let out=armado;
    if(J.sim){
      const s=J.sim, margen=s.win-s.loss;
      const veredicto = margen>12?"Salís favorito" : margen<-12?"Salís de perdedor" : "Partido parejo";
      out+=`<h3 class="sec">Tu simulación</h3><div class="tarjeta">
        <div class="res">
          <div style="flex:${s.win};background:#12A150">${s.win.toFixed(0)}%</div>
          <div style="flex:${s.draw};background:#9AA3B0">${s.draw.toFixed(0)}%</div>
          <div style="flex:${s.loss};background:#D64550">${s.loss.toFixed(0)}%</div>
        </div>
        <div class="meta"><b>${veredicto}</b><span>·</span><span>ganás / empatás / perdés</span></div>
        <div class="marcador">${s.estaVez ? s.estaVez.A+"-"+s.estaVez.B : esc(s.marcador)}</div>
        <div class="meta" style="justify-content:center">${s.estaVez
          ? "el partido que acabás de ver"
          : "marcador más probable · "+s.probMarcador.toFixed(0)+"%"} ·
          xG ${s.xgA.toFixed(2)} a ${s.xgB.toFixed(2)}</div>
        ${s.estaVez?`<p class="nota">Ese fue <b>uno</b> de los 6.000 partidos simulados.
          El resultado más repetido fue <b>${esc(s.marcador)}</b>, en el
          ${s.probMarcador.toFixed(0)}% de las veces. La barra de arriba los junta a todos:
          es la que hay que mirar.</p>`:""}
        ${s.notas.map(n=>`<p class="nota">${esc(n)}</p>`).join("")}
        ${J.paso!=="revelado" ? (J.jugado
          ? `<button class="acc" id="brev" style="width:100%;margin-top:12px">
              Revelar el once del DT y lo que pasó</button>`
          : `<div class="pendiente" style="margin-top:12px">
              <b>Este partido todavía no se jugó.</b><br>
              Tu pronóstico queda guardado en el link de abajo. Cuando termine el partido,
              abrilo de nuevo y la app te muestra el once del DT y qué pasó.
             </div>
             <button class="acc" id="bguardar" style="width:100%;margin-top:10px">
               Copiar el link de mi pronóstico</button>
             <p class="aviso" id="avisoLink"></p>`) : ""}
        ${msg}${cab}
      </div>`;
    }
    if(J.real){
      const R=J.real, gano=R.misG>R.susG, empate=R.misG===R.susG;
      const acerto = (gano&&J.sim.win>J.sim.loss&&J.sim.win>J.sim.draw)
                   || (empate&&J.sim.draw>=J.sim.win&&J.sim.draw>=J.sim.loss)
                   || (!gano&&!empate&&J.sim.loss>J.sim.win);
      out+=`<h3 class="sec">La realidad</h3><div class="tarjeta">
        <div class="marcador">${R.misG} - ${R.susG}</div>
        <div class="meta" style="justify-content:center">${esc(J.nom.A)} vs ${esc(J.nom.B)}
          ${R.formacion?"· el DT puso "+esc(R.formacion):""}</div>
        ${R.once.length?`<div class="otras" style="margin-top:12px">${R.once.map(p=>
          `<span><b>${esc(p.pos||"")}</b> ${esc(p.name)}</span>`).join("")}</div>`:""}
        ${R.rojas.length?`<p class="nota"><b>Expulsión:</b> ${R.rojas.map(r=>
          esc(r.quien||"")+" ("+(r.esMio?"tuyo":"del rival")+", "+r.min+"')").join(" · ")}.
          ${R.simConRojas?`Con eso adentro, la simulación pasa a
          ${R.simConRojas.win.toFixed(0)}% / ${R.simConRojas.draw.toFixed(0)}% / ${R.simConRojas.loss.toFixed(0)}%.`:""}</p>`:""}
        ${R.penales.length?`<p class="nota"><b>Penal errado:</b> ${R.penales.map(p=>
          esc(p.quien||"")+" ("+(p.esMio?"tuyo":"del rival")+", "+p.min+"')").join(" · ")}.</p>`:""}
        <p class="nota">${acerto
          ? "El pronóstico dio en el resultado."
          : "Le erramos. Sin excusas: el modelo dijo otra cosa y el partido dijo esta."}</p>
        ${cab}
      </div>`;
    }
    return out;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════════════════
   EL PRONÓSTICO VIAJA EN EL LINK
   ──────────────────────────────────────────────────────────────────────────
   Un pronóstico sobre un partido que todavía no se jugó hay que poder
   guardarlo. Sin backend la tentación es el almacenamiento del navegador,
   pero eso muere en cuanto cambiás de teléfono y no se puede compartir.

   Va en el hash de la URL. Tiene tres ventajas de una: sobrevive a recargar,
   se puede mandar por WhatsApp, y es EXACTAMENTE el mecanismo que va a
   necesitar "desafiá a un amigo" — el link ya es el pronóstico.
   ══════════════════════════════════════════════════════════════════════════ */
const b64 = {
  poner: o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,""),
  sacar: t => JSON.parse(decodeURIComponent(escape(atob(t)))),
};
function linkDelPronostico(){
  const once = xi => xi.map(p => p ? p.id : 0);
  return location.origin + location.pathname + "#p=" + b64.poner({
    c: CLUB.id, t: J.temporada, f: J.fx.fixture.id,
    fa: J.formA, fb: J.formB, a: once(J.xiA), b: once(J.xiB), k: J.K,
  });
}
function leerPronostico(){
  const m = location.hash.match(/#p=([A-Za-z0-9+/]+)/);
  if(!m) return null;
  try { return b64.sacar(m[1]); } catch(e){ return null; }
}

/* ══════════════════ render y eventos ══════════════════ */
function pintar(){
  pintarColores();
  $("vista").innerHTML = tab==="feed"?vistaFeed() : tab==="juego"?vistaJuego()
                       : tab==="fantasy"?vistaFantasy() : vistaNumeros();
  document.querySelectorAll("#barra button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  if(tab==="juego") enganchar();
  if(tab==="fantasy") engancharFantasy();
}

function enganchar(){
  const k=$("k"); if(k) k.oninput=e=>J.key=e.target.value.trim();
  const t=$("temp"); if(t) t.onchange=e=>J.temporada=+e.target.value;
  const bc=$("bcargar"); if(bc) bc.onclick=()=>{
    if(!J.key){ J.err="Pegá la API key primero."; pintar(); return; } cargarTemporada(); };
  document.querySelectorAll(".fx").forEach(el=>el.onclick=()=>{
    el.setAttribute("aria-selected","true"); elegirPartido(+el.dataset.fx); });
  const fa=$("fA"), fb=$("fB");
  if(fa) fa.onchange=e=>{ J.formA=e.target.value; J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  if(fb) fb.onchange=e=>{ J.formB=e.target.value; J.xiB=autoXI(J.pool.B,J.formB); pintar(); };
  document.querySelectorAll(".jug").forEach(g=>g.onclick=()=>{
    if(J.animando) return;
    abrirPicker(g.dataset.lado, +g.dataset.slot, g.dataset.cat);
  });
  document.querySelectorAll("input[data-k]").forEach(r=>r.oninput=e=>{
    J.K[e.target.dataset.k]=+e.target.value;
    const k=KNOBS.find(x=>x.id===e.target.dataset.k), v=+e.target.value;
    e.target.closest(".perilla").querySelector(".pv").textContent =
      Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%";
    colocarJugadores();
  });
  const bs=$("bsim"); if(bs) bs.onclick=simular11;
  const ba=$("bauto"); if(ba) ba.onclick=()=>{ J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  const br=$("brev"); if(br) br.onclick=revelar;
  /* Compartir de verdad, no copiar. En el teléfono —que es donde esto se usa—
     `navigator.share` abre WhatsApp directo; copiar al portapapeles obliga a
     salir de la app, abrir el chat y pegar, y ahí se pierde la mitad de la
     gente. Si el navegador no lo tiene, se copia como antes.            */
  const bg=$("bguardar");
  if(bg) bg.onclick=async()=>{
    const link=linkDelPronostico();
    location.hash = link.split("#")[1];
    const texto = "Armé mi once de " + CLUB.nom + " para " +
      (J.nom.A||"") + " vs " + (J.nom.B||"") + ". A ver si le pegás mejor que yo:";
    if(navigator.share){
      try{ await navigator.share({ title:"Armá el 11 · "+CLUB.nom, text:texto, url:link });
        $("avisoLink").textContent="Listo. Cuando termine el partido, ese link te muestra la comparación.";
        return;
      }catch(e){ if(e && e.name==="AbortError") return; }   // lo cerró a propósito
    }
    try{ await navigator.clipboard.writeText(link);
      $("avisoLink").textContent="Copiado. Guardalo o mandátelo: cuando termine el partido, ese link te muestra la comparación.";
    }catch(e){
      $("avisoLink").textContent="No pude copiarlo solo, pero ya está en la barra de direcciones: copiala de ahí.";
    }
  };
}

$("mono").textContent=CLUB.ini;
$("nombre").textContent=CLUB.nom;
const fuentes=new Set(F.clusters.flatMap(c=>[c.principal,...c.tambien].map(x=>x.fuente)));
$("resumen").textContent=F.clusters.length+" historias · "+fuentes.size+" fuentes · actualizado "+hace(F.clusters[0].horas);
$("vista").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b)return;
  if(b.dataset.tabTabla!==undefined){ tablaSel=+b.dataset.tabTabla; pintar(); return; }
  if(b.dataset.f!==undefined){ filtro=b.dataset.f; pintar(); }});
$("barra").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; tab=b.dataset.tab; pintar(); scrollTo(0,0);});
$("btema").onclick=()=>{ tema=temaReal()==="oscuro"?"claro":"oscuro"; pintar(); };
prefiere.addEventListener("change",()=>{ if(tema==="auto") pintar(); });
pintar();

/* Si los datos del juego ya vienen con la página, no hay nada que pedirle
   al usuario: se salta la pantalla de la key y se carga la temporada.  */
if(window.CACHE) cargarTemporada();

/* ══════════════════ LA CUENTA ══════════════════
   Todo esto solo existe si `sitio.json` tiene el backend configurado. Si no
   lo tiene, `hayBackend` ni está definida —el archivo no se cargó— y la app
   es la de siempre. Por eso el `typeof`: preguntar por una función que no
   existe tira, y no hay razón para que el feed se caiga por eso.        */
const conBackend = typeof hayBackend === "function" && hayBackend();
let cuentaAbierta=false, miNombre=null;

async function arrancarCuenta(){
  if(!conBackend) return;
  cargarSesion();
  /* Al volver del mail, la sesión viene en el hash. Se consume acá, antes
     que nada, y se limpia la dirección. */
  if(capturarVuelta()) cuentaAbierta=true;
  $("bcuenta").hidden=false;
  $("bcuenta").onclick=()=>{ cuentaAbierta=!cuentaAbierta; pintarCuenta(); };
  if(quienSoy()){ try{ miNombre=await miUsuario(); }catch(e){} }
  pintarCuenta();
}

function pintarCuenta(aviso="", mal=false){
  const c=$("cuenta");
  $("bcuenta").textContent = miNombre ? miNombre[0].toUpperCase() : "◍";
  if(!cuentaAbierta){ c.hidden=true; return; }
  c.hidden=false;
  const av = aviso?`<p class="aviso${mal?" mal":""}">${esc(aviso)}</p>`:"";

  if(!quienSoy()){
    c.innerHTML=`<h4>Entrá para jugar con amigos</h4>
      <p>Te mandamos un link por mail. No hay contraseña que inventar ni que recordar.</p>
      <div class="par"><input type="text" id="cmail" placeholder="tu@mail.com" autocomplete="email">
        <button class="boton" id="cenviar">Mandame el link</button></div>${av}`;
    $("cenviar").onclick=async()=>{
      const b=$("cenviar"); b.disabled=true; b.textContent="Mandando…";
      try{
        const m=await pedirLink($("cmail").value, location.origin+location.pathname);
        c.innerHTML=`<h4>Listo</h4><p>Te mandamos un link a <b>${esc(m)}</b>.
          Abrilo desde este mismo teléfono y volvés acá con la sesión iniciada.</p>`;
      }catch(e){ pintarCuenta(e.message, true); }
    };
    return;
  }

  if(!miNombre){
    c.innerHTML=`<h4>Elegí tu nombre de usuario</h4>
      <p>Es el único nombre que van a ver los demás en las tablas. Nada de nombre
         real ni de club: solo usuarios y puntajes.</p>
      <div class="par"><input type="text" id="cuser" placeholder="tuusuario" maxlength="16">
        <button class="boton" id="cguardar">Guardar</button></div>${av}`;
    $("cguardar").onclick=async()=>{
      try{ miNombre=await elegirUsuario($("cuser").value); cuentaAbierta=false; pintarCuenta(); }
      catch(e){ pintarCuenta(e.message, true); }
    };
    return;
  }

  c.innerHTML=`<h4>Hola, ${esc(miNombre)}</h4>
    <p>Tu cuenta está lista. Las ligas de amigos y el fantasy llegan en la próxima.</p>
    <button class="boton flaco" id="csalir">Salir</button>${av}`;
  $("csalir").onclick=()=>{ salir(); miNombre=null; pintarCuenta(); };
}

/* La pestaña del fantasy solo aparece si hay una fecha publicada. Sin eso
   no hay nada que armar, y una pestaña vacía es una promesa incumplida. */
if(window.FECHA) $("btfantasy").hidden = false;

arrancarCuenta();
</script>
