async function elegirPartido(i){
  usarLiga(null);            /* el partido del club propio va con su liga */
  J.liga=null;
  J.err=""; J.fx=J.fixtures[i]; J.jugado=JUGADO(J.fx); J.real=null; J.sim=null;
  J.esLocalA = J.fx.teams.home.id===J.id.A;
  J.id.B = J.esLocalA? J.fx.teams.away.id : J.fx.teams.home.id;
  J.nom.A = J.esLocalA? J.fx.teams.home.name : J.fx.teams.away.name;
  J.nom.B = J.esLocalA? J.fx.teams.away.name : J.fx.teams.home.name;
  J.msg="Armando los planteles con los partidos ANTERIORES. No miro este.";
  pintar();
  try{
    const antes = f => new Date(f.fixture.date) < new Date(J.fx.fixture.date);
    /* Cinco partidos y no tres. Con tres, el que se perdió una fecha por
       molestia desaparece del plantel, y el hincha lo nota enseguida. */
    const mios = J.fixtures.filter(antes).slice(-5);
    let rivales=[];
    try{
      const all=await api("/fixtures",{team:J.id.B,season:J.temporada,league:LEAGUE});
      rivales=all.filter(f=>["FT","AET","PEN"].includes(f.fixture.status.short)&&antes(f))
        .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date)).slice(-5);
    }catch(e){}
    J.pool.A=fusionar(await plantel(mios.map(f=>f.fixture.id), J.id.A),
                      await plantilla(J.id.A));
    J.pool.B=fusionar(await plantel(rivales.map(f=>f.fixture.id), J.id.B),
                      await plantilla(J.id.B));
    if(J.pool.A.length<11||J.pool.B.length<11)
      throw new Error("No hay suficientes partidos previos. Elegí uno más avanzado en la temporada.");
    J.xiA=autoXI(J.pool.A,J.formA); J.xiB=autoXI(J.pool.B,J.formB);
    J.msg=J.pool.A.length+" jugadores tuyos · "+J.pool.B.length+" del rival · "+J.reqs+" pedidos";
    J.paso="armar";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* Gasta una simulación y deja `CUPO` al día. Con cuenta, contra la base;
   sin cuenta, contra el navegador. Si la red falla, la simulación sale
   igual: quedarse sin poder jugar porque no se pudo contar es peor que
   contar de menos. */
async function gastarSimulacion(){
  if(conBackend && typeof usarSimulacion === "function"){
    try{
      const r = await usarSimulacion();
      if(r){ CUPO = { plan: r.plan || "gratis", usadas: r.usadas | 0,
                      hasta: r.hasta || null }; return; }
    }catch(e){}
  }
  CUPO = { plan: CUPO.plan || "gratis", usadas: sumarLocal(), hasta: CUPO.hasta };
}

async function simular11(){
  if(J.animando) return;

  /* El freno, antes de gastar nada. Con `bloquea` apagado esto nunca corta;
     el mensaje aparece igual cuando se pasó del tope, así la persona sabe
     que hay un tope antes de que empiece a existir. */
  const antes = estadoCupo({ ...CUPO, bloquea: CUPO_CFG.bloquea });
  if(!antes.puedeSimular){
    J.err = textoCupo(antes, CUPO.hasta) + " Mirá los planes acá abajo para seguir.";
    pintar();
    document.getElementById("cuenta")?.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }

  await gastarSimulacion();
  await momentoDeAviso();
  const t=tacticas(J.K);

  /* Las líneas primero, las indicaciones después: una indicación no cambia
     quién juega, cambia a qué se dedica. Y devuelve sus propias notas, que
     es lo que permite discutir el número en vez de creerlo. */
  const tB=tacticas(J.KB);
  const ind=aplicarIndicaciones(lineas(J.xiA), lineas(J.xiB), J.IND, J.xiA, J.xiB);
  const LA=ind.A, LB=ind.B;

  /* Cada planteo pesa sobre su propio ataque y sobre el del otro. Con el
     rival en neutro, `tacticas` devuelve todo en 1 y la cuenta queda
     exactamente igual a la de antes: nada de lo viejo se movió. */
  const xgA=xgDe(LA,LB, J.esLocalA, t.mine*tB.theirs, bonusAncho(J.xiA,t.ancho))
            + tB.theirsFlat;
  const xgB=xgDe(LB,LA,!J.esLocalA, tB.mine*t.theirs, bonusAncho(J.xiB,tB.ancho))
            + t.theirsFlat + ind.regalo;

  const d=J.desde, empezado=d.minuto>0||d.golesA||d.golesB||d.rojasA||d.rojasB;
  J.animando=true;
  const b=$("bsim"); if(b){ b.disabled=true; b.textContent="Jugando…"; }
  document.getElementById("campo")?.scrollIntoView({behavior:"smooth",block:"center"});

  /* El resto del partido se juega con el gol esperado ya recortado por el
     tiempo que queda y por las expulsiones. Así lo que se ve en pantalla y
     lo que dice la barra salen de la misma cuenta. */
  const resto=(90-d.minuto)/90;
  let ax=xgA*resto, bx=xgB*resto;
  for(let i=0;i<d.rojasA;i++){ ax*=ROJA.ataca; bx*=ROJA.concede; }
  for(let i=0;i<d.rojasB;i++){ bx*=ROJA.ataca; ax*=ROJA.concede; }

  animarPartido(ax, bx, marc=>{
    J.animando=false;
    J.sim = empezado
      ? simDesde({ xgA, xgB, minuto:d.minuto, golesA:d.golesA, golesB:d.golesB,
                   rojasA:d.rojasA, rojasB:d.rojasB })
      : simular(xgA,xgB);
    J.sim.notas=[...t.notas, ...ind.notas];
    J.sim.estaVez=marc;
    J.paso="resultado"; pintar();
    setTimeout(()=>document.querySelector(".res")?.scrollIntoView({behavior:"smooth",block:"center"}),90);
  }, empezado ? d : null);
}

async function revelar(){
  /* El segundo momento: las formaciones confirmadas. Es una simulación más
     —cuenta para el reloj— pero casi siempre cae horas después de la
     primera, así que el aviso sale. El resumen con el resultado, no: eso se
     ve gratis siempre. */
  await momentoDeAviso();
  J.err=""; J.msg="Buscando el once del DT y lo que pasó…"; pintar();
  try{
    const [al,ev]=await Promise.all([
      api("/fixtures/lineups",{fixture:J.fx.fixture.id}),
      api("/fixtures/events",{fixture:J.fx.fixture.id}),
    ]);
    const mio=al.find(x=>x.team.id===J.id.A);
    const rojas=(ev||[]).filter(e=>e.type==="Card"&&/Red/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed||45, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const penales=(ev||[]).filter(e=>e.type==="Goal"&&/Missed Penalty/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const g=J.fx.goals, misG=J.esLocalA?g.home:g.away, susG=J.esLocalA?g.away:g.home;
    J.real={ once:(mio?.startXI||[]).map(x=>x.player), formacion:mio?.formation,
      misG, susG, rojas, penales,
      simConRojas: rojas.length? simExpulsion(J.sim.xgA,J.sim.xgB,rojas) : null };
    J.msg=""; J.paso="revelado";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* ── LA CANCHA ────────────────────────────────────────────────────────────
   Los dos equipos en el MISMO campo, como en PC Fútbol: el tuyo abajo
   atacando para arriba, el rival arriba atacando para abajo. Tocás un
   globito y elegís quién lo ocupa.                                       */
function coordsDe(form, arriba){
  const slots=slotsDe(form), filas=slots.length, out=[];
  /* LOS DOS EQUIPOS NO PUEDEN CAER EN LA MISMA COLUMNA. Con la misma
     formación de los dos lados —4-3-3 contra 4-3-3 es lo más común— las x
     salían idénticas, y cuando las líneas se cruzaban los globitos quedaban
     uno EXACTAMENTE encima del otro: dos nombres superpuestos, ilegibles,
     que parecen un error de dibujo.

     Tres puntos y medio de corrimiento alcanzan para que se vean los dos y
     además queda más real: un marcador no se para arriba del delantero, se
     para al lado. */
  const corrido = arriba ? 3.5 : -3.5;
  slots.forEach((l,i)=>{
    const t=i/(filas-1);
    const y = arriba ? 7 + t*36 : 93 - t*36;
    for(let j=0;j<l.n;j++)
      out.push({ x:(j+1)/(l.n+1)*100 + corrido, y, cat:l.cat });
  });
  return out;
}
/* ── LAS PERILLAS SE TIENEN QUE VER EN LA CANCHA ─────────────────────────
   Hasta acá movían el resultado y nada más: subías la línea, cambiaban las
   probabilidades y los once puntos seguían exactamente donde estaban. Un
   hincha que mueve "línea alta" espera ver a los defensores subir, y si no
   los ve, la perilla no significa nada.

   Se mueve SOLO tu equipo. El rival no tiene por qué reacomodarse porque vos
   toques una perilla tuya, y además así se ve claro qué cambiaste.       */
function ajustarTactica(coords, arriba, K){
  const lin=(K.linea||0)/100, pre=(K.presion||0)/100, anc=(K.ancho||0)/100;
  const dir = arriba ? 1 : -1;                       // hacia el arco rival
  const campo = coords.filter(c => c.cat !== "G");
  const cy = campo.reduce((a,c)=>a+c.y,0) / Math.max(1, campo.length);

  /* Adónde puede llegar cada uno. No es cosmética: sin topes, con la línea
     al máximo los delanteros se meten en el área rival y con la línea al
     mínimo el arquero se va abajo del borde de la cancha.              */
  const banda   = arriba ? [12, 60] : [40, 88];      // los de campo
  const bandaGK = arriba ? [6, 15]  : [85, 94];

  /* La y que le tocaría a cada uno según las perillas. */
  const ys = coords.map(c => {
    if(c.cat === "G") return c.y + dir*lin*4;
    /* La línea sube o baja el bloque entero. */
    let y = c.y + dir*lin*13;
    /* La presión junta las líneas entre sí y adelanta un poco: un equipo
       que presiona alto es un equipo CORTO, no solo adelantado.       */
    return cy + (y - cy) * (1 - 0.30*pre) + dir*pre*6;
  });

  /* ── El bloque se corre entero ────────────────────────────────────────
     Recortar a cada jugador por separado aplastaba las líneas una contra
     otra: con la línea al mínimo, defensores y volantes terminaban todos
     pegados al tope y encimados. Un equipo que no entra en la cancha
     retrocede completo y conserva su forma.                           */
  const deCampo = ys.filter((_, i) => coords[i].cat !== "G");
  const sobra = Math.max(0, Math.max(...deCampo) - banda[1]);
  const falta = Math.max(0, banda[0] - Math.min(...deCampo));
  const corrimiento = sobra - falta;

  return coords.map((c, i) => {
    const arquero = c.cat === "G";
    const b = arquero ? bandaGK : banda;
    const y = Math.max(b[0], Math.min(b[1], ys[i] - (arquero ? 0 : corrimiento)));
    /* El ancho abre a los de afuera y junta a los del medio. */
    const x = arquero ? c.x : 50 + (c.x - 50) * (1 + 0.38*anc);
    return { ...c, x: Math.max(8, Math.min(92, x)), y };
  });
}

/* Mueve los puntos que ya están en pantalla, sin repintar: si repintáramos
   la vista entera en cada movimiento del dedo, el slider perdería el foco. */
function colocarJugadores(){
  const campo=$("campo"); if(!campo || J.animando) return;
  const cA=ajustarTactica(coordsDe(J.formA,false), false, J.K);

    el.style.left=c.x+"%"; el.style.top=c.y+"%";
  });
}

/* ══════════════════ EL LUGAR DEL AVISO ══════════════════
   Acá NO hay publicidad. Hay un LUGAR donde algún día va a haber una, y las
   reglas de cuándo corresponde mostrarla. Está separado a propósito:

   · Hoy `SITIO.publicidad` no existe, así que `hayRed()` da falso, esto
     resuelve en el acto y la app sigue sin cargar un solo script de terceros
     —que es una propiedad del proyecto y tiene una prueba que la cuida.
   · Cuando entre la red, se enchufa en UN lugar y las reglas de abajo ya
     están escritas y probadas. Las reglas son la parte difícil; el script de
     Google es la parte fácil.

   LAS REGLAS, y por qué cada una:

   1. UNA CADA SESENTA SEGUNDOS DE RELOJ DE PARED. No es una elección
      nuestra: es el mínimo que impone AdSense entre dos avisos. Lo
      replicamos acá para que la app sepa lo mismo que sabe Google y no
      prometa un aviso que no va a salir. Como la simulación dura veinte
      segundos, esto da un aviso cada tres simulaciones sin programar nada
      más — y de paso cumple sola la política de AdMob, que permite como
      mucho uno cada dos acciones.

   2. LA PRIMERA SIMULACIÓN NUNCA LLEVA AVISO. La primera vez que alguien
      aprieta el botón está decidiendo si esta app le gusta. Cobrarle un
      aviso ahí vale centavo y medio y cuesta un usuario.

   3. EL RELOJ VIVE EN EL TELÉFONO, no en memoria. Si viviera en memoria,
      recargar la página lo pondría en cero y dos avisos podrían salir
      seguidos. Si el navegador no deja guardar nada, se falla hacia el lado
      de NO mostrar: perder un aviso es barato, mostrar dos seguidos es una
      infracción.                                                          */
const AVISO = { LLAVE:"armaEl11.ultimoAviso", ESPERA:60000,
                DURACION_SIM:20000, DURACION_PAGA:6000 };

/* ── QUÉ SE COMPRA, EXACTAMENTE ──────────────────────────────────────────
   Los veinte segundos SON el aviso: son el rato durante el cual la app
   puede mostrar uno sin interrumpir nada. Por eso lo que se vende es
   sacarlos, y por eso las dos cosas —la espera y el aviso— salen del mismo
   lugar y no pueden quedar desacopladas. Un premium que no ve avisos pero
   igual espera veinte segundos no compró nada.

   `PREMIUM.activo` lo pone `arrancarCuenta` leyendo la base, y se compara
   contra el reloj del teléfono, que se puede mover. Eso está bien acá: lo
   único que decide es cuánto dura una animación. Lo que de verdad importa
   —hasta cuándo pagó— lo tiene el servidor.                              */
let PREMIUM = { activo:false, hasta:null };
const duracionSim = () => PREMIUM.activo ? AVISO.DURACION_PAGA : AVISO.DURACION_SIM;

const hayRed = () => !!(window.SITIO && window.SITIO.publicidad);
function ultimoAviso(){
  try{ return +localStorage.getItem(AVISO.LLAVE) || 0; }catch(e){ return Infinity; }
}
function anotarAviso(t){
  try{ localStorage.setItem(AVISO.LLAVE, String(t)); }catch(e){}
}
let simulacionesHechas = 0;

/* ══════════════════ EL CUPO DE SIMULACIONES ══════════════════════════════
   Diez por mes son gratis y llevan publicidad. De ahí en adelante hay que
   tener un plan: 40, 100 o sin límite.

   DOS ACLARACIONES QUE CONVIENE TENER ESCRITAS, porque cambian cómo se
   cuenta esto en pantalla:

   1. UNA SIMULACIÓN NO CUESTA NADA. Corre en el teléfono, con datos que ya
      están bajados. El tope no está recuperando un costo: separa al que le
      saca jugo del que pasa a mirar. Es una razón perfectamente buena para
      cobrar — pero es esa, así que la pantalla no dice "el servidor se
      satura", porque sería mentira y alguien lo iba a notar.

   2. EL QUE NO TIENE CUENTA SE CUENTA EN EL NAVEGADOR, y eso se esquiva
      borrando los datos del sitio. Está bien que se esquive: bloquear al
      anónimo con algo serio significaría pedirle cuenta para simular una
      vez, y eso ahuyenta justo al que todavía no sabe si le gusta. El que
      quiere que le cuenten bien, entra.

   `bloquea` viene de sitio.json y hoy está en false: durante la prueba
   cerrada el contador CUENTA Y SE MUESTRA pero no frena a nadie. Un tester
   frenado a la mitad no puede probar nada, y catorce días son catorce días.
   Se prende cambiando un booleano.                                       */
const CUPO_CFG = Object.assign({ gratis: 10, bloquea: false, cobrando: false },
                               (window.SITIO && window.SITIO.cupo) || {});
const TOPES = { gratis: CUPO_CFG.gratis, chico: 40, medio: 100, libre: Infinity };
const LLAVE_CUPO = "armaEl11.cupo";

/* Pura, para poder probarla con casos concretos. */
function estadoCupo({ plan, usadas, bloquea }){
  const tope = TOPES[plan] ?? TOPES.gratis;
  const ilimitado = tope === Infinity;
  const quedan = ilimitado ? Infinity : Math.max(0, tope - usadas);
  return {
    plan, tope, usadas, quedan, ilimitado,
    seAcabo: !ilimitado && quedan === 0,
    /* Con el freno apagado se puede simular igual: lo único que cambia es
       que la pantalla avisa que se pasó. */
    puedeSimular: ilimitado || quedan > 0 || !bloquea,
  };
}

/* ── EL CICLO NO ES EL MES DEL CALENDARIO ────────────────────────────────
   Primero esto se contaba por mes calendario y estaba mal de una forma que
   se ve sola con un ejemplo: el que compraba el 30 se llevaba cuarenta
   simulaciones por un día, y el 1 le entraban cuarenta más. Un plan que se
   paga el 20 dura hasta el 20 del mes que viene.

   EL ANCLA es el día del pago; para el que nunca pagó, el día que empezó a
   usar la app. El ciclo se calcula SIEMPRE desde el ancla sumando meses
   enteros, nunca sumándole un mes al ciclo anterior. La diferencia aparece
   con los días 29, 30 y 31: el 31 de enero más un mes es el 28 de febrero,
   y sumando de a uno ese 28 se quedaría clavado para siempre. Contando
   desde el ancla, marzo vuelve a caer 31. Es la misma cuenta que hace
   Postgres del otro lado, y tiene que serlo: si las dos no coinciden, el
   contador que muestra la pantalla no es el que cuenta el servidor.      */
function sumarMeses(d, n){
  const dia = d.getDate();
  const r = new Date(d.getTime());
  r.setDate(1);
  r.setMonth(r.getMonth() + n);
  const ultimo = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(dia, ultimo));
  return r;
}

function inicioDeCiclo(ancla, ahora = new Date()){
  const a = new Date(ancla);
  let n = (ahora.getFullYear() - a.getFullYear()) * 12 +
          (ahora.getMonth() - a.getMonth());
  if(sumarMeses(a, n) > ahora) n--;
  return sumarMeses(a, Math.max(0, n));
}

/* La fecha EN LA ZONA DEL TELÉFONO, no en UTC. Con `toISOString`, alguien en
   Madrid que abre la app a las 00:30 del día 20 tendría guardado el 19: la
   conversión a UTC le corre el día para atrás. El ciclo de una persona tiene
   que ser el día que esa persona ve en su calendario. */
const enDia = d => d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");

/* El contador del que no tiene cuenta. Guarda el ancla —el día de su primera
   simulación— junto al ciclo que está corriendo: al cambiar de ciclo vuelve
   a cero solo, sin ninguna tarea programada. */
function guardadoLocal(){
  try{ return JSON.parse(localStorage.getItem(LLAVE_CUPO) || "{}") || {}; }
  catch(e){ return {}; }
}
function usoLocal(){
  const g = guardadoLocal();
  if(!g.ancla) return 0;
  return g.ciclo === enDia(inicioDeCiclo(new Date(g.ancla))) ? (g.usadas | 0) : 0;
}
/* Hasta cuándo corre el ciclo del que no tiene cuenta. Sin esto, el que
   vuelve al día siguiente ve el contador bien y la fecha vacía. */
function hastaLocal(){
  const g = guardadoLocal();
  if(!g.ancla) return null;
  return enDia(sumarMeses(inicioDeCiclo(new Date(g.ancla)), 1));
}
function sumarLocal(){
  const g = guardadoLocal();
  const ancla = g.ancla ? new Date(g.ancla) : new Date();
  const usadas = usoLocal() + 1;
  const ciclo = inicioDeCiclo(ancla);
  try{ localStorage.setItem(LLAVE_CUPO, JSON.stringify({
       ancla: ancla.toISOString(), ciclo: enDia(ciclo), usadas })); }catch(e){}
  CUPO.hasta = enDia(sumarMeses(ciclo, 1));
  return usadas;
}

/* Arranca con lo que sepa el navegador. Si hay cuenta, `arrancarCuenta` lo
   pisa con lo que dice la base, que es lo que vale. */
let CUPO = { plan:"gratis", usadas: usoLocal(), hasta: hastaLocal() };

/* "hasta el 20 de octubre" y no "el 1 de cada mes": el ciclo arranca el día
   que se pagó, así que la fecha es distinta para cada persona y hay que
   decirla, no darla por sabida. */
/* `diaDe` ya existe y sirve para el feed: dice "Hoy", "Ayer", "Martes". Acá
   hace falta lo contrario —una fecha futura, siempre con día y mes—, así que
   va con su propio nombre en vez de agrandar aquella con un modo. */
const diaFuturo = iso => {
  if(!iso) return "";
  const d = new Date(iso + (String(iso).length === 10 ? "T12:00:00" : ""));
  return isNaN(d) ? "" : d.toLocaleDateString("es-AR", { day:"numeric", month:"long" });
};

function textoCupo(e, hasta){
  const cuando = diaFuturo(hasta);
  const renueva = cuando ? " Se renueva el " + cuando + "." : "";
  if(e.ilimitado) return "Simulaciones sin límite.";
  if(e.seAcabo)   return "Usaste las " + e.tope + " simulaciones de este mes." + renueva;
  return "Te quedan " + e.quedan + " de " + e.tope + " simulaciones." + renueva;
}

/* ── EL CONTADOR Y LOS PRECIOS, ABAJO DEL BOTÓN DE SIMULAR ───────────────
   Van acá y no adentro del panel de cuenta por una razón concreta: ese panel
   solo se abre si la persona ya tiene cuenta, y el que está probando la app
   por primera vez —que es exactamente a quien hay que contarle que esto
   algún día se paga— no la tiene. El precio se ve donde se siente el tope. */
function bloqueCupo(){
  const e = estadoCupo({ ...CUPO, bloquea: CUPO_CFG.bloquea });
  if(e.ilimitado)
    return `<p class="aviso" style="margin-top:10px">${esc(textoCupo(e, CUPO.hasta))}</p>`;

  const lista = PLANES.length
    ? `<div class="otras" style="margin-top:8px">${PLANES.map(p=>
        `<span><b>${esc(p.nombre || (p.cupo ? p.cupo + " simulaciones" : "Sin límite"))}</b>
         ${esc(plata(p.precio))}</span>`).join("")}</div>`
    : "";

  return `<p class="aviso" style="margin-top:10px">
      <b>${esc(textoCupo(e, CUPO.hasta))}</b>
      ${CUPO_CFG.cobrando
        ? "Con un plan simulás más y sin avisos."
        : "Cuando se pase de diez va a hacer falta un plan; todavía no se cobra nada."}
    </p>${lista}`;
}

/* Pura y sin efectos, para poder probarla con casos concretos. */
function tocaAviso({ hayRed, hechas, ultimo, ahora, premium }){
  if(!hayRed) return false;
  if(premium) return false;                    /* es lo que compró */
  if(hechas < 1) return false;                 /* la primera es gratis */
  return (ahora - ultimo) >= AVISO.ESPERA;
}

/* Devuelve una promesa que se resuelve cuando se puede seguir. Hoy resuelve
   en el acto. */
async function momentoDeAviso(){
  const toca = tocaAviso({ hayRed: hayRed(), hechas: simulacionesHechas,
                           ultimo: ultimoAviso(), ahora: Date.now(),
                           premium: PREMIUM.activo });
  simulacionesHechas++;
  if(!toca) return "sin aviso";
  anotarAviso(Date.now());
  /* Acá se enchufa la red, y en ningún otro lado. */
  return "aviso";
}

/* ── EL PARTIDO ANIMADO ───────────────────────────────────────────────────
   Lo que se ve es UNA de las 6000 simulaciones, no un promedio. Los goles
   se sortean con la misma Poisson que usa el modelo, así que lo que pasa en
   pantalla es una realización honesta del pronóstico — no una animación
   decorativa que después se contradice con el número.                     */
/* ── LOS JUGADORES SE MUEVEN ─────────────────────────────────────────────
   Antes rebotaba una pelota sola entre veintidós globitos clavados, y se
   notaba: no parecía un partido, parecía un salvapantallas.

   Esto no simula nada —la simulación ya está hecha, son 6.000 partidos— es
   la puesta en escena. Cada jugador se corre hacia la pelota una fracción de
   la distancia, y esa fracción cae con la distancia: el que está cerca va a
   buscarla, el que está lejos apenas se acomoda. El arquero casi no se mueve
   y no se despega del arco. Un temblor chico arriba de todo para que no
   parezcan piezas de metegol moviéndose en bloque.

   Se hace con una variable CSS y no tocando left/top, para no pelear con el
   translate(-50%,-50%) que centra el globito.                            */
/* ── EL BLOQUE SE MUEVE, NO TIEMBLA ──────────────────────────────────────
   Fausto: "los globitos no pasan la mitad de la cancha". Tenía razón y era
   estructural, no una impresión. Los números de antes:

   · Las formaciones ocupan el 36% de la cancha: el de abajo va del 93 al
     57, el de arriba del 7 al 43. La mitad está en el 50. En reposo NO
     había un solo jugador pasando la mitad, y quedaba una franja de 14
     puntos en el medio que nadie pisaba nunca.
   · El movimiento estaba topeado en ±17. Un delantero parado en 57 llegaba
     como mucho a 40: apenas cruzaba. Para pisar el área rival (13)
     necesitaba moverse 44, casi el triple del tope.
   · Y el desplazamiento de bloque competía contra ESE MISMO tope junto con
     la atracción a la pelota, así que en la práctica se anulaban.

   Lo que cambia, y son tres cosas distintas:

   1. EL BLOQUE TIENE SU PROPIO PRESUPUESTO. Se calcula aparte y se suma
      aparte, con un rango de ±30 en vez de pelear por los 17 de la
      atracción. Un equipo que ataca se lleva a sus once treinta puntos
      arriba, que es lo que se ve desde la tribuna.
   2. EL BLOQUE TAMBIÉN SE CORRE DE COSTADO. Un equipo real bascula hacia
      donde está la pelota. Sin eso, los once suben y bajan como un ascensor
      y el partido pasa siempre por el medio.
   3. LA CASILLA DEJA DE SER SAGRADA. Antes cada uno volvía siempre a su
      punto y el ruido era de ±2: nadie se cruzaba con nadie. Ahora el ruido
      es mayor y depende del ritmo, así que las líneas se mezclan.

   Y todo termina clavado adentro de la cancha: por muy volcado que esté un
   equipo, un globito afuera del rectángulo no se lee como presión, se lee
   como un error de dibujo.                                              */
/* ── EL TANTEADOR, UN SOLO LUGAR ─────────────────────────────────────────
   Lo usan las dos tarjetas —la simulación y la realidad— y así no se pueden
   ir separando. Los nombres salen de `J.nom`, con tu club primero, que es la
   misma convención que la línea de abajo de la cancha y el xG. */
const tanteador = (a, b) => `<div class="marcador">
    <span class="eq">${esc(J.nom.A)}</span><b>${String(a).trim()}</b>
    <i>-</i>
    <b>${String(b).trim()}</b><span class="eq">${esc(J.nom.B)}</span>
  </div>`;

const CANCHA = { alto: [3, 97], ancho: [3, 97] };
/* EL ARQUERO TIENE SU METRO Y NADIE MÁS LO PISA. Los de afuera llegan hasta
   el borde del área chica ajena y hasta el borde de la propia, pero no
   arriba del arquero: dos globitos en el mismo punto no son dos jugadores,
   son un borrón. */
const PISO = [12, 88];
const ARCO = { A: [89, 97], B: [3, 11] };
const entre = (v, [a, b]) => Math.max(a, Math.min(b, v));

function moverJugadores(campo, bx, by){
  const r = campo.getBoundingClientRect();
  const K = J.K || {}, KB = J.KB || {};
  const rit = (K.ritmo||0)/100;
  /* Con ritmo alto el equipo se estira, se junta más rápido y se desordena
     más. Es la perilla que más se tiene que ver en movimiento. */
  const amplitud = 1 + 0.6*rit;

  campo.querySelectorAll(".jug").forEach(el => {
    const x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top);
    if(isNaN(x0) || isNaN(y0)) return;
    const arquero = el.dataset.cat === "G";
    const mio = el.dataset.lado === "A";
    /* Cada equipo lee las perillas de SU técnico. El bloque del rival
       responde a lo que puso el rival, no a lo tuyo. */
    const suK = mio ? K : KB;
    const pre = (suK.presion||0)/100, lin = (suK.linea||0)/100;

    /* ── 1. EL BLOQUE ────────────────────────────────────────────────────
       `fase` va de -1 (la pelota en mi área: repliego) a +1 (la pelota en
       la del otro: me vuelco). Con presión alta el equipo sale a buscar más
       arriba; con línea alta arranca de más adelante siempre.            */
    const suArco = mio ? 100 : 0;
    const fase = entre((Math.abs(by - suArco) - 50) / 50, [-1, 1]);
    const haciaAdelante = mio ? -1 : 1;
    /* EL BLOQUE NO SE MUEVE EN UNA PIEZA: SE ESTIRA. Un equipo que ataca no
       se corre treinta puntos entero como un bloque de metegol — el
       delantero se mete en el área y el central se queda cerca de la
       mitad. Sin esto, o los delanteros no llegan nunca al área, o los
       defensores terminan de delanteros. Es la diferencia entre un equipo
       y un cardumen. */
    const ESTIRA = { G: 0.2, D: 0.75, M: 1, F: 1.4 };
    const estira = ESTIRA[el.dataset.cat] ?? 1;
    /* Y AL REPLEGAR SE INVIERTE. El que más sube atacando es el que menos
       baja defendiendo: el delantero queda arriba esperando la contra,
       mientras los defensores se hunden. Con el mismo factor para los dos
       lados, el 9 terminaba defendiendo adentro de su propia área — que es
       exactamente lo que no hace un 9. */
    const factor = fase >= 0 ? estira : (2 - estira);
    const empuje = (27 + 12*pre) * amplitud;
    let mov = haciaAdelante * (fase * empuje * factor + lin * 6);

    /* ── AL REPLEGAR NO HAY LUGAR PARA TODOS ─────────────────────────────
       Un central ya está parado a doce puntos de su propio arco. Si
       repliega treinta y cuatro como decía la cuenta, termina adentro del
       área chica, arriba del arquero — y eso es exactamente lo que se veía:
       cuatro defensores y un arquero en el mismo metro cuadrado.
       El repliegue de cada uno se limita AL ESPACIO QUE TIENE DETRÁS. El
       que está lejos se hunde, el que ya está hundido se queda donde está.
       Así el bloque se COMPRIME, que es lo que hace un equipo defendiendo,
       en vez de amontonarse contra la línea. */
    const retrocede = mio ? mov > 0 : mov < 0;
    if (retrocede && !arquero) {
      const espacio = Math.max(0, mio ? PISO[1] - y0 : y0 - PISO[0]);
      mov = Math.sign(mov) * Math.min(Math.abs(mov), espacio);
    }
    /* Techo propio: con ritmo y presión al máximo, la cuenta se pasaría de
       la cancha y los once terminarían apilados contra el arco. */
    const bloqueY = entre(mov, arquero ? [-5, 5] : [-36, 36]);

    /* De costado: el equipo bascula hacia la pelota. El arquero también, un
       poco, que es lo que hace un arquero de verdad. */
    const bloqueX = (bx - 50) / 50 * (arquero ? 4 : 9) * amplitud;

    /* ── 2. LA ATRACCIÓN, con su propio tope ─────────────────────────── */
    const dx = bx - x0, dy = by - y0;
    const lejos = Math.hypot(dx, dy);
    const k = (arquero ? .05 : .30) * Math.max(0, 1 - lejos / 62) * amplitud;
    const topeAtraccion = arquero ? 5 : 16;
    const cerca = v => entre(v, [-topeAtraccion, topeAtraccion]);

    /* ── 3. EL DESORDEN ──────────────────────────────────────────────── */
    const ruido = () => (Math.random() - .5) * (arquero ? 1.2 : 5) * amplitud;

    /* El arquero no se despega del arco pase lo que pase: es lo único que
       de verdad tiene una casilla. */
    const y = arquero
      ? entre(y0 + bloqueY + cerca(dy*k) + ruido(), mio ? ARCO.A : ARCO.B)
      : entre(y0 + bloqueY + cerca(dy*k) + ruido(), PISO);
    const x = entre(x0 + bloqueX + cerca(dx*k) + ruido(), CANCHA.ancho);

    el.style.setProperty("--dx", ((x - x0) / 100 * r.width ).toFixed(1) + "px");
    el.style.setProperty("--dy", ((y - y0) / 100 * r.height).toFixed(1) + "px");
  });
}

function quietos(campo){
  campo.classList.remove("jugando");
  campo.querySelectorAll(".jug").forEach(el => {
    el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); });
}

function animarPartido(xgA, xgB, alTerminar, desde){
  /* `xgA`/`xgB` ya vienen recortados por el tiempo que queda: acá solo se
     ponen en escena. Si el partido arranca en el minuto 60 con 1-0, el
     reloj arranca en 60 y el marcador en 1-0, y se juegan los treinta que
     faltan al mismo ritmo que se jugarían noventa. Menos partido, menos
     espera: es honesto y además es lo que la persona pidió. */
  const D = desde || { minuto:0, golesA:0, golesB:0 };
  const desdeMin = Math.max(0, Math.min(89, D.minuto|0));
  const gA=poissonUno(xgA), gB=poissonUno(xgB);
  const queda = Math.max(1, 90-desdeMin);
  const minutos = n => Array.from({length:n},
    ()=>desdeMin+1+Math.floor(Math.random()*queda)).sort((a,b)=>a-b);
  const eventos=[...minutos(gA).map(m=>({m,lado:"A"})), ...minutos(gB).map(m=>({m,lado:"B"}))]
    .sort((a,b)=>a.m-b.m);
  const posesion = xgA/(xgA+xgB);
  const pel=$("pelota"), rel=$("reloj"), gol=$("golazo"), campo=$("campo");
  if(!pel) return alTerminar({A:gA,B:gB});
  campo?.classList.add("jugando");
  let min=desdeMin, marc={A:D.golesA|0, B:D.golesB|0}, k=0;
  /* UNA SOLA CONVENCIÓN, TU CLUB PRIMERO, y el número al lado del nombre.
     El reloj vive ENTRE los dos nombres, así que el orden pasó a significar
     algo: un "1-0" suelto se lee de izquierda a derecha y con los nombres
     al revés decía lo contrario. Ahora ni siquiera hay que deducirlo: cada
     gol está pegado a su equipo y el reloj solo cuenta minutos. Tu club va
     primero en la línea, en el resultado final y en el xG. */
  const gA_ = $("golA"), gB_ = $("golB");
  const pintarGoles = () => {
    if(gA_){ gA_.hidden=false; gA_.textContent=marc.A; }
    if(gB_){ gB_.hidden=false; gB_.textContent=marc.B; }
  };
  rel.hidden=false; rel.textContent=min+"'";
  pintarGoles();
  const reloj=setInterval(()=>{
    min+=1;
    if(min>90){ clearInterval(reloj); rel.textContent="90'"; pintarGoles();
      if(campo) quietos(campo);
      setTimeout(()=>alTerminar(marc), 500); return; }
    let x=14+Math.random()*72;
    let y = Math.random()<posesion ? 12+Math.random()*36 : 52+Math.random()*36;
    let huboGol=false;
    while(k<eventos.length && eventos[k].m<=min){
      const e=eventos[k++]; marc[e.lado]++; huboGol=true;
      x=50; y = e.lado==="A" ? 5 : 95;
    }
    pel.style.left=x+"%"; pel.style.top=y+"%";
    if(campo) moverJugadores(campo, x, y);
    rel.textContent = min+"'"; pintarGoles();
    if(huboGol){ gol.classList.add("on"); setTimeout(()=>gol.classList.remove("on"), 550); }
  /* ── POR QUÉ EL PARTIDO DURA VEINTE SEGUNDOS ────────────────────────
     Dos razones, y ninguna es estética.

     La primera: se ve mejor. Antes el reloj saltaba de tres en tres minutos
     y la pelota daba treinta saltos; ahora avanza de a un minuto y da
     noventa. Es un reloj de partido, no un contador.

     La segunda es de producto y es la que hay que respetar: veinte segundos
     por simulación significa que TRES simulaciones seguidas tardan sesenta,
     que es justo el mínimo que AdSense impone entre dos avisos. Con eso, la
     cadencia de publicidad sale sola —una cada tres— sin programar ninguna
     regla de frecuencia y sin pasarse de lo que permite la política.

     Por eso el ritmo YA NO ACELERA EL RELOJ. Antes lo acortaba hasta un 22%
     y eso movía la duración; el ritmo se sigue viendo, pero en cómo se
     mueven los jugadores (ver `amplitud` en moverJugadores), que es donde
     tiene sentido que se vea. Si algún día alguien quiere que esto sea más
     ágil: acortarlo abajo de veinte segundos rompe la cuenta de arriba.  */
  }, Math.round(duracionSim() / 90));
}

/* ── elegir jugador para un puesto ── */
function abrirPicker(lado, slot, cat){
  const pool=J.pool[lado], xi=(lado==="A"?J.xiA:J.xiB);
  const enCancha=new Set(xi.filter(Boolean).map(p=>p.id));
  const ord=[...pool].map(p=>({p, v: fuerza(p).v - penalPuesto(p.pos,cat)}))
    .sort((a,b)=>b.v-a.v);
  const d=document.createElement("div"); d.className="picker";
  d.innerHTML=`<div class="hoja2">
    <h4>¿Quién juega de ${cat==="G"?"arquero":cat==="D"?"defensor":cat==="M"?"volante":"delantero"}?</h4>
    <p class="aviso" style="margin:0 0 10px">El número es su fuerza EN ESTE PUESTO: ya tiene descontado
    el castigo por jugar fuera de posición.</p>
    ${ord.map(o=>`<div class="opt${enCancha.has(o.p.id)?" enCancha":""}" data-id="${o.p.id}">
      <span class="p">${o.p.pos}</span><span>${esc(o.p.nombre)}</span>
      <span class="v">${o.v.toFixed(2)}</span></div>`).join("")}
  </div>`;
  d.onclick=e=>{
    const o=e.target.closest(".opt");
    if(!o){ if(e.target===d) d.remove(); return; }
    const p=pool.find(x=>x.id===+o.dataset.id);
    const arr=(lado==="A"?J.xiA:J.xiB);
    const yaEsta=arr.findIndex(q=>q&&q.id===p.id);
    if(yaEsta>=0 && yaEsta!==slot){                   // ya jugaba: los intercambia
      const otro=arr[slot];
      arr[yaEsta]= otro? {...otro, slotCat:arr[yaEsta].slotCat} : null;
    }
    arr[slot]={...p, slotCat:cat};
    d.remove(); pintar();
  };
  document.body.appendChild(d);
}

/* Una tarjeta de planteo: los botones armados arriba y las cuatro perillas
   abajo. Es lo MISMO estado — los botones escriben las perillas y las
   perillas mandan. Cuál está encendido se deduce con `planteoDe`, así que
   mover una perilla a mano apaga el botón solo: no hay dos verdades que
   puedan quedar en desacuerdo. */

  const mio = lado === "A";

  const activo = planteoDe(K);
  const attr = mio ? "data-k" : "data-kb";

     el planteo a alguien sin que lo pida es decidir por él en su propio juego. */

  const ganando = mio ? J.desde.golesA > J.desde.golesB : J.desde.golesB > J.desde.golesA;
  const sug = planteoSugerido({ conUnoMenos, ganando });
  const nombreSug = sug ? (PLANTEOS.find(p=>p.id===sug)||{}).n : "";
  const ofrecer = sug && activo !== sug
    ? `<p class="aviso" style="margin:6px 0 0">Con uno menos, lo normal es
        ${mio?"que te metas":"que se meta"} atrás.
        <button class="gh" data-sug="${lado}" data-sugv="${sug}"
          style="margin-left:6px">${esc(nombreSug)}</button></p>`
    : "";

  const elegido = PLANTEOS.find(p=>p.id===activo);
  return `<h3 class="sec">${mio ? "Tu planteo" : "El planteo del rival"}</h3>
    <div class="tarjeta">
      <nav class="filtros">${PLANTEOS.map(p=>
        `<button class="chip" data-pl="${lado}" data-plv="${p.id}"
          aria-pressed="${p.id===activo}">${esc(p.n)}</button>`).join("")}
        ${activo?"":`<button class="chip" aria-pressed="true" disabled>A mano</button>`}
      </nav>
      <p class="aviso" style="margin:2px 0 8px">${elegido ? esc(elegido.dice)
        : "Las perillas están movidas a mano. Tocá un planteo para volver a uno armado."}</p>
      ${ofrecer}
      ${KNOBS.map(k=>{const v=K[k.id];return `
        <div class="perilla"><div class="ph"><b>${k.n}</b>

      </div>

      <h3 class="sec">Indicaciones</h3>
      <div class="tarjeta">${INDICACIONES.map(g=>{
        const eleg = J.IND[g.id] || g.opciones[0].v;
        const o = g.opciones.find(x=>x.v===eleg) || g.opciones[0];

          <div><label for="dmin">Minuto</label>
            <input type="number" id="dmin" min="0" max="89" step="1" value="${J.desde.minuto}"></div>
          <div><label for="drA">Expulsados</label>
            <select id="drA">
              <option value="0-0"${J.desde.rojasA===0&&J.desde.rojasB===0?" selected":""}>Ninguno</option>
              <option value="0-1"${J.desde.rojasB===1?" selected":""}>Al rival, uno menos</option>
              <option value="1-0"${J.desde.rojasA===1?" selected":""}>A vos, uno menos</option>

        </div>
        <div class="fila2" style="margin-top:8px">
          <div><label for="dgA">Tus goles</label>

          <div><label for="dgB">Sus goles</label>
            <input type="number" id="dgB" min="0" max="9" step="1" value="${J.desde.golesB}"></div>
        </div>
        ${J.desde.minuto>0?`<p class="nota" style="margin-top:10px">Va a simular
          los ${90-J.desde.minuto} minutos que faltan y sumarle el
          ${J.desde.golesA}-${J.desde.golesB} que ya está.
          <b>Cómo se juegan esos minutos lo decidís vos</b>, con las perillas y
          las indicaciones de arriba: si vas ganando con uno menos, metete
          atrás y jugá de contra, y la cuenta lo toma. Lo que el modelo no
          hace es adivinarlo solo.
          <b>Y al rival lo planteás arriba</b>, con su propia tanda de

      </div>

      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="acc" id="bsim" style="flex:1">${

    const deOtraLiga = J.liga && (window.LIGAS||{})[J.liga];

        <div class="meta" style="justify-content:center">${s.estaVez

             </div>

    if(J.real){
      const R=J.real, gano=R.misG>R.susG, empate=R.misG===R.susG;
      const acerto = (gano&&J.sim.win>J.sim.loss&&J.sim.win>J.sim.draw)
                   || (empate&&J.sim.draw>=J.sim.win&&J.sim.draw>=J.sim.loss)
                   || (!gano&&!empate&&J.sim.loss>J.sim.win);
      out+=`<h3 class="sec">La realidad</h3><div class="tarjeta">
        ${tanteador(R.misG, R.susG)}
        ${R.formacion?`<div class="meta" style="justify-content:center">el DT puso ${esc(R.formacion)}</div>`:""}
        ${R.once.length?`<div class="otras" style="margin-top:12px">${R.once.map(p=>
          `<span><b>${esc(p.pos||"")}</b> ${esc(p.name)}</span>`).join("")}</div>`:""}
        ${R.rojas.length?`<p class="nota"><b>Expulsión:</b> ${R.rojas.map(r=>
          esc(r.quien||"")+" ("+(r.esMio?"tuyo":"del rival")+", "+r.min+"')").join(" · ")}.
          ${R.simConRojas?`Con eso adentro, la simulación pasa a
          ${R.simConRojas.win.toFixed(0)}% / ${R.simConRojas.draw.toFixed(0)}% / ${R.simConRojas.loss.toFixed(0)}%.`:""}</p>`:""}
        ${R.penales.length?`<p class="nota"><b>Penal errado:</b> ${R.penales.map(p=>

        <p class="nota">${acerto
          ? "El pronóstico dio en el resultado."
          : "Le erramos. Sin excusas: el modelo dijo otra cosa y el partido dijo esta."}</p>
        ${cab}
      </div>`;
    }
    return out;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════════════════
   EL PRONÓSTICO VIAJA EN EL LINK
   ──────────────────────────────────────────────────────────────────────────
   Un pronóstico sobre un partido que todavía no se jugó hay que poder
   guardarlo. Sin backend la tentación es el almacenamiento del navegador,
   pero eso muere en cuanto cambiás de teléfono y no se puede compartir.

   Va en el hash de la URL. Tiene tres ventajas de una: sobrevive a recargar,
   se puede mandar por WhatsApp, y es EXACTAMENTE el mecanismo que va a
   necesitar "desafiá a un amigo" — el link ya es el pronóstico.
   ══════════════════════════════════════════════════════════════════════════ */
const b64 = {
  poner: o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,""),
  sacar: t => JSON.parse(decodeURIComponent(escape(atob(t)))),
};
function linkDelPronostico(){
  const once = xi => xi.map(p => p ? p.id : 0);
  return location.origin + location.pathname + "#p=" + b64.poner({
    c: CLUB.id, t: J.temporada, f: J.fx.fixture.id,
    fa: J.formA, fb: J.formB, a: once(J.xiA), b: once(J.xiB), k: J.K,
  });
}
function leerPronostico(){
  const m = location.hash.match(/#p=([A-Za-z0-9+/]+)/);
  if(!m) return null;
  try { return b64.sacar(m[1]); } catch(e){ return null; }
}

/* ══════════════════ render y eventos ══════════════════ */
function pintar(){
  pintarColores();
  /* El borrador se guarda acá y no en cada función que toca el equipo. Hay
     ocho lugares que lo modifican —sumar, sacar, cambiar formación, poner
     la cinta, el banco— y el día que alguien agregue el noveno se va a
     olvidar de llamar al guardado. Desde acá no se puede olvidar. */
  guardarBorrador();
  $("vista").innerHTML = tab==="feed"?vistaFeed() : tab==="juego"?vistaJuego()
                       : tab==="fantasy"?vistaFantasy() : vistaNumeros();
  document.querySelectorAll("#barra button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  if(tab==="juego") enganchar();
  if(tab==="fantasy") engancharFantasy();
}

function enganchar(){
  const k=$("k"); if(k) k.oninput=e=>J.key=e.target.value.trim();
  const t=$("temp"); if(t) t.onchange=e=>J.temporada=+e.target.value;
  const bc=$("bcargar"); if(bc) bc.onclick=()=>{
    if(!J.key){ J.err="Pegá la API key primero."; pintar(); return; } cargarTemporada(); };
  document.querySelectorAll(".fx").forEach(el=>el.onclick=()=>{
    el.setAttribute("aria-selected","true"); elegirPartido(+el.dataset.fx); });
  const fa=$("fA"), fb=$("fB");
  if(fa) fa.onchange=e=>{ J.formA=e.target.value; J.xiA=autoXI(J.pool.A,J.formA); pintar(); };
  if(fb) fb.onchange=e=>{ J.formB=e.target.value; J.xiB=autoXI(J.pool.B,J.formB); pintar(); };
  document.querySelectorAll(".jug").forEach(g=>g.onclick=()=>{
    if(J.animando) return;
    abrirPicker(g.dataset.lado, +g.dataset.slot, g.dataset.cat);
  });
  const moverPerilla = (attr, dest, mueveCancha) =>
    document.querySelectorAll("input["+attr+"]").forEach(r=>r.oninput=e=>{
      const id=e.target.dataset[attr==="data-k"?"k":"kb"], v=+e.target.value;
      dest[id]=v;
      const k=KNOBS.find(x=>x.id===id);
      e.target.closest(".perilla").querySelector(".pv").textContent =
        Math.abs(v)<15?"neutro":(v<0?k.izq:k.der)+" "+Math.abs(v)+"%";
      if(mueveCancha) colocarJugadores();
      /* El botón del planteo se apaga solo si las perillas ya no son las
         suyas. Se repinta al soltar, no en cada pixel: repintar mientras
         arrastrás el dedo te saca el dedo de encima del control. */
      clearTimeout(J.__repinta);
      J.__repinta = setTimeout(()=>{ if(!J.animando) pintar(); }, 450);
    });
  moverPerilla("data-k",  J.K,  true);
  moverPerilla("data-kb", J.KB, false);

  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{
    const K = planteo(b.dataset.plv); if(!K) return;
    Object.assign(b.dataset.pl==="A" ? J.K : J.KB, K);
    pintar();
  });
  document.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{
    const K = planteo(b.dataset.sugv); if(!K) return;
    Object.assign(b.dataset.sug==="A" ? J.K : J.KB, K);
    pintar();
  });
  document.querySelectorAll("[data-liga]").forEach(b=>b.onclick=()=>{
    J.liga = (J.liga===b.dataset.liga) ? null : b.dataset.liga; J.err=""; pintar(); });
  document.querySelectorAll("[data-part]").forEach(el=>{
    const ir = () => simularDeLiga(J.liga, el.dataset.part);
    el.onclick = ir;
    el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  });
  const bv=$("bvolver"); if(bv) bv.onclick=volverAMiClub;

  const bs=$("bsim"); if(bs) bs.onclick=simular11;
  const ba=$("bauto"); if(ba) ba.onclick=()=>{ J.xiA=autoXI(J.pool.A,J.formA); pintar(); };

  document.querySelectorAll("[data-ind]").forEach(b=>b.onclick=()=>{
    J.IND[b.dataset.ind]=b.dataset.val; pintar(); });

  const nEntero=(id,max)=>{ const e=$(id); if(!e) return null;
    const n=Math.round(+e.value||0); return Math.max(0, Math.min(max, n)); };
  const leerDesde=()=>{
    J.desde.minuto = nEntero("dmin",89) ?? 0;
    J.desde.golesA = nEntero("dgA",9) ?? 0;
    J.desde.golesB = nEntero("dgB",9) ?? 0;
    const r=($("drA")||{}).value||"0-0";
    J.desde.rojasA=+r.split("-")[0]; J.desde.rojasB=+r.split("-")[1];
    pintar();
  };
  ["dmin","dgA","dgB"].forEach(id=>{ const e=$(id); if(e) e.onchange=leerDesde; });
  const dr=$("drA"); if(dr) dr.onchange=leerDesde;
  const br=$("brev"); if(br) br.onclick=revelar;
  /* Compartir de verdad, no copiar. En el teléfono —que es donde esto se usa—
     `navigator.share` abre WhatsApp directo; copiar al portapapeles obliga a
     salir de la app, abrir el chat y pegar, y ahí se pierde la mitad de la
     gente.

     ESTO USA EL MISMO `compartir` QUE EL FANTASY, y antes no. Tenía su
     propia copia de la lógica, sin el paso de wa.me y sin la red del
     execCommand, así que en la compu terminaba diciendo "copiala de la
     barra de direcciones" — que es el botón admitiendo que no hizo nada.
     Dos caminos para lo mismo es un camino que nadie arregla.          */
  const bg=$("bguardar");
  if(bg) bg.onclick=async()=>{
    const link=linkDelPronostico();
    location.hash = link.split("#")[1];
    const texto = "Armé mi once de " + CLUB.nom + " para " +
      (J.nom.A||"") + " vs " + (J.nom.B||"") + ". A ver si le pegás mejor que yo:";
    const r = await compartir(texto, link);
    const dice = {
      compartido: "Listo. Cuando termine el partido, ese link te muestra la comparación.",
      whatsapp:   "Te abrí WhatsApp con el mensaje listo.",
      copiado:    "Copiado. Mandáselo a quien quieras: cuando termine el partido, ese link muestra la comparación.",
      nada:       "No pude copiarlo. El link quedó en la barra de direcciones.",
    };
    if(r) $("avisoLink").textContent = dice[r] || dice.copiado;
  };
}

/* El borrador de este teléfono, antes de dibujar nada. No necesita cuenta

{

/* Si los datos del juego ya vienen con la página, no hay nada que pedirle
   al usuario: se salta la pantalla de la key y se carga la temporada.  */

/* ══════════════════ LA CUENTA ══════════════════
   Todo esto solo existe si `sitio.json` tiene el backend configurado. Si no
   lo tiene, `hayBackend` ni está definida —el archivo no se cargó— y la app
   es la de siempre. Por eso el `typeof`: preguntar por una función que no
   existe tira, y no hay razón para que el feed se caiga por eso.        */
const conBackend = typeof hayBackend === "function" && hayBackend();
let cuentaAbierta=false, miNombre=null;
/* Arranca en "crear cuenta" porque el que llega por primera vez es el que
   más ayuda necesita; el que ya tiene cuenta sabe lo que busca. */
let creandoCuenta=true, mailEscrito="";

async function arrancarCuenta(){
  if(!conBackend) return;
  cargarSesion();
  /* Al volver del mail, la sesión viene en el hash. Se consume acá, antes
     que nada, y se limpia la dirección. */
  if(capturarVuelta()) cuentaAbierta=true;
  /* Y el código de invitación viaja por el MISMO hash. Se lee después de
     los tokens —que se consumen y borran la dirección— pero el código se
     guarda aparte, así sobrevive el viaje al correo y la vuelta. */
  capturarInvitacion();
  $("bcuenta").hidden=false;
  $("bcuenta").onclick=()=>{ cuentaAbierta=!cuentaAbierta; pintarCuenta(); };
  /* Antes de la tanda de pedidos, no después de que fallen: si el token de
     una hora ya venció, esto lo renueva UNA vez y todo lo que sigue sale
     con el nuevo. Sin esto, seis pedidos daban 401 juntos y se peleaban por
     renovar con el mismo refresh, que es de un solo uso. */
  if(quienSoy() && typeof asegurarSesion==="function"){ try{ await asegurarSesion(); }catch(e){} }
  if(quienSoy()){ try{ miNombre=await miUsuario(); }catch(e){} }

  /* LOS PRECIOS SE PIDEN SIEMPRE, tenga cuenta o no. Estaban adentro del
     `if(quienSoy())` y el efecto era exactamente el contrario del que se
     busca: el único que veía cuánto sale era el que ya se había registrado,
     y al que recién prueba la app —el que tiene que enterarse de que esto
     algún día se paga— no le aparecía nada. El endpoint es público a
     propósito: los precios no son un secreto, lo que no se puede es
     elegirlos. */
  try{ PLANES = await planesPremium(); }catch(e){}

  pintarCuenta();
  pintar();
  if(quienSoy()){
    try{ PREMIUM = (await miPremium()) || PREMIUM; }catch(e){}
    /* El cupo del que tiene cuenta lo sabe el servidor. El del anónimo lo
       lleva el navegador y ya quedó leído al arrancar. */
    try{ const c = await miCupo();
         if(c) CUPO = { plan:c.plan||"gratis", usadas:c.usadas|0, hasta:c.hasta||null }; }catch(e){}
    pintarCuenta();
    await traerMiEquipo();
    await cargarLigas();
    await cargarZonas();
    await cargarPuntos();
    await usarInvitacion();
    pintar();
  }

  /* El que vuelve de pagar. Mercado Pago le avisa al servidor por un lado y
     manda a la persona de vuelta por otro, y a veces llega antes la persona:
     por eso se vuelve a preguntar unas cuantas veces antes de decirle nada.
     Mostrarle "todavía no figura" al que acaba de pagar es la peor pantalla
     posible.                                                             */
  if(/[?&]pago=1\b/.test(location.search)){
    cuentaAbierta=true; pintarCuenta();
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    refrescarPremium(6);
  }
}

function pintarCuenta(aviso="", mal=false){
  const c=$("cuenta");
  $("bcuenta").textContent = miNombre ? miNombre[0].toUpperCase() : "◍";
  if(!cuentaAbierta){ c.hidden=true; return; }
  c.hidden=false;
  const av = aviso?`<p class="aviso${mal?" mal":""}">${esc(aviso)}</p>`:"";

  if(!quienSoy()){
    /* ── POR QUÉ AHORA HAY CONTRASEÑA ──────────────────────────────────
       Empezamos solo con el link por mail, y el argumento era bueno: la
       contraseña que no guardamos es la que no podemos perder. Pero el
       link falla de dos maneras que no dependen de nosotros y que pesan
       más que el argumento:

       · Supabase solo redirige a las direcciones de su lista blanca. Si
         la de destino no está, manda a otra página, sin sesión y sin
         error. Parece que el link no anda.
       · En el teléfono, tocar el link en Gmail lo abre en el navegador
         INTERNO de Gmail. La sesión queda guardada ahí. La persona vuelve
         a Chrome y no está: hizo todo bien y no entró.

       La contraseña no sale de esta pantalla, así que no le puede pasar
       ninguna de las dos. El link queda para el que la olvidó.          */
    c.innerHTML=`<h4>${creandoCuenta?"Creá tu cuenta":"Entrá a tu cuenta"}</h4>
      <p>${creandoCuenta
        ? "Es para guardar tu equipo y jugar los torneos con tus amigos. Nada más."
        : "Con el mail y la contraseña que usaste al crearla."}</p>
      <div style="display:grid;gap:8px">
        <input type="email" id="cmail" placeholder="tu@mail.com"
               autocomplete="email" value="${esc(mailEscrito)}">
        <input type="password" id="cclave" placeholder="contraseña"
               autocomplete="${creandoCuenta?"new-password":"current-password"}">
        <button class="boton" id="centrar">${
          creandoCuenta?"Crear mi cuenta":"Entrar"}</button>
      </div>
      ${av}
      <p class="aviso" style="margin-top:12px">
        <a href="#" id="cotro">${creandoCuenta
          ? "Ya tengo cuenta, quiero entrar"
          : "No tengo cuenta, quiero crear una"}</a>
      </p>
      <p class="aviso" style="margin-top:2px">
        <a href="#" id="clink">Prefiero recibir un link por mail</a>
        ${creandoCuenta?"":" · sirve también si te olvidaste la contraseña"}</p>`;

    /* El mail escrito se guarda en memoria al cambiar de pantalla: hacer
       que alguien lo tipee dos veces porque se equivocó de botón es la
       clase de detalle que hace abandonar un registro. */
    const leerMail = () => { mailEscrito = ($("cmail")||{}).value || ""; };

    $("cotro").onclick=e=>{ e.preventDefault(); leerMail();
      creandoCuenta=!creandoCuenta; pintarCuenta(); };

    $("centrar").onclick=async()=>{
      const b=$("centrar"); const mail=($("cmail")||{}).value, clave=($("cclave")||{}).value;
      mailEscrito = mail;
      b.disabled=true; b.textContent=creandoCuenta?"Creando…":"Entrando…";
      try{
        if(creandoCuenta){
          const r=await crearCuenta(mail, clave);
          if(r.confirmar){
            c.innerHTML=`<h4>Revisá tu correo</h4><p>Te mandamos un mail a
              <b>${esc(mail)}</b> para confirmar la cuenta. Abrilo y volvés
              a entrar con tu contraseña.</p>`;
            return;
          }
        }else{
          await entrarConClave(mail, clave);
        }
        miNombre=null;
        try{ miNombre=await miUsuario(); }catch(e){}
        pintarCuenta();
        await cargarLigas(); await cargarZonas(); await cargarPuntos();
        await traerMiEquipo(); await usarInvitacion(); pintar();
      }catch(e){ pintarCuenta(e.message, true); }
    };

    $("clink").onclick=async e=>{
      e.preventDefault(); leerMail();
      try{
        /* De dónde salió, para que el rescate de la portada la devuelva a
           su club si Supabase la manda al inicio. */
        try{ localStorage.setItem("armaEl11.volviendoDe", location.pathname); }catch(x){}
        const m=await pedirLink(mailEscrito, location.origin+location.pathname);
        c.innerHTML=`<h4>Listo</h4><p>Te mandamos un link a <b>${esc(m)}</b>.
          <b>Abrilo en este mismo navegador.</b> Si lo abrís desde la app del
          correo, algunos teléfonos lo abren en un navegador aparte y la
          sesión queda ahí adentro.</p>`;
      }catch(err){ pintarCuenta(err.message, true); }
    };
    return;
  }

  if(!miNombre){
    c.innerHTML=`<h4>Elegí tu nombre de usuario</h4>
      <p>Es el único nombre que van a ver los demás en las tablas. Nada de nombre
         real ni de club: solo usuarios y puntajes.</p>
      <div class="par"><input type="text" id="cuser" placeholder="tuusuario" maxlength="16">
        <button class="boton" id="cguardar">Guardar</button></div>${av}`;
    $("cguardar").onclick=async()=>{
      try{ miNombre=await elegirUsuario($("cuser").value); cuentaAbierta=false; pintarCuenta(); }
      catch(e){ pintarCuenta(e.message, true); }
    };
    return;
  }

  /* El borrado va en dos toques a propósito. Uno solo, al lado de "Salir",
     es un accidente esperando: se pierde la cuenta por un dedo mal apoyado y
     no hay deshacer. Dos toques con el aviso en el medio no es fricción por
     fricción — es la única barrera que hay antes de algo irreversible. */
  c.innerHTML=`<h4>Hola, ${esc(miNombre)}</h4>
    <p>Tu cuenta está lista. Las ligas de amigos y el fantasy llegan en la próxima.</p>
    ${bloquePremium()}
    <button class="boton flaco" id="csalir">Salir</button>
    ${borrando
      ? `<div class="pendiente" style="margin-top:14px">
           <b>¿Seguro que querés borrar tu cuenta?</b><br>
           Se borran tu mail, tu usuario, tus equipos y tus puntajes, y no se
           pueden recuperar. Los torneos que hayas creado siguen para los demás.
         </div>
         <div class="par" style="margin-top:10px">
           <button class="boton" id="cnoborrar">Mejor no</button>
           <button class="boton flaco" id="csiborrar">Sí, borrarla</button>
         </div>`
      : `<button class="boton flaco" id="cborrar" style="margin-top:10px">Borrar mi cuenta</button>`}
    ${av}`;
  engancharPremium();
  $("csalir").onclick=()=>{ salir(); miNombre=null; borrando=false;
                            PREMIUM={activo:false,hasta:null};
                            ZONAS=[]; zonaTabla={}; MIS_PUNTOS=[]; pintarCuenta(); };
  const bb=$("cborrar");   if(bb) bb.onclick=()=>{ borrando=true;  pintarCuenta(); };
  const bn=$("cnoborrar"); if(bn) bn.onclick=()=>{ borrando=false; pintarCuenta(); };
  const bs=$("csiborrar"); if(bs) bs.onclick=async()=>{
    try{
      await borrarMiCuenta();
      miNombre=null; borrando=false; cuentaAbierta=true;
      pintarCuenta("Listo, tu cuenta se borró.");
    }catch(e){ pintarCuenta(e.message, true); }
  };
}

/* ══════════════════ LO QUE SE VENDE ══════════════════
   Un solo párrafo honesto y tres botones. Sin cuenta regresiva, sin "última
   oportunidad", sin un precio tachado al lado de otro. Lo que se ofrece es
   sacar la espera y los avisos, y eso se puede decir en una línea; todo lo
   demás que se suele poner alrededor está para tapar que la oferta es
   flaca.

   LOS PRECIOS NO ESTÁN ESCRITOS ACÁ. Se piden al servidor, que es el mismo
   que después le dice a Mercado Pago cuánto cobrar. Si estuvieran en los
   dos lados, el día que cambie uno la app mostraría un número y el checkout
   otro — y esa persona no vuelve a intentar nunca más.                   */
let PLANES=[], comprando=false;

const cuantoFalta = hasta => {
  const d = Math.ceil((new Date(hasta) - Date.now()) / 864e5);
  return d <= 1 ? "hasta hoy" : d < 60 ? "por " + d + " días más"
                              : "hasta el " + new Date(hasta).toLocaleDateString("es-AR");
};

const plata = n => "$" + Number(n).toLocaleString("es-AR");

/* ── LOS PLANES, A LA VISTA DE TODOS ─────────────────────────────────────
   Se muestran SIEMPRE, incluso ahora que no se cobra nada. Dos razones: el
   que prueba la app tiene que poder ver adónde va esto sin que se lo cuenten
   aparte, y un precio que aparece el día que empieza a cobrarse se lee como
   una trampa. Mientras `cobrando` esté apagado, los botones no compran: la
   pantalla dice que todavía es gratis y los deja de adorno informativo. */
function bloquePremium(){
  if(!conBackend) return "";

  const e = estadoCupo({ ...CUPO, bloquea: CUPO_CFG.bloquea });
  const contador = `<p class="aviso" style="margin-top:12px">
      <b>${esc(textoCupo(e, CUPO.hasta))}</b></p>`;

  if(PREMIUM.activo)
    return `<div class="pendiente" style="margin-top:14px">
      <b>Tenés el pase</b> ${esc(cuantoFalta(PREMIUM.hasta))}. Simulás sin espera
      y sin avisos.</div>${contador}`;

  if(!PLANES.length) return contador;

  /* Los precios y los cupos salen del servidor, nunca de acá: si estuvieran
     escritos en la app, el día que cambie uno la pantalla diría un número y
     Mercado Pago cobraría otro. */
  const tarjeta = p => `<button class="boton flaco" data-plan="${esc(p.id)}"
      ${comprando || !CUPO_CFG.cobrando ? "disabled" : ""}
      style="flex:1 1 150px;text-align:left;line-height:1.35">
      <b>${esc(p.nombre || (p.cupo ? p.cupo + " simulaciones" : "Sin límite"))}</b><br>
      <span style="opacity:.75">${esc(plata(p.precio))} por mes</span></button>`;

  return `<div class="pendiente" style="margin-top:14px">
      <b>Los planes</b><br>
      Diez simulaciones por mes son gratis y llevan un aviso. Con un plan
      simulás más, el partido se juega en seis segundos en vez de veinte y no
      aparece ningún aviso.
    </div>
    ${contador}
    <div class="par" style="margin-top:10px;flex-wrap:wrap;gap:8px">
      ${PLANES.map(tarjeta).join("")}
    </div>
    <p class="aviso" style="margin-top:8px">${CUPO_CFG.cobrando
      ? "Se paga con Mercado Pago. Se vence solo: no queda nada debitándose todos los meses."
      : "<b>Todavía no se cobra nada.</b> Los precios están acá para que sepas de antemano cuánto va a salir cuando se prenda."}</p>`;
}

function engancharPremium(){
  document.querySelectorAll("#cuenta [data-plan]").forEach(b=>{
    b.onclick=async()=>{
      if(comprando) return;
      comprando=true; b.textContent="Abriendo…";
      /* Desde qué página salió. La página de gracias vive en la raíz y no
         sabe de qué club venía: sin esto, el que pagó vuelve a la portada y
         tiene que buscar su equipo otra vez. */
      try{ localStorage.setItem("armaEl11.volverA",
             location.pathname + "?pago=1"); }catch(e){}
      try{
        /* El link se abre en ESTA pestaña. Abrir una nueva después de
           esperar a la red es lo que el navegador bloquea por "no lo pidió
           nadie", y la persona se queda mirando un botón que no hizo nada. */
        location.href = await linkDePago(b.dataset.plan);
      }catch(e){ comprando=false; pintarCuenta(e.message, true); }
    };
  });
}

/* Al volver de Mercado Pago la app no se cree lo que diga la dirección: el
   pago lo confirma el servidor por su lado. Lo único que hace este rato de
   espera es volver a preguntar, porque el aviso de Mercado Pago y la vuelta
   de la persona son dos carreras distintas y a veces gana la persona. */
async function refrescarPremium(reintentos=0){
  if(!conBackend || !quienSoy()) return;
  try{
    const p = await miPremium();
    if(p) PREMIUM = p;
  }catch(e){}
  if(!PREMIUM.activo && reintentos > 0){
    setTimeout(()=>refrescarPremium(reintentos-1), 4000);
    return;
  }
  pintarCuenta();
}

/* ── CUÁNDO APARECE LA PESTAÑA DEL FANTASY ───────────────────────────────
   Decía: solo si hay una fecha publicada, porque sin fecha no hay nada que
   armar. Era cierto cuando adentro solo se armaba un equipo, y dejó de
   serlo sin que nadie lo notara: ahí adentro ahora están los torneos de
   amigos, las zonas y los puntos de la fecha pasada, y todo eso vive
   JUSTAMENTE entre una fecha y la siguiente.

   Con la regla vieja, el lunes —cuando la gente quiere ver cuánto sacó y
   cómo quedó la tabla— la pestaña no existía. Un torneo al que solo se
   puede entrar mientras hay una fecha abierta es un torneo que nadie
   sigue.

   La regla nueva: hay fecha, o hay backend (y entonces hay algo tuyo que
   mostrar). Sin ninguna de las dos sigue escondida, que es lo correcto:
   una pestaña vacía es una promesa incumplida.                          */
if(window.FECHA || conBackend) $("btfantasy").hidden = false;

arrancarCuenta();
</script>
