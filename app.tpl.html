<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talleres · Armá el 11</title>
<style>
*{box-sizing:border-box}
html{background:var(--fondo)}
body{margin:0;background:transparent;color:var(--tinta);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:80px}
#seña{position:fixed;inset:-12%;z-index:0;pointer-events:none;background:var(--seña);
  opacity:var(--seña-op);filter:blur(var(--seña-blur));transform:scale(1.15)}
/* Ocho píxeles pegados al borde, fijos: es lo único que sigue estando
   cuando hacés scroll, y no le saca ancho a ningún titular.            */
#filete{position:fixed;left:0;top:0;bottom:0;width:8px;z-index:3;pointer-events:none;
  background:var(--filete);box-shadow:inset -1px 0 0 rgba(0,0,0,.18)}
.envase{padding-left:22px}
#estrellas{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--estrellas) center top / cover no-repeat;opacity:var(--estrellas-op);filter:blur(2.5px)}
.envase{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 14px}

.cabeza{display:flex;align-items:center;gap:13px;padding:16px;margin:14px 0 12px;
  background:var(--hoja);border-radius:20px}
.mono{width:48px;height:48px;border-radius:15px;flex:none;background:var(--acento);
  color:var(--sobre-acento);display:grid;place-items:center;font-weight:800;font-size:22px;
  letter-spacing:-1px;box-shadow:0 6px 24px -8px var(--acento)}
.cabeza h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.5px}
.cabeza p{margin:2px 0 0;font-size:12px;color:var(--tinta-3)}
.tema{margin-left:auto;flex:none;width:38px;height:38px;border-radius:12px;cursor:pointer;
  border:1px solid var(--borde);background:transparent;color:var(--tinta-2);font-size:15px;
  display:grid;place-items:center}
.tema:hover{color:var(--tinta);border-color:var(--tinta-3)}

.filtros{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--borde);background:var(--hoja);color:var(--tinta-2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--tinta-3)}
.chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}

.tarjeta{background:var(--hoja);border:1px solid var(--borde);border-radius:18px;
  padding:15px 17px;margin-bottom:9px}
.meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tinta-3);
  margin-bottom:7px;flex-wrap:wrap}
.meta b{color:var(--tinta-2);font-weight:600}
.punto{width:7px;height:7px;border-radius:50%;flex:none}
.play{display:grid;place-items:center;width:19px;height:19px;border-radius:6px;
  background:#E4572E;color:#fff;font-size:9px;flex:none}
.tarjeta h2{margin:0;font-size:16.5px;line-height:1.4;font-weight:650;letter-spacing:-.2px}
.tarjeta h2 a{color:inherit;text-decoration:none}
.tarjeta h2 a:hover{color:var(--acento-txt)}
.bajada{margin:7px 0 0;font-size:13.5px;color:var(--tinta-2);line-height:1.5}
.tarjeta.grupo{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento),0 0 28px -14px var(--acento)}
.sello{background:var(--acento);color:var(--sobre-acento);font-size:10px;font-weight:800;
  letter-spacing:.6px;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.otras{margin-top:12px;padding-top:11px;border-top:1px solid var(--borde);display:grid;gap:8px;font-size:12.5px}
.otras a{color:var(--tinta-2);text-decoration:none;display:flex;gap:8px}
.otras b{color:var(--tinta-3);font-weight:600;flex:none}

/* ── JERARQUÍA ────────────────────────────────────────────────────────────
   Antes las treinta historias se veían exactamente igual: treinta renglones
   del mismo tamaño, uno abajo del otro, y el ojo no tenía dónde apoyarse.
   Ahora hay tres tamaños y se leen en ese orden:

     1. LA PRIMERA, con imagen grande. Una sola.
     2. LAS SIGUIENTES CUATRO, con miniatura al costado.
     3. EL RESTO, renglones compactos agrupados por día.

   La imagen es siempre opcional: si el medio no la declara, o si tarda, o
   si el servidor la borró, la tarjeta se ve bien igual. Nunca se reserva
   un hueco vacío esperándola.                                            */
.tarjeta.portada{padding:0;overflow:hidden}
.foto{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--borde)}
.portada .cuerpo{padding:15px 17px 16px}
.portada h2{font-size:21px;line-height:1.28;font-weight:750;letter-spacing:-.4px}
.portada .bajada{font-size:14px}

.fila{display:flex;gap:13px;align-items:flex-start}
.fila .txt{flex:1;min-width:0}
.mini-f{width:92px;height:92px;flex:none;border-radius:12px;object-fit:cover;background:var(--borde)}
.tarjeta.media h2{font-size:15.5px;line-height:1.35}

.compactas{background:var(--hoja);border:1px solid var(--borde);border-radius:18px;
  padding:4px 15px;margin-bottom:9px}
.linea{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-top:1px solid var(--borde)}
.compactas .linea:first-child{border-top:0}
.linea a{color:inherit;text-decoration:none;font-size:14px;line-height:1.4;font-weight:600}
.linea a:hover{color:var(--acento-txt)}
.linea .cuando{margin-left:auto;flex:none;font-size:11px;color:var(--tinta-3);white-space:nowrap}
.linea .de{display:block;font-size:11.5px;color:var(--tinta-3);font-weight:500;margin-top:3px}
.dia{margin:20px 2px 8px;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--tinta-3);font-weight:800}
.vid{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;
  background:#E4572E;color:#fff;font-size:8px;flex:none;transform:translateY(2px)}
.vacio{text-align:center;padding:44px 20px;color:var(--tinta-3);font-size:14px}

/* ── LA CUENTA ────────────────────────────────────────────────────────────
   Chica y arriba de todo, porque no es el motivo por el que alguien abre la
   app: el feed sí. Sin backend configurado no existe: el botón queda oculto
   y nadie se entera de que había algo que configurar.                     */
#cuenta{background:var(--hoja);border:1px solid var(--borde);border-radius:16px;
  padding:14px 16px;margin-bottom:12px}
#cuenta h4{margin:0 0 4px;font-size:15px;font-weight:700}
#cuenta p{margin:0 0 11px;font-size:13px;color:var(--tinta-2);line-height:1.5}
#cuenta .par{display:flex;gap:8px}
#cuenta input{flex:1}
#cuenta .aviso{margin:10px 0 0;font-size:12.5px}
#cuenta .aviso.mal{color:#D14343}
.boton{border:0;border-radius:11px;padding:9px 15px;font:inherit;font-size:14px;
  font-weight:700;cursor:pointer;background:var(--acento);color:var(--sobre-acento);flex:none}
.boton.flaco{background:transparent;color:var(--tinta-2);border:1px solid var(--borde)}
.pie{padding:22px 6px 10px;font-size:11px;color:var(--tinta-3);line-height:1.6;text-align:center}


/* ── FANTASY ──────────────────────────────────────────────────────────────
   La barra del presupuesto va arriba de todo y se mira antes de cada toque:
   armar el equipo ES gastar la plata. Por eso el número que queda está en
   grande y se pone rojo apenas te pasás, sin esperar a que guardes.      */
.fcab{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--hoja);border:1px solid var(--borde);border-radius:16px;
  padding:12px 16px;margin-bottom:10px}
.fcab b{font-size:16px;font-weight:700;display:block}
.fsub{display:block;font-size:11.5px;color:var(--tinta-3);margin-top:2px}
.fplata{text-align:right}
.fplata b{font-size:22px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fplata.mal b{color:#D14343}

.fcancha{padding:14px 15px}
.flin{padding:9px 0;border-top:1px solid var(--borde)}
.fcancha .flin:first-child{border-top:0;padding-top:2px}
.flab{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;
  color:var(--tinta-3);margin-bottom:7px;display:flex;gap:8px;align-items:baseline}
.flab .fsub{display:inline;text-transform:none;letter-spacing:0;font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:6px}

.ffi{display:inline-flex;align-items:center;gap:6px;background:var(--papel);
  border:1px solid var(--borde);border-radius:999px;padding:4px 4px 4px 8px;font-size:13px}
.ffi.cap{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento)}
.ffi.vice{border-color:var(--tinta-3)}
.fnom{font-weight:600;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpre{color:var(--tinta-3);font-variant-numeric:tabular-nums;font-size:12px}
.fcinta,.fquita{border:0;background:transparent;cursor:pointer;font:inherit;color:var(--tinta-3);
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.fcinta{background:var(--borde);color:var(--tinta-2)}
.ffi.cap .fcinta{background:var(--acento);color:var(--sobre-acento)}
.fquita:hover{color:#D14343}
.fhueco{border:1px dashed var(--borde-2,var(--tinta-3));background:transparent;color:var(--tinta-3);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.fhueco:hover{color:var(--acento-txt);border-color:var(--acento)}

.fprob{margin-top:12px;padding-top:11px;border-top:1px solid var(--borde);
  font-size:12.5px;color:#D14343;display:grid;gap:4px}
.fguardar{margin-top:13px;width:100%}
.fguardar:disabled{opacity:.45;cursor:default}


/* ── LA CANCHA ────────────────────────────────────────────────────────────
   Verde apenas insinuado y las líneas dibujadas con gradientes: nada de
   imágenes. Las filas van de arriba (delanteros) a abajo (arquero), como
   se mira una formación cuando alguien te la dibuja en una servilleta.  */
.fcancha2{position:relative;border-radius:14px;padding:14px 8px 10px;
  display:flex;flex-direction:column;gap:10px;
  background:
    linear-gradient(0deg,rgba(255,255,255,.10) 0 1px,transparent 1px 100%) center 50%/100% 50%,
    radial-gradient(circle at 50% 50%,transparent 0 44px,rgba(255,255,255,.10) 44px 45px,transparent 45px),
    linear-gradient(180deg,#166534,#14532D);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
:root[data-theme="oscuro"] .fcancha2, .oscuro .fcancha2{background:
    linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 100%) center 50%/100% 50%,
    radial-gradient(circle at 50% 50%,transparent 0 44px,rgba(255,255,255,.08) 44px 45px,transparent 45px),
    linear-gradient(180deg,#14532D,#0B3D22)}
.ffila{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}

.fjug{position:relative;width:66px;display:flex;flex-direction:column;align-items:center;gap:3px}
.fcam{width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;font:inherit;
  background:var(--acento);color:var(--sobre-acento);display:grid;place-items:center;
  font-size:12px;font-weight:800;line-height:1;position:relative;
  box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}
.fcam b{position:absolute;bottom:-5px;right:-5px;background:var(--papel);color:var(--tinta);
  border-radius:999px;font-size:9.5px;padding:1px 4px;font-weight:800;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.fjug.cap .fcam{box-shadow:0 0 0 2px #FFF,0 2px 8px -2px rgba(0,0,0,.5)}
.fjug.vice .fcam{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 2px 8px -2px rgba(0,0,0,.5)}
.fape{font-size:10.5px;font-weight:700;color:#fff;text-align:center;line-height:1.15;
  max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fsaca{position:absolute;top:-6px;right:6px;width:18px;height:18px;border-radius:50%;
  border:0;cursor:pointer;background:var(--papel);color:var(--tinta-2);
  font:inherit;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.fsaca:hover{color:#D14343}

.fvacio{width:66px;background:transparent;border:0;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit}
.fcirc{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1.5px dashed rgba(255,255,255,.55);color:rgba(255,255,255,.8);font-weight:800;font-size:15px}
.fetiq{font-size:9.5px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.4px}
.fvacio:hover .fcirc{border-color:#fff;color:#fff}
.ffor{padding-bottom:10px}

/* ── comunes ── */
h3.sec{margin:22px 2px 9px;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--tinta-3);font-weight:800}
label{display:block;font-size:12px;font-weight:700;color:var(--tinta-2);margin-bottom:5px}
select,input[type=text],input[type=password]{width:100%;padding:9px 11px;border-radius:11px;
  border:1px solid var(--borde);background:var(--papel);color:var(--tinta);font:inherit;font-size:14px}
button.acc{background:var(--acento);color:var(--sobre-acento);border:0;border-radius:12px;
  padding:11px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
button.acc:disabled{opacity:.45;cursor:default}
button.gh{background:transparent;color:var(--tinta-2);border:1px solid var(--borde);
  border-radius:12px;padding:10px 16px;font:inherit;font-weight:650;font-size:13.5px;cursor:pointer}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aviso{font-size:12.5px;color:var(--tinta-3);line-height:1.55;margin:8px 0 0}
.err{background:#FDECEA;color:#8B1A10;border-radius:11px;padding:10px 13px;font-size:13px;margin-top:10px}
.cargando{font-size:13px;color:var(--tinta-3);margin-top:10px}

/* ── juego ── */
.fx{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;
  font-size:13.5px;border:1px solid transparent}
.fx:hover{background:var(--papel)}
.fx[aria-selected="true"]{border-color:var(--acento);background:var(--papel)}
.fx .d{color:var(--tinta-3);font-size:11.5px;flex:none;width:62px;font-variant-numeric:tabular-nums}
.fx .lv{color:var(--tinta-3);font-size:11px;flex:none}
.campo{position:relative;width:100%;aspect-ratio:68/104;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#1B7A43 0%,#15693A 50%,#1B7A43 100%);
  border:1px solid var(--borde);touch-action:manipulation}
.campo::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 8.33%,transparent 8.33% 16.66%)}
.ln{position:absolute;border:2px solid rgba(255,255,255,.30);pointer-events:none}
.tsel{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:8px;vertical-align:middle}
.tsel .chip{font-size:11px;padding:3px 9px}
.jug{position:absolute;width:44px;text-align:center;cursor:pointer;z-index:2;
  --dx:0px; --dy:0px;
  transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
  transition:transform .12s, left .45s cubic-bezier(.22,.61,.36,1), top .45s cubic-bezier(.22,.61,.36,1)}
.jug:active{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.14)}
/* Durante el partido el desplazamiento acompaña al reloj, que va a 235ms. */
.campo.jugando .jug{transition:transform .24s linear}
.jug .b{width:27px;height:27px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  font-size:10px;font-weight:800;border:2px solid rgba(255,255,255,.9);
  box-shadow:0 2px 6px rgba(0,0,0,.45)}
.jug .n{font-size:8.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pelota{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;z-index:3;
  box-shadow:0 0 10px rgba(0,0,0,.6);transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.4,0,.3,1),top .5s cubic-bezier(.4,0,.3,1)}
.reloj{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);
  color:#fff;padding:5px 14px;border-radius:99px;font-size:12.5px;font-weight:800;z-index:4;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gol{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none;
  font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.8);
  opacity:0;transition:opacity .2s}
.gol.on{opacity:1}
.equipos{display:flex;justify-content:space-between;align-items:center;margin:9px 2px 0;font-size:12px}
.equipos .e{display:flex;align-items:center;gap:6px;color:var(--tinta-2);font-weight:650}
.equipos .pt{width:11px;height:11px;border-radius:50%;flex:none}
.picker{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.hoja2{background:var(--papel);border-radius:22px 22px 0 0;width:100%;max-height:72vh;overflow:auto;
  padding:16px 16px max(16px,env(safe-area-inset-bottom))}
.hoja2 h4{margin:0 0 4px;font-size:16px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 8px;border-radius:11px;cursor:pointer;
  border-bottom:1px solid var(--borde)}
.opt:hover{background:var(--acento-suave)}
.opt .v{margin-left:auto;font-weight:800;color:var(--acento-txt);font-variant-numeric:tabular-nums}
.opt .p{font-size:10px;font-weight:800;color:var(--tinta-3);border:1px solid var(--borde);
  border-radius:6px;padding:1px 5px}
.opt.enCancha{opacity:.45}
.perilla{margin-bottom:14px}
.ph{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.ph b{font-weight:700}
.pv{color:var(--acento-txt);font-weight:700;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acento)}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tinta-3)}
.res{display:flex;gap:2px;margin:12px 0 8px;border-radius:11px;overflow:hidden;height:42px}
.res div{display:grid;place-items:center;font-size:12.5px;font-weight:800;color:#fff}
.marcador{text-align:center;font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px}
.nota{font-size:12.5px;color:var(--tinta-2);line-height:1.55;margin:6px 0 0;padding-left:14px;
  border-left:2px solid var(--borde)}

/* ── números ── */
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -3px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tinta-3);
  padding:6px 7px;font-weight:800;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--borde);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
.it.yo{background:var(--acento-suave);border-radius:9px;font-weight:650}
tr.yo td{background:var(--acento-suave);font-weight:700}
tr.yo td:first-child{border-radius:9px 0 0 9px} tr.yo td:last-child{border-radius:0 9px 9px 0}
.forma{display:inline-flex;gap:2px}
.f{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font-size:9px;
  font-weight:800;color:#fff}
.fG{background:#12A150} .fE{background:#9AA3B0} .fP{background:#D64550}
.mini{display:grid;gap:7px}
.mini .it{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.mini .n{color:var(--tinta-3);font-size:11px;width:15px;flex:none;font-weight:700}
.mini .v{margin-left:auto;font-weight:700;color:var(--acento-txt);font-variant-numeric:tabular-nums}
.mini .sub{font-size:11px;color:var(--tinta-3)}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:520px){.dosc{grid-template-columns:1fr}}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:var(--hoja);border:1px solid var(--borde);border-radius:14px;padding:11px 8px;text-align:center}
.kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}

<body>

<script>
/*DATOS*/
/*JUEGO*/

/* ══ motor de color ══ */
const aRGB=h=>{h=h.replace("#","");if(h.length===3)h=[...h].map(c=>c+c).join("");
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const aHEX=([r,g,b])=>"#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(r)+.7152*f(g)+.0722*f(b);};
const CT=(a,b)=>{const x=lum(aRGB(a)),y=lum(aRGB(b));return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mezclar=(h,c,p)=>aHEX(aRGB(h).map((v,i)=>v*(1-p)+aRGB(c)[i]*p));
function aHSL([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return[0,0,l];const s=l>.5?d/(2-mx-mn):d/(mx+mn);
  const h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;return[h*60,s,l];}
function deHSL([h,s,l]){h=((h%360)+360)%360;if(!s){const v=Math.round(l*255);return[v,v,v];}
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return t.map(v=>Math.round((v+m)*255));}
function legible(hex,fondo,min=4.5){const osc=lum(aRGB(fondo))>.5;let[h,s,l]=aHSL(aRGB(hex));
  for(let i=0;i<70;i++){const c=aHEX(deHSL([h,s,l]));if(CT(c,fondo)>=min)return c;
    l+=osc?-.015:.015;if(l<=0||l>=1)break;}return osc?"#000000":"#FFFFFF";}
const tintaSobre=h=>CT("#101418",h)>=CT("#FFFFFF",h)?"#101418":"#FFFFFF";
const saturar=(h,k)=>{const[x,s,l]=aHSL(aRGB(h));return aHEX(deHSL([x,Math.min(1,s*k),l]));};
/* ── EL FILETE ────────────────────────────────────────────────────────────
   Una tira vertical de ocho píxeles NO puede mostrar el patrón a lo ancho:
   cae entera adentro de un solo bastón y todos los clubes de rayas quedan
   con un color plano, indistinguibles entre sí.

   Así que el filete traduce la camiseta a lo LARGO: los bastones bajan como
   segmentos, la franja son tres tramos, la banda una diagonal, la uve una
   cuña. No es la camiseta literal — es la camiseta leída en una tira, y
   alcanza para que ningún club se parezca al de al lado.

   El caso flojo es `liso`, que son ocho de los treinta: una camiseta sin
   patrón no tiene nada que traducir, así que se le pone el segundo color
   arriba como remate. Es poco, y es todo lo que hay.                    */
function fileteCSS(t,c1,c2){switch(t){
  /* 44 px y no 15: a lo alto de una pantalla, quince píxeles son cincuenta
     y seis segmentos y la tira se lee como una línea rayada, no como una
     camiseta. Con cuarenta y cuatro son unos diez y se leen como bandas.
     Pasados los sesenta ya parece un bloque de color con manchas.      */
  case "bastones": return `repeating-linear-gradient(180deg,${c1} 0 44px,${c2} 44px 88px)`;
  case "franja":   return `linear-gradient(180deg,${c1} 0 33%,${c2} 33% 67%,${c1} 67%)`;
  case "banda":    return `linear-gradient(165deg,${c1} 0 38%,${c2} 38% 60%,${c1} 60%)`;
  case "mitades":  return `linear-gradient(180deg,${c1} 0 50%,${c2} 50%)`;
  case "uve":      return `linear-gradient(180deg,${c1} 0 34%,${c2} 34% 48%,${c1} 48%)`;
  default:         return `linear-gradient(180deg,${c2} 0 14%,${c1} 14%)`;}}

function patronCSS(t,c1,c2){switch(t){
  case "bastones":return `repeating-linear-gradient(90deg,${c1} 0 6.5vw,${c2} 6.5vw 13vw)`;
  case "franja":  return `linear-gradient(180deg,${c1} 0 30%,${c2} 30% 62%,${c1} 62% 100%)`;
  case "banda":   return `linear-gradient(114deg,${c1} 0 30%,${c2} 30% 56%,${c1} 56% 100%)`;
  case "mitades": return `linear-gradient(100deg,${c1} 0 48%,${c2} 52% 100%)`;
  /* La uve no estaba: Vélez, el único club que la tiene, caía al patrón por
     defecto y se veía como cualquiera. Y en la planilla de aprobación estaba
     dibujada al revés —122/238 da una Λ, no una V—. Los ángulos correctos
     son 58 y 302: la punta va abajo, como en la camiseta.              */
  case "uve":     return `linear-gradient(58deg,transparent 0 36%,${c2} 36% 62%,transparent 62%) left/50% 100% no-repeat,`
                       + `linear-gradient(302deg,transparent 0 36%,${c2} 36% 62%,transparent 62%) right/50% 100% no-repeat,${c1}`;
  default:        return `radial-gradient(120% 90% at 50% 0%,${c2} 0%,${c1} 70%)`;}}
const ptsEstrella=(cx,cy,r)=>{const p=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.42:r;
    p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(" ");};
/* Cuántas se DIBUJAN, que no es lo mismo que cuántas tiene.
   Boca lleva 74 títulos y en el escudo de la camiseta pone 50: ni el club
   las muestra todas. Pasada la docena dejan de leerse como estrellas y
   quedan como manchas, así que el fondo muestra unas cuantas y el número
   verdadero se guarda aparte para escribirlo donde corresponda.          */
const TOPE_ESTRELLAS = 12;
function estrellasFondo(n,color){ if(!n)return "none";
  n = Math.min(n, TOPE_ESTRELLAS);
  const W=1000,H=620,porFila=n<=6?n:14,filas=Math.ceil(n/porFila);
  const tam=n<=3?30:n<=8?26:Math.max(11,26-n*.24); let g="",hechas=0;
  for(let f=0;f<filas&&hechas<n;f++){const enFila=Math.min(porFila,n-hechas),R=560+f*78;
    const arco=Math.min(1.5,.16*enFila);
    for(let k=0;k<enFila;k++,hechas++){const t=enFila===1?0:-arco/2+(arco*k)/(enFila-1);
      g+=`<polygon points='${ptsEstrella(W/2+R*Math.sin(t),700-R*Math.cos(t),tam)}'/>`;}}
  return `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'><g fill='${color}'>${g}</g></svg>`)}")`;}
function hojaMinima(lav,tin,pA,pB,min=4.5){
  for(let b=.45;b<=1.001;b+=.03){let peor=Infinity;
    for(const f of lav) for(const pp of [pA,pB]){const eff=mezclar(f,pp,b);
      for(const t of tin) peor=Math.min(peor,CT(t,eff));}
    if(peor>=min)return Math.min(1,b);} return 1;}

const TEMAS={
  claro:{fondo:"#F4F6F9",papel:"#FFFFFF",tinta:"#0D1117",tinta2:"#39424F",tinta3:"#57606E",
         borde:"#DDE3EC",barra:"rgba(255,255,255,.86)"},
  oscuro:{fondo:"#08090C",papel:"#12161D",tinta:"#F2F5FA",tinta2:"#A4AEBE",tinta3:"#8B95A6",
         borde:"#232A35",barra:"rgba(12,15,20,.86)"}};
const CLUB=window.CLUB, OP=.78;
const prefiere=window.matchMedia("(prefers-color-scheme: dark)");
let tema="auto";
const temaReal=()=>tema==="auto"?(prefiere.matches?"oscuro":"claro"):tema;

function pintarColores(){
  const T=TEMAS[temaReal()],fondo=T.fondo,r=document.documentElement.style,osc=temaReal()==="oscuro";
  r.setProperty("--fondo",fondo); r.setProperty("--tinta",T.tinta);
  r.setProperty("--tinta-2",T.tinta2); r.setProperty("--tinta-3",T.tinta3);
  r.setProperty("--borde",T.borde); r.setProperty("--barra",T.barra);
  r.setProperty("--acento",CLUB.color); r.setProperty("--sobre-acento",tintaSobre(CLUB.color));
  r.setProperty("--acento-txt",legible(CLUB.color,fondo));
  r.setProperty("--acento-suave",mezclar(CLUB.color,fondo,.88));
  const c1=saturar(CLUB.color,1.5), c2=saturar(CLUB.color2,1.5);
  const cE=CT(CLUB.color2,fondo)>=CT(CLUB.color,fondo)?c2:c1;
  const satDe=h=>aHSL(aRGB(h))[1];
  const tinte=satDe(c1)>=.25?c1:c2, tinte2=tinte===c1?c2:c1;
  const tintas=[T.tinta,T.tinta2,T.tinta3];
  let pA=T.papel,pB=T.papel;
  for(let k=(osc?.22:.18);k>=0;k-=.02){
    pA=mezclar(T.papel,tinte,k); pB=mezclar(T.papel,tinte2,k*.45);
    if(Math.min(...[pA,pB].flatMap(p=>tintas.map(t=>CT(t,p))))>=6.2) break;}
  const lavados=[c1,c2,cE].map(c=>mezclar(fondo,c,OP));
  const beta=hojaMinima(lavados,tintas,pA,pB);
  const rgba=(h,a)=>{const[x,y,z]=aRGB(h);return `rgba(${x},${y},${z},${a})`;};
  r.setProperty("--seña",patronCSS(CLUB.patron,c1,c2));
  r.setProperty("--filete",fileteCSS(CLUB.patron,CLUB.color,CLUB.color2||"#FFFFFF"));
  /* El lavado de pantalla completa y las estrellas se apagan: la seña del
     club pasó a ser el filete. Los dos siguen acá y vuelven cambiando estos
     dos ceros por OP y OP*.5 — no se borró nada, se bajó a cero.       */
  r.setProperty("--seña-op",0);
  r.setProperty("--seña-blur",(CLUB.patron==="bastones"?18:60)+"px");
  r.setProperty("--estrellas",estrellasFondo(CLUB.estrellas,cE));
  r.setProperty("--estrellas-op",0);
  r.setProperty("--hoja",patronCSS(CLUB.patron,rgba(pA,beta),rgba(pB,beta)));
  r.setProperty("--papel",pA);
  document.getElementById("btema").textContent=osc?"☀":"☾";
}

/* ══ utilidades ══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hace=h=>h<1?"recién":h<24?Math.round(h)+" h":Math.round(h/24)===1?"ayer":Math.round(h/24)+" días";
const F=window.FEED, ST=window.STATS;
let tab="feed";

/* ══════════════════ FEED ══════════════════ */
const COLOR={oficial:"#3B82F6",hinchas:"#E4572E",periodista:"#7B4FD4",analista:"#0E8F6E",medio:"#8B94A3"};
/* Las secciones salen de las etiquetas que pone el propio club, así que
   filtrar por "femenino" o "reserva" no cuesta ni un análisis de texto. */
const FILTROS=[
 {id:"todo",nom:"Todo",ok:()=>true},
 {id:"juntas",nom:"⧉ Lo que repiten varios",ok:c=>c.nFuentes>1},
 {id:"primera",nom:"Primera",ok:c=>c.principal.seccion==="primera"},
 {id:"femenino",nom:"Femenino",ok:c=>c.principal.seccion==="femenino"},
 {id:"reserva",nom:"Reserva y juveniles",ok:c=>c.principal.seccion==="reserva"},
 {id:"video",nom:"Videos",ok:c=>c.principal.tipo==="video"},
 {id:"hinchas",nom:"De hinchas",ok:c=>c.principal.fuenteTipo==="hinchas"},
 {id:"oficial",nom:"Oficial",ok:c=>c.principal.fuenteTipo==="oficial"}];
let filtro="todo";
/* null = todavía no eligió: se arranca en la tabla donde está su equipo. */
let tablaSel=null;
/* ── LAS MINIATURAS ───────────────────────────────────────────────────────
   Las imágenes NO se alojan: se enlazan al servidor del medio, que es lo
   mismo que hace WhatsApp cuando pegás un link. Por eso el sitio no pesa
   ni un byte más; lo que se gasta son los datos de quien mira, y solo de
   lo que llega a ver, porque van con carga diferida.

   `sitio.json` manda: "todas" (videos y notas), "videos" (solo la miniatura
   de YouTube, que pesa 20 kB y no tiene fotos ajenas adentro) o "ninguna".
   Está afuera del código para que se pueda cambiar de opinión sin tocarlo. */
const minis=()=>(window.SITIO&&window.SITIO.miniaturas)||"todas";
const fotoDe=p=>{
  const m=minis();
  if(m==="ninguna") return null;
  if(m==="videos" && p.tipo!=="video") return null;
  return /^https:\/\//.test(p.imagen||"") ? p.imagen : null;
};
/* Si la imagen no carga —el medio la borró, cambió de dirección, o su
   servidor está caído— se saca del todo. Un cuadrado roto es peor que
   ninguna imagen.                                                       */
const IMG=(url,clase)=>`<img class="${clase}" src="${esc(url)}" alt="" loading="lazy"
  decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`;

const cabecera=(c,p,g)=>`<div class="meta">${p.tipo==="video"?'<span class="play">▶</span>'
  :`<span class="punto" style="background:${COLOR[p.fuenteTipo]||COLOR.medio}"></span>`}
  <b>${esc(p.fuente)}</b><span>·</span><span>${hace(c.horas)}</span>
  ${g?`<span class="sello">⧉ ${c.nFuentes} fuentes</span>`:""}</div>`;

const otrasHTML=c=>c.nFuentes>1?`<div class="otras">${c.tambien.map(t=>
  `<a href="${esc(t.url)}" target="_blank" rel="noopener"><b>${esc(t.fuente)}</b>${esc(t.titulo)}</a>`
  ).join("")}</div>`:"";

/* 1. la primera, con la imagen grande */
const portada=c=>{const p=c.principal,g=c.nFuentes>1,f=fotoDe(p);return `
  <article class="tarjeta portada${g?" grupo":""}">
    ${f?IMG(f,"foto"):""}
    <div class="cuerpo">
      ${cabecera(c,p,g)}
      <h2><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.titulo)}</a></h2>
      ${p.resumen?`<p class="bajada">${esc(p.resumen.slice(0,180))}</p>`:""}
      ${otrasHTML(c)}
    </div>
  </article>`;};

/* 2. las cuatro siguientes, con miniatura al costado */
const media=c=>{const p=c.principal,g=c.nFuentes>1,f=fotoDe(p);return `
  <article class="tarjeta media${g?" grupo":""}">
    <div class="fila">
      <div class="txt">
        ${cabecera(c,p,g)}
        <h2><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.titulo)}</a></h2>
      </div>
      ${f?IMG(f,"mini-f"):""}
    </div>
    ${otrasHTML(c)}
  </article>`;};

/* 3. el resto, en renglones */
const linea=c=>{const p=c.principal;return `
  <div class="linea">
    ${p.tipo==="video"?'<span class="vid">▶</span>'
      :`<span class="punto" style="background:${COLOR[p.fuenteTipo]||COLOR.medio}"></span>`}
    <div style="min-width:0">
      <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.titulo)}</a>
      <span class="de">${esc(p.fuente)}${c.nFuentes>1?" ⧉"+c.nFuentes:""}</span>
    </div>
    <span class="cuando">${esc(hora(p.fecha) || hace(c.horas))}</span>
  </div>`;};

/* En los renglones el día ya lo dice el título del grupo, así que repetir
   "hace 5 días" en cada uno es ruido. Va la hora, que sí agrega algo: dice
   en qué orden pasaron las cosas de ese día.                             */
const hora=iso=>{ if(!iso) return "";
  const d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); };

/* El día de una historia, en las palabras que usaría un hincha. */
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function diaDe(iso){
  if(!iso) return "Antes";
  const d=new Date(iso), h=new Date();
  const solo=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const dif=Math.round((solo(h)-solo(d))/864e5);
  if(dif<=0) return "Hoy";
  if(dif===1) return "Ayer";
  if(dif<7)   return DIAS[d.getDay()].replace(/^./,m=>m.toUpperCase());
  return d.toLocaleDateString("es-AR",{day:"numeric",month:"long"});
}

function vistaFeed(){
  const f=FILTROS.find(x=>x.id===filtro), l=F.clusters.filter(f.ok);
  const utiles=FILTROS.filter(x=>x.id===filtro||F.clusters.some(x.ok));
  const chips=`<nav class="filtros">${utiles.map(x=>
    `<button class="chip" data-f="${x.id}" aria-pressed="${x.id===filtro}">${x.nom}</button>`).join("")}</nav>`;
  if(!l.length) return chips+`<div class="vacio">Nada acá todavía.</div>`;

  let out=chips+portada(l[0])+l.slice(1,5).map(media).join("");

  /* El resto va agrupado por día: sin eso son cuarenta renglones iguales
     y no se sabe si lo de abajo es de anoche o de la semana pasada.     */
  const resto=l.slice(5);
  let dia=null, abierta=false;
  for(const c of resto){
    const d=diaDe(c.principal.fecha);
    if(d!==dia){ if(abierta) out+="</div>"; out+=`<h3 class="dia">${esc(d)}</h3><div class="compactas">`;
                 dia=d; abierta=true; }
    out+=linea(c);
  }
  if(abierta) out+="</div>";
  return out;
}


/* ══════════════════ FANTASY ══════════════════
   La pantalla de armar el equipo. Los datos entran por `window.FECHA`, que
   publica la corrida: número de fecha, cuándo cierra y la lista de jugadores
   con su precio. Sin fecha publicada, la pestaña no aparece — la misma regla
   de siempre: lo que no está listo no se muestra prometiendo.

   El reglamento no está acá: está en fantasy.js, que es el mismo archivo que
   usa el servidor para calcular los puntos. Una sola tabla de puntos, una
   sola idea de qué equipo es legal. Si la pantalla dejara pasar algo que el
   servidor rechaza, el error aparecería recién el lunes.                  */

const FCH = window.FECHA || null;
/* Ojo con esta línea: `fantasy.js` solo se carga si hay una fecha publicada,
   así que sin fecha `FORMACION_POR_DEFECTO` NO EXISTE. Escrito sin el
   `typeof`, esto tiraba un ReferenceError al evaluar el script y se caía la
   app ENTERA —feed incluido— en el único caso que hoy es el normal. Lo
   agarró la prueba del sitio, no yo. */
const FORM_DEF = (typeof FORMACION_POR_DEFECTO !== "undefined")
  ? FORMACION_POR_DEFECTO : "4-3-3";
let F11 = { titulares:[], suplentes:{}, capitan:null, vice:null, formacion: FORM_DEF };
let fFiltro = "todos", fBusca = "", fGuardando = false, fAviso = "";

const precioMapa = () => new Map((FCH?.jugadores||[]).map(j=>[j.id, j.precio]));
const gastoDe = e => [...e.titulares, ...Object.values(e.suplentes)]
  .reduce((s,j)=>s + (j.precio||0), 0);
const enEquipo = id => F11.titulares.some(j=>j.id===id) ||
  Object.values(F11.suplentes).some(j=>j.id===id);

const PUESTO_NOM = { G:"Arqueros", D:"Defensores", M:"Medios", F:"Delanteros" };
/* El singular va escrito, no recortado del plural: sacarle dos letras a
   "Medios" da "Medi" y a "Delanteros", "Delanter". El castellano no se
   pluraliza con una regla que sirva para los cuatro. */
const PUESTO_UNO = { G:"arquero", D:"defensor", M:"medio", F:"delantero" };

/* Cuánto falta para el cierre, dicho como lo diría una persona. */
function faltaPara(iso){
  const ms = new Date(iso) - new Date();
  if(isNaN(ms)) return "";
  if(ms <= 0) return "cerrada";
  const h = Math.floor(ms/36e5), d = Math.floor(h/24);
  if(d >= 1) return "cierra en " + d + (d===1?" día":" días");
  if(h >= 1) return "cierra en " + h + (h===1?" hora":" horas");
  return "cierra en " + Math.max(1, Math.floor(ms/6e4)) + " minutos";
}
const cerrada = () => FCH && new Date(FCH.cierra) <= new Date();

function vistaFantasy(){
  if(!FCH) return `<div class="vacio">Todavía no hay fecha abierta.<br>
    Cuando se publique la próxima, aparece acá.</div>`;

  const gasto = gastoDe(F11), pres = FCH.presupuesto || 75;
  const fichas = F11.titulares.length + Object.keys(F11.suplentes).length;
  const resto = Math.round((pres - gasto)*10)/10;

  /* La barra del presupuesto: lo primero que se mira y lo que decide cada
     toque. Va arriba y pegada, porque se consulta en cada elección. */
  const cab = `<div class="fcab">
      <div><b>Fecha ${FCH.numero}</b><span class="fsub">${esc(FCH.torneo||"")} · ${
        cerrada()?"cerrada":esc(faltaPara(FCH.cierra))}</span></div>
      <div class="fplata ${resto<0?"mal":""}">
        <b>${resto}</b><span class="fsub">de ${pres} · ${fichas}/15</span></div>
    </div>`;

  /* La formación primero: es la decisión que ordena todas las demás.
     Cambiarla no borra el equipo — los que sobran de una línea vuelven a
     la lista, y se avisa cuáles. */
  const chipsForm = `<nav class="filtros ffor">${Object.keys(FORMACIONES).map(f=>
    `<button class="chip" data-form="${f}" aria-pressed="${f===F11.formacion}">${f}</button>`
    ).join("")}</nav>`;

  /* La cancha. Cada línea es una fila, y los lugares vacíos son botones:
     tocarlos filtra la lista de abajo por ese puesto. Ver el equipo
     acomodado es la diferencia entre elegir jugadores y armar un equipo. */
  const cupo = cupoDe(F11.formacion);
  const fila = p => {
    const tit = F11.titulares.filter(j=>j.puesto===p);
    const huecos = Math.max(0, cupo[p] - tit.length);
    return `<div class="ffila">
      ${tit.map(j=>puesto(j)).join("")}
      ${Array.from({length:huecos},()=>
        `<button class="fvacio" data-puesto="${p}"><span class="fcirc">+</span>
          <span class="fetiq">${PUESTO_UNO[p]}</span></button>`).join("")}
    </div>`;
  };
  const cancha = `<div class="fcancha2">
      ${["F","M","D","G"].map(fila).join("")}
    </div>`;

  const banco = `<div class="flin"><div class="flab">Suplentes
      <span class="fsub">uno por puesto</span></div>
    <div class="fchips">${["G","D","M","F"].map(p=>{
      const j = F11.suplentes[p];
      return j ? ficha(j,true) : `<button class="fhueco" data-banco="${p}">${p}</button>`;
    }).join("")}</div></div>`;

  /* La revisión es la misma que corre en el servidor. */
  const rev = revisarEquipo(
    { titulares:F11.titulares, suplentes:F11.suplentes, capitan:F11.capitan,
      vice:F11.vice, formacion:F11.formacion },
    precioMapa());
  const listo = rev.ok && !cerrada();

  const problemas = fichas>0 && rev.problemas.length
    ? `<div class="fprob">${rev.problemas.slice(0,3).map(p=>`<div>${esc(p)}</div>`).join("")}</div>` : "";

  const guardar = `<button class="boton fguardar" id="fguardar" ${listo?"":"disabled"}>${
    cerrada() ? "La fecha ya cerró" : fGuardando ? "Guardando…" : "Guardar mi equipo"}</button>
    ${fAviso?`<p class="aviso${/^Listo/.test(fAviso)?"":" mal"}">${esc(fAviso)}</p>`:""}`;

  return cab + chipsForm + `<div class="tarjeta fcancha">
      ${cancha}
      ${banco}
      ${problemas}
      ${guardar}
    </div>` + listado();
}

/* Un jugador parado en la cancha. El apellido abajo, el precio al lado, y
   la cinta arriba a la izquierda para marcarlo capitán o vice. */
function puesto(j){
  const cap = F11.capitan===j.id, vice = F11.vice===j.id;
  return `<div class="fjug${cap?" cap":vice?" vice":""}">
    <button class="fcam" data-cinta="${j.id}" title="Capitán / vice">
      ${cap?"C":vice?"V":""}<b>${j.precio}</b></button>
    <span class="fape">${esc(apellido(j.nombre))}</span>
    <button class="fsaca" data-quita="${j.id}" aria-label="Sacar">×</button>
  </div>`;
}
/* Una ficha de jugador ya elegido. El capitán y el vice se marcan tocando
   la letra: dos toques y no una pantalla aparte. */
function ficha(j, esBanco){
  const cap = F11.capitan===j.id, vice = F11.vice===j.id;
  return `<span class="ffi${cap?" cap":vice?" vice":""}">
    ${esBanco?"":`<button class="fcinta" data-cinta="${j.id}" title="Capitán / vice">${
      cap?"C":vice?"V":"·"}</button>`}
    <span class="fnom">${esc(j.nombre)}</span>
    <span class="fpre">${j.precio}</span>
    <button class="fquita" data-quita="${j.id}" aria-label="Sacar">×</button></span>`;
}

/* La lista de donde se elige. Ordenada por precio: el que arma un equipo
   mira primero cuánto sale, no el apellido. */
function listado(){
  const q = fBusca.trim().toLowerCase();
  let l = (FCH.jugadores||[]).filter(j=>!enEquipo(j.id));
  if(fFiltro!=="todos") l = l.filter(j=>j.puesto===fFiltro);
  if(q) l = l.filter(j=>(j.nombre+" "+j.club).toLowerCase().includes(q));
  l = l.sort((a,b)=> b.precio-a.precio || b.ppp-a.ppp).slice(0,60);

  const chips = ["todos","G","D","M","F"].map(x=>
    `<button class="chip" data-fp="${x}" aria-pressed="${x===fFiltro}">${
      x==="todos"?"Todos":PUESTO_NOM[x]}</button>`).join("");

  return `<h3 class="sec">Elegí jugadores</h3>
    <nav class="filtros">${chips}</nav>
    <div class="par" style="margin-bottom:10px">
      <input type="text" id="fbusca" placeholder="Buscar por nombre o club" value="${esc(fBusca)}"></div>
    <div class="compactas">${l.length?l.map(j=>`
      <div class="linea">
        <div style="min-width:0">
          <a href="#" data-suma="${j.id}">${esc(j.nombre)}</a>
          <span class="de">${esc(j.club)} · ${PUESTO_UNO[j.puesto]}${
            j.pj?" · "+j.ppp+" por partido":""}</span>
        </div>
        <span class="cuando">${j.precio}</span>
      </div>`).join(""):`<div class="vacio">Nadie con ese nombre.</div>`}</div>`;
}

function engancharFantasy(){
  const v = $("vista");
  v.querySelectorAll("[data-form]").forEach(b=>b.onclick=()=>cambiarFormacion(b.dataset.form));
  v.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{ fFiltro=b.dataset.fp; pintar(); });
  v.querySelectorAll("[data-puesto]").forEach(b=>b.onclick=()=>{ fFiltro=b.dataset.puesto; pintar(); });
  v.querySelectorAll("[data-banco]").forEach(b=>b.onclick=()=>{ fFiltro=b.dataset.banco; pintar(); });
  v.querySelectorAll("[data-suma]").forEach(a=>a.onclick=e=>{ e.preventDefault(); sumar(+a.dataset.suma); });
  v.querySelectorAll("[data-quita]").forEach(b=>b.onclick=()=>quitar(+b.dataset.quita));
  v.querySelectorAll("[data-cinta]").forEach(b=>b.onclick=()=>cinta(+b.dataset.cinta));
  const bu = $("fbusca");
  if(bu) bu.oninput = () => { fBusca = bu.value; const p = bu.selectionStart;
    pintar(); const n = $("fbusca"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const g = $("fguardar"); if(g) g.onclick = guardarFantasy;
}

/* Cambiar de formación no puede borrar el equipo: eso castiga por probar.
   Los que sobran de una línea salen —los últimos que entraron, y los más
   caros primero— y se avisa quiénes, para que nadie descubra el domingo
   que le falta un delantero. */
function cambiarFormacion(f){
  if(!FORMACIONES[f] || f===F11.formacion) return;
  F11.formacion = f;
  const cupo = cupoDe(f), sacados = [];
  for(const p of ["G","D","M","F"]){
    const enLinea = F11.titulares.filter(x=>x.puesto===p);
    const sobran = enLinea.length - cupo[p];
    if(sobran > 0){
      const fuera = enLinea.slice().sort((a,b)=>b.precio-a.precio).slice(0, sobran);
      for(const x of fuera){
        F11.titulares = F11.titulares.filter(y=>y.id!==x.id);
        sacados.push(apellido(x.nombre));
        if(F11.capitan===x.id) F11.capitan = F11.titulares[0]?.id || null;
        if(F11.vice===x.id)    F11.vice = null;
      }
    }
  }
  fAviso = sacados.length
    ? "En " + f + " no entran: " + sacados.join(", ") + ". Volvieron a la lista."
    : "";
  pintar();
}

/* Sumar un jugador: primero al once si hay lugar en su línea; si no, al
   banco. Que el usuario no tenga que decidir "titular o suplente" en cada
   toque es la diferencia entre armar un equipo y llenar un formulario. */
function sumar(id){
  const j = (FCH.jugadores||[]).find(x=>x.id===id); if(!j || enEquipo(id)) return;
  const p = j.puesto, max = cupoDe(F11.formacion)[p];
  const enLinea = F11.titulares.filter(x=>x.puesto===p).length;
  if(enLinea < max && F11.titulares.length < 11) F11.titulares.push(j);
  else if(!F11.suplentes[p]) F11.suplentes[p] = j;
  else { fAviso = "No queda lugar de " + PUESTO_UNO[p] + "."; pintar(); return; }
  if(!F11.capitan && F11.titulares.some(x=>x.id===id)) F11.capitan = id;
  fAviso = ""; pintar();
}

function quitar(id){
  F11.titulares = F11.titulares.filter(j=>j.id!==id);
  for(const p of ["G","D","M","F"]) if(F11.suplentes[p]?.id===id) delete F11.suplentes[p];
  if(F11.capitan===id) F11.capitan = F11.titulares[0]?.id || null;
  if(F11.vice===id)    F11.vice = null;
  fAviso=""; pintar();
}

/* Un botón, tres estados: nada → capitán → vice → nada. */
function cinta(id){
  if(F11.capitan===id){ F11.capitan=null; F11.vice=id; }
  else if(F11.vice===id){ F11.vice=null; }
  else { if(F11.vice===id) F11.vice=null; F11.capitan=id; }
  if(F11.capitan===F11.vice) F11.vice=null;
  pintar();
}

async function guardarFantasy(){
  if(typeof hayBackend!=="function" || !hayBackend()){
    fAviso = "Falta configurar el backend."; return pintar();
  }
  if(!quienSoy()){
    fAviso = "Entrá con tu mail primero, así el equipo queda guardado.";
    cuentaAbierta = true; pintarCuenta(); return pintar();
  }
  fGuardando = true; fAviso = ""; pintar();
  try{
    await guardarEquipo(FCH.numero, {
      titulares: F11.titulares.map(j=>j.id),
      suplentes: ["G","D","M","F"].map(p=>F11.suplentes[p].id),
      capitan: F11.capitan, vice: F11.vice || F11.capitan,
      gasto: gastoDe(F11), formacion: F11.formacion,
    });
    fAviso = "Listo, tu equipo quedó guardado.";
  }catch(e){ fAviso = e.message; }
  fGuardando = false; pintar();
}

/* ── LA API, SIN API ────────────────────────────────────────────────────
   El juego pide cuatro cosas a API-Football: fixtures, jugadores por
   partido, formaciones y eventos. Cuando el sitio está publicado, esas
   cuatro respuestas ya vienen bajadas y guardadas: la key vive como
   secreto del repositorio y el navegador nunca la ve ni la necesita.

   No se reescribió nada del juego. Se interceptó el pedido, que es lo
   único que tocaba la red. La clave del cache es la misma URL relativa,
   así que lo que guardó el build es exactamente lo que pide la pantalla.
   Si algo no está en el cache y hay key, sale a buscarlo como siempre. */
async function api(path, params={}){
  const clave=path+(Object.keys(params).length?"?"+new URLSearchParams(params):"");
  if(window.CACHE && clave in window.CACHE) return window.CACHE[clave];
  if(!J.key) throw new Error("Por ahora están cargados el próximo partido y el último jugado.");
  const url=BASE+clave;
  const r=await fetch(url,{headers:{"x-apisports-key":J.key}});
  J.reqs++;
  const j=await r.json();
  if(j.errors&&Object.keys(j.errors).length&&!Array.isArray(j.errors))
    throw new Error(Object.values(j.errors).join(" · "));
  return j.response||[];
}

async function plantel(fids, teamId){
  const map=new Map();
  for(const fid of fids){
    let resp; try{ resp=await api("/fixtures/players",{fixture:fid}); }catch(e){ continue; }
    (resp||[]).forEach(eq=>{
      if(eq.team.id!==teamId) return;
      (eq.players||[]).forEach(j=>{
        const st=j.statistics?.[0]||{}, g=st.games||{};
        if(!g.minutes) return;
        const id=j.player.id;
        if(!map.has(id)) map.set(id,{id,nombre:j.player.name,pos:g.position?.[0]||"M",ratings:[],mins:0,apar:0});
        const p=map.get(id);
        if(g.rating) p.ratings.push(parseFloat(g.rating));
        p.mins+=g.minutes||0; p.apar++;
      });
    });
  }
  return [...map.values()].sort((a,b)=>fuerza(b).v-fuerza(a).v);
}

const JUGADO = f => ["FT","AET","PEN"].includes(f.fixture.status.short);

/* ── EL PLANTEL DE VERDAD ────────────────────────────────────────────────
   Armar el plantel con los que sumaron minutos en los últimos partidos tiene
   dos defectos que se ven a simple vista: falta el que estuvo lesionado o el
   que acaba de llegar, y el puesto que le queda es el que jugó ese día, no
   el suyo. Un lateral que tapó un hueco en el medio quedaba de volante.

   API-Football tiene la lista oficial del plantel con el puesto de cada uno.
   Es UN pedido por equipo. Eso manda para el puesto; los partidos siguen
   mandando para el nivel, que es lo que el modelo necesita.

   Si el pedido falla o viene raro, no pasa nada: se sigue con lo de antes. */
const PUESTO = { Goalkeeper:"G", Defender:"D", Midfielder:"M", Attacker:"F" };

async function plantilla(teamId){
  try{
    const r = await api("/players/squads",{team:teamId});
    const eq = (r||[]).find(x=>x.team?.id===teamId) || (r||[])[0];
    return (eq?.players||[])
      .map(p=>({ id:p.id, nombre:p.name, pos:PUESTO[p.position] }))
      .filter(p=>p.id && p.pos);
  }catch(e){ return []; }
}

function fusionar(pool, lista){
  if(!lista.length) return pool;
  const porId = new Map(pool.map(p=>[p.id, p]));
  for(const s of lista){
    const p = porId.get(s.id);
    if(p) p.pos = s.pos;      // el puesto oficial le gana al del último partido
    else porId.set(s.id, { id:s.id, nombre:s.nombre, pos:s.pos,
                           ratings:[], mins:0, apar:0 });
  }
  return [...porId.values()].sort((a,b)=>fuerza(b).v-fuerza(a).v);
}

async function cargarTemporada(){
  J.err=""; J.msg="Cargando la temporada…"; pintar();
  try{
    const fx=await api("/fixtures",{team:J.id.A,season:J.temporada,league:LEAGUE});
    /* Antes solo traía los terminados y eso convertía el juego en un museo.
       El gancho es simular el partido del domingo, no el de mayo.        */
    J.fixtures=fx.filter(f=>JUGADO(f) || f.fixture.status.short==="NS")
                 .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date));
    /* Con los datos ya bajados no están los treinta partidos de la temporada:
       están el próximo y el último jugado, que son los dos que se juegan. Se
       ofrecen solo esos, en vez de ofrecer todos y fallar al elegir. */
    if(window.CACHE?.__jugables)
      J.fixtures=J.fixtures.filter(f=>window.CACHE.__jugables.includes(f.fixture.id));
    if(!J.fixtures.length) throw new Error("No hay partidos en "+J.temporada+".");
    J.proximo=J.fixtures.find(f=>!JUGADO(f));
    J.msg=J.fixtures.filter(JUGADO).length+" jugados · "+
          J.fixtures.filter(f=>!JUGADO(f)).length+" por venir · "+J.reqs+" pedidos";
    J.paso="fixture";
    const guardado = leerPronostico();
    if(guardado && guardado.c === CLUB.id && guardado.t === J.temporada){
      pintar(); return restaurar(guardado);
    }
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* Reconstruye un pronóstico guardado: busca el partido, arma los planteles
   igual que siempre y vuelve a poner los mismos jugadores en los mismos
   puestos. Si el partido ya se jugó, ofrece revelar de una.              */
async function restaurar(g){
  const i = J.fixtures.findIndex(f => f.fixture.id === g.f);
  if(i < 0){ J.err = "El pronóstico es de un partido que no está en esta temporada."; return pintar(); }
  await elegirPartido(i);
  if(J.paso !== "armar") return;
  J.formA = g.fa; J.formB = g.fb; J.K = g.k || J.K;
  const rearmar = (ids, form, pool) => slotsDe(form).flatMap(l =>
    Array.from({length:l.n}, () => ({cat:l.cat}))).map((slot, k) => {
      const p = pool.find(x => x.id === ids[k]);
      return p ? {...p, slotCat: slot.cat} : null;
    });
  J.xiA = rearmar(g.a, g.fa, J.pool.A).map((p,k)=> p || autoXI(J.pool.A,g.fa)[k]);
  J.xiB = rearmar(g.b, g.fb, J.pool.B).map((p,k)=> p || autoXI(J.pool.B,g.fb)[k]);
  J.msg = "Pronóstico recuperado del link" + (J.jugado ? " — este partido ya se jugó." : ".");
  pintar();
}

async function elegirPartido(i){
  J.err=""; J.fx=J.fixtures[i]; J.jugado=JUGADO(J.fx); J.real=null; J.sim=null;
  J.esLocalA = J.fx.teams.home.id===J.id.A;
  J.id.B = J.esLocalA? J.fx.teams.away.id : J.fx.teams.home.id;
  J.nom.A = J.esLocalA? J.fx.teams.home.name : J.fx.teams.away.name;
  J.nom.B = J.esLocalA? J.fx.teams.away.name : J.fx.teams.home.name;
  J.msg="Armando los planteles con los partidos ANTERIORES. No miro este.";
  pintar();
  try{
    const antes = f => new Date(f.fixture.date) < new Date(J.fx.fixture.date);
    /* Cinco partidos y no tres. Con tres, el que se perdió una fecha por
       molestia desaparece del plantel, y el hincha lo nota enseguida. */
    const mios = J.fixtures.filter(antes).slice(-5);
    let rivales=[];
    try{
      const all=await api("/fixtures",{team:J.id.B,season:J.temporada,league:LEAGUE});
      rivales=all.filter(f=>["FT","AET","PEN"].includes(f.fixture.status.short)&&antes(f))
        .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date)).slice(-5);
    }catch(e){}
    J.pool.A=fusionar(await plantel(mios.map(f=>f.fixture.id), J.id.A),
                      await plantilla(J.id.A));
    J.pool.B=fusionar(await plantel(rivales.map(f=>f.fixture.id), J.id.B),
                      await plantilla(J.id.B));
    if(J.pool.A.length<11||J.pool.B.length<11)
      throw new Error("No hay suficientes partidos previos. Elegí uno más avanzado en la temporada.");
    J.xiA=autoXI(J.pool.A,J.formA); J.xiB=autoXI(J.pool.B,J.formB);
    J.msg=J.pool.A.length+" jugadores tuyos · "+J.pool.B.length+" del rival · "+J.reqs+" pedidos";
    J.paso="armar";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

function simular11(){
  if(J.animando) return;
  const t=tacticas(J.K);
  const LA=lineas(J.xiA), LB=lineas(J.xiB);
  const xgA=xgDe(LA,LB,J.esLocalA,t.mine,bonusAncho(J.xiA,t.ancho));
  const xgB=xgDe(LB,LA,!J.esLocalA,t.theirs,1)+t.theirsFlat;
  J.animando=true;
  const b=$("bsim"); if(b){ b.disabled=true; b.textContent="Jugando…"; }
  document.getElementById("campo")?.scrollIntoView({behavior:"smooth",block:"center"});
  animarPartido(xgA, xgB, marc=>{
    J.animando=false;
    J.sim=simular(xgA,xgB); J.sim.notas=t.notas; J.sim.estaVez=marc;
    J.paso="resultado"; pintar();
    setTimeout(()=>document.querySelector(".res")?.scrollIntoView({behavior:"smooth",block:"center"}),90);
  });
}

async function revelar(){
  J.err=""; J.msg="Buscando el once del DT y lo que pasó…"; pintar();
  try{

    J.real={ once:(mio?.startXI||[]).map(x=>x.player), formacion:mio?.formation,
      misG, susG, rojas, penales,

    J.msg=""; J.paso="revelado";

  pintar();
}

/* ── LA CANCHA ────────────────────────────────────────────────────────────
   Los dos equipos en el MISMO campo, como en PC Fútbol: el tuyo abajo
   atacando para arriba, el rival arriba atacando para abajo. Tocás un
   globito y elegís quién lo ocupa.                                       */
function coordsDe(form, arriba){
  const slots=slotsDe(form), filas=slots.length, out=[];
  slots.forEach((l,i)=>{
    const t=i/(filas-1);
    const y = arriba ? 7 + t*36 : 93 - t*36;
    for(let j=0;j<l.n;j++) out.push({ x:(j+1)/(l.n+1)*100, y, cat:l.cat });
  });
  return out;
}
/* ── LAS PERILLAS SE TIENEN QUE VER EN LA CANCHA ─────────────────────────
   Hasta acá movían el resultado y nada más: subías la línea, cambiaban las
   probabilidades y los once puntos seguían exactamente donde estaban. Un
   hincha que mueve "línea alta" espera ver a los defensores subir, y si no
   los ve, la perilla no significa nada.

   Se mueve SOLO tu equipo. El rival no tiene por qué reacomodarse porque vos
   toques una perilla tuya, y además así se ve claro qué cambiaste.       */
function ajustarTactica(coords, arriba, K){
  const lin=(K.linea||0)/100, pre=(K.presion||0)/100, anc=(K.ancho||0)/100;
  const dir = arriba ? 1 : -1;                       // hacia el arco rival
  const campo = coords.filter(c => c.cat !== "G");
  const cy = campo.reduce((a,c)=>a+c.y,0) / Math.max(1, campo.length);

  /* Adónde puede llegar cada uno. No es cosmética: sin topes, con la línea
     al máximo los delanteros se meten en el área rival y con la línea al
     mínimo el arquero se va abajo del borde de la cancha.              */
  const banda   = arriba ? [12, 60] : [40, 88];      // los de campo
  const bandaGK = arriba ? [6, 15]  : [85, 94];

  /* La y que le tocaría a cada uno según las perillas. */
  const ys = coords.map(c => {
    if(c.cat === "G") return c.y + dir*lin*4;
    /* La línea sube o baja el bloque entero. */
    let y = c.y + dir*lin*13;
    /* La presión junta las líneas entre sí y adelanta un poco: un equipo
       que presiona alto es un equipo CORTO, no solo adelantado.       */
    return cy + (y - cy) * (1 - 0.30*pre) + dir*pre*6;
  });

  /* ── El bloque se corre entero ────────────────────────────────────────
     Recortar a cada jugador por separado aplastaba las líneas una contra
     otra: con la línea al mínimo, defensores y volantes terminaban todos
     pegados al tope y encimados. Un equipo que no entra en la cancha
     retrocede completo y conserva su forma.                           */
  const deCampo = ys.filter((_, i) => coords[i].cat !== "G");
  const sobra = Math.max(0, Math.max(...deCampo) - banda[1]);
  const falta = Math.max(0, banda[0] - Math.min(...deCampo));
  const corrimiento = sobra - falta;

  return coords.map((c, i) => {
    const arquero = c.cat === "G";
    const b = arquero ? bandaGK : banda;
    const y = Math.max(b[0], Math.min(b[1], ys[i] - (arquero ? 0 : corrimiento)));
    /* El ancho abre a los de afuera y junta a los del medio. */
    const x = arquero ? c.x : 50 + (c.x - 50) * (1 + 0.38*anc);
    return { ...c, x: Math.max(8, Math.min(92, x)), y };
  });
}

/* Mueve los puntos que ya están en pantalla, sin repintar: si repintáramos
   la vista entera en cada movimiento del dedo, el slider perdería el foco. */
function colocarJugadores(){
  const campo=$("campo"); if(!campo || J.animando) return;
  const cA=ajustarTactica(coordsDe(J.formA,false), false, J.K);
  const cB=coordsDe(J.formB,true);
  campo.querySelectorAll(".jug").forEach(el=>{
    const c=(el.dataset.lado==="A"?cA:cB)[+el.dataset.slot];
    if(!c) return;
    el.style.left=c.x+"%"; el.style.top=c.y+"%";
  });
}

const apellido = nom => { const w=String(nom||"").trim().split(/\s+/); return w[w.length-1]||"—"; };
