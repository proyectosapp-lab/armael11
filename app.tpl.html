/* El dibujo de respaldo, y NADA MÁS que de respaldo: se usa mientras no hay
   partido elegido y cuando los partidos anteriores no alcanzan para deducir
   cómo se para el equipo. Que esto estuviera clavado como formación de los
   dos equipos era la segunda queja de los testers. */
const FORMA_DE_RESPALDO = "4-3-3";

const J={ key:"", reqs:0, temporada:2026, fixtures:[], fx:null, pool:{A:[],B:[]},
  nom:{A:"",B:""}, id:{A:CLUB.apiId,B:0}, esLocalA:true, xiA:[], xiB:[],
  formA:FORMA_DE_RESPALDO, formB:FORMA_DE_RESPALDO,
  /* Cuál de los dos once que están en la cancha es el que puso el DT y no
     el que armó la app. No se deduce de "¿hay formación publicada?": puede
     haberla y no poder usarse —diez nombres, un puesto que no se entiende—,
     y ahí la cancha muestra el de la app. Esto dice qué se está mostrando,
     que es lo único que el cartel tiene permitido afirmar. */
  delDT:{A:false,B:false},
  /* Las perillas de cada uno. Antes había una sola tanda —la tuya— y el
     rival no se podía plantear: si el que se metía atrás con diez era él,
     eso no se podía decir. */
  K:{linea:0,presion:0,ancho:0,ritmo:0}, KB:{linea:0,presion:0,ancho:0,ritmo:0},
  /* Las indicaciones del planteo. No son por jugador —el motor no tiene
     aporte por jugador— pero cada una publica su efecto. */
  IND: { ...INDICACIONES_POR_DEFECTO }, INDB: { ...INDICACIONES_POR_DEFECTO },
  /* Desde dónde se simula. Minuto 0 es "desde el arranque", que es lo normal. */
  /* `faltanA` / `faltanB`: los ids de los que NO están en la cancha. No es
     lo mismo que `rojasA`: podés decir que hay uno menos sin decir quién, y
     ahí la cuenta sale como salía antes de que esto existiera. */
  desde: { minuto:0, golesA:0, golesB:0, rojasA:0, rojasB:0, faltanA:[], faltanB:[] },
  /* Si el partido se MIRA o se va derecho al resultado. Es una elección de
     cómo verlo, no de qué se simula: las dos usan el mismo once, la misma
     formación y las mismas perillas. Que antes fueran dos botones distintos
     -"Simular ya" y "Simular y verlo jugar"- hacía creer que eran dos
     simulaciones distintas, y que las perillas solo valían para una. */
  ver: true,
  /* Lo que la app puso sola al elegir el partido. Se guarda para poder decir
     después qué cambió la persona y qué no. */
  auto: { xiA:[], formA:null },
  /* Qué liga se está simulando: null es la del club de esta página. */
  liga: null,
  sim:null, real:null, paso:PORTADA?"liga":"key", msg:"", err:"" };

/* ── LA API, SIN API ────────────────────────────────────────────────────
   El juego pide cuatro cosas a API-Football: fixtures, jugadores por
   partido, formaciones y eventos. Cuando el sitio está publicado, esas
   cuatro respuestas ya vienen bajadas y guardadas: la key vive como
   secreto del repositorio y el navegador nunca la ve ni la necesita.

   No se reescribió nada del juego. Se interceptó el pedido, que es lo
   único que tocaba la red. La clave del cache es la misma URL relativa,
   así que lo que guardó el build es exactamente lo que pide la pantalla.
   Si algo no está en el cache y hay key, sale a buscarlo como siempre. */
/* ── EL ONCE DEL DT DE LAS OTRAS LIGAS ───────────────────────────────────
   El de tu club viene en el cache de la página. Los de las otras once ligas
   vienen en `onces-<liga>.js`, que la ronda corta escribe aparte: el archivo
   de la liga lo rehace la corrida completa todos los días y se los llevaría
   puestos. Acá se leen, sin pedirle nada a la API y sin que el resto de la
   app se entere de que hay dos lugares. */
function onceGuardado(fixtureId){
  const e = (window.ONCES || {})[String(fixtureId)];
  const a = e && (e.o || e);
  return Array.isArray(a) && a.length ? a : null;
}

async function api(path, params={}){
  const clave=path+(Object.keys(params).length?"?"+new URLSearchParams(params):"");
  if(window.CACHE && clave in window.CACHE) return window.CACHE[clave];
  if(path==="/fixtures/lineups" && params.fixture){
    const o = onceGuardado(params.fixture);
    if(o) return o;
  }
  if(!J.key) throw new Error("Por ahora están cargados el próximo partido y el último jugado.");
  const url=BASE+clave;
  const r=await fetch(url,{headers:{"x-apisports-key":J.key}});
  J.reqs++;
  const j=await r.json();
  if(j.errors&&Object.keys(j.errors).length&&!Array.isArray(j.errors))
    throw new Error(Object.values(j.errors).join(" · "));
  return j.response||[];
}

/* Recibe los PARTIDOS y no solo sus números, porque hace falta la fecha: sin
   ella no se puede saber si alguien volvió a jugar después de la fecha en que
   una transferencia dice que se fue. */
async function plantel(partidos, teamId){
  const map=new Map(), dibujos=[];
  for(const fx of partidos){
    const fid=fx.fixture.id, cuando=fx.fixture.date;
    let resp; try{ resp=await api("/fixtures/players",{fixture:fid}); }catch(e){ continue; }
    /* El dibujo de ese partido sale de la MISMA respuesta: quiénes fueron
       titulares y en qué categoría jugaron. No cuesta un pedido más. */
    dibujos.push(formacionDeSalida(resp, teamId));
    (resp||[]).forEach(eq=>{
      if(eq.team.id!==teamId) return;
      (eq.players||[]).forEach(j=>{
        const st=j.statistics?.[0]||{}, g=st.games||{};
        if(!g.minutes) return;
        const id=j.player.id;
        if(!map.has(id)) map.set(id,{id,nombre:j.player.name,pos:g.position?.[0]||"M",ratings:[],mins:0,apar:0,ultimo:null});
        const p=map.get(id);
        if(g.rating) p.ratings.push(parseFloat(g.rating));
        p.mins+=g.minutes||0; p.apar++;
        if(cuando && (!p.ultimo || new Date(cuando)>new Date(p.ultimo))) p.ultimo=cuando;
      });
    });
  }
  return { jugadores: [...map.values()].sort((a,b)=>fuerza(b).v-fuerza(a).v),
           forma: formacionHabitual(dibujos) };
}

const JUGADO = f => ["FT","AET","PEN"].includes(f.fixture.status.short);

/* ── EL PLANTEL DE VERDAD ────────────────────────────────────────────────
   Armar el plantel con los que sumaron minutos en los últimos partidos tiene
   dos defectos que se ven a simple vista: falta el que estuvo lesionado o el
   que acaba de llegar, y el puesto que le queda es el que jugó ese día, no
   el suyo. Un lateral que tapó un hueco en el medio quedaba de volante.

   API-Football tiene la lista oficial del plantel con el puesto de cada uno.
   Es UN pedido por equipo. Eso manda para el puesto; los partidos siguen
   mandando para el nivel, que es lo que el modelo necesita.

   Si el pedido falla o viene raro, no pasa nada: se sigue con lo de antes. */
/* La traducción vive en `juego.js`, que es el archivo que ven las dos
   puntas —el navegador y los scripts que bajan los datos—. Tenerla dos
   veces fue exactamente el bug: acá estaba bien y en `ligas-api.mjs` mal,
   y las otras diez ligas salían con los delanteros fuera de puesto. */

async function plantilla(teamId){
  try{
    const r = await api("/players/squads",{team:teamId});
    const eq = (r||[]).find(x=>x.team?.id===teamId) || (r||[])[0];
    return (eq?.players||[])
      .map(p=>({ id:p.id, nombre:p.name, pos:puestoDe(p.position) }))
      /* Solo el id: `puestoDe` siempre devuelve una categoría usable, así
         que un puesto que no conocemos ya no borra al jugador de la lista.
         Antes sí lo borraba, y era la decisión equivocada: si algún día la
         API agrega una etiqueta nueva, preferimos un jugador de más en el
         medio antes que un titular que desaparece sin que nadie lo note. */
      .filter(p=>p.id);
  }catch(e){ return []; }
}

/* ── LOS QUE YA NO ESTAN ──────────────────────────────────────────────────
   Lo primero que dijeron los testers: hay jugadores en el plantel que se
   fueron en este mercado de pases. Y es peor de lo que parece, porque el
   argumento entero de la app es que los datos son reales: un nombre que se
   fue en julio no se lee como "falta actualizar el plantel", se lee como que
   todo lo demas tambien esta viejo. Ensucia los numeros, que no tienen nada
   que ver.

   POR QUE NO ALCANZA CON LA LISTA OFICIAL. Mirando el cache de verdad de
   Talleres: la lista oficial trae 31 jugadores, 6 de ellos sin un minuto en
   los ultimos cinco partidos - y al mismo tiempo hay 3 que SI jugaron y no
   figuran en la lista. Se equivoca para los dos lados, asi que no se puede
   usar sola ni descartarla.

   POR QUE TAMPOCO ALCANZA CON "SACAR AL QUE NO JUGO". Esa es la tentacion
   facil y se lleva puestos al lesionado y al que acaba de llegar, que es
   justo para lo que la lista oficial existe.

   Asi que se pregunta lo que se quiere saber: las transferencias. Un pedido
   por equipo. De cada jugador se mira su movimiento MAS RECIENTE con este
   club; si ese movimiento lo saca, se fue.

   Y una valvula: si despues de esa fecha volvio a jugar para nosotros, gana
   la cancha. El dato de transferencia puede estar mal o el tipo puede haber
   vuelto, pero los minutos jugados no se discuten. Sin esa valvula, un dato
   equivocado en la API nos borra un titular - que es un error mucho mas
   visible que el que estamos arreglando.

   Si el pedido falla o viene vacio, no cambia nada: se sigue como antes. */
async function salidas(teamId){
  try{
    const r=await api("/transfers",{team:teamId});
    const fuera=new Map();
    for(const x of (r||[])){
      const id=x.player?.id; if(!id) continue;
      const suyos=(x.transfers||[])
        .filter(t=>t.date && (t.teams?.in?.id===teamId || t.teams?.out?.id===teamId))
        .sort((a,b)=>new Date(a.date)-new Date(b.date));
      const ult=suyos[suyos.length-1];
      if(ult && ult.teams?.out?.id===teamId) fuera.set(id, ult.date);
    }
    return fuera;
  }catch(e){ return new Map(); }
}

function sinLosQueSeFueron(pool, fuera){
  if(!fuera || !fuera.size) return pool;
  return pool.filter(p=>{
    const cuando=fuera.get(p.id);
    if(!cuando) return true;
    return !!(p.ultimo && new Date(p.ultimo)>new Date(cuando));
  });
}

function fusionar(pool, lista){
  if(!lista.length) return pool;
  const porId = new Map(pool.map(p=>[p.id, p]));
  for(const s of lista){
    const p = porId.get(s.id);
    if(p) p.pos = s.pos;      // el puesto oficial le gana al del último partido
    else porId.set(s.id, { id:s.id, nombre:s.nombre, pos:s.pos,
                           ratings:[], mins:0, apar:0, ultimo:null });
  }
  return [...porId.values()].sort((a,b)=>fuerza(b).v-fuerza(a).v);
}

async function cargarTemporada(){
  leerAviso();                    /* en paralelo: no frena nada */
  J.err=""; J.msg="Cargando la temporada…"; pintar();
  try{
    const fx=await api("/fixtures",{team:J.id.A,season:J.temporada,league:LEAGUE});
    /* Antes solo traía los terminados y eso convertía el juego en un museo.
       El gancho es simular el partido del domingo, no el de mayo.        */
    J.fixtures=fx.filter(f=>JUGADO(f) || f.fixture.status.short==="NS")
                 .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date));
    /* Con los datos ya bajados no están los treinta partidos de la temporada:
       están el próximo y el último jugado, que son los dos que se juegan. Se
       ofrecen solo esos, en vez de ofrecer todos y fallar al elegir. */
    if(window.CACHE?.__jugables)
      J.fixtures=J.fixtures.filter(f=>window.CACHE.__jugables.includes(f.fixture.id));
    if(!J.fixtures.length) throw new Error("No hay partidos en "+J.temporada+".");
    J.proximo=J.fixtures.find(f=>!JUGADO(f));
    J.msg=J.fixtures.filter(JUGADO).length+" jugados · "+
          J.fixtures.filter(f=>!JUGADO(f)).length+" por venir · "+J.reqs+" pedidos";
    J.paso="fixture";
    const guardado = leerPronostico();
    if(guardado && guardado.c === CLUB.id && guardado.t === J.temporada){
      pintar(); return restaurar(guardado);
    }
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* Reconstruye un pronóstico guardado: busca el partido, arma los planteles
   igual que siempre y vuelve a poner los mismos jugadores en los mismos
   puestos. Si el partido ya se jugó, ofrece revelar de una.              */
async function restaurar(g){
  const i = J.fixtures.findIndex(f => f.fixture.id === g.f);
  if(i < 0){ J.err = "El pronóstico es de un partido que no está en esta temporada."; return pintar(); }
  await elegirPartido(i);
  if(J.paso !== "armar") return;
  J.formA = g.fa; J.formB = g.fb; J.K = g.k || J.K;
  const rearmar = (ids, form, pool) => slotsDe(form).flatMap(l =>
    Array.from({length:l.n}, () => ({cat:l.cat}))).map((slot, k) => {
      const p = pool.find(x => x.id === ids[k]);
      return p ? {...p, slotCat: slot.cat} : null;
    });
  J.xiA = rearmar(g.a, g.fa, J.pool.A).map((p,k)=> p || autoXI(J.pool.A,g.fa)[k]);
  J.xiB = rearmar(g.b, g.fb, J.pool.B).map((p,k)=> p || autoXI(J.pool.B,g.fb)[k]);
  J.msg = "Pronóstico recuperado del link" + (J.jugado ? " — este partido ya se jugó." : ".");
  pintar();
}

/* ─── SIMULAR CUALQUIER PARTIDO DE OTRA LIGA ──────────────────────────────
   Las ligas vienen COCINADAS desde `ligas-api.mjs`: por jugador, su promedio
   de rating y sus minutos, que es todo lo que mira `fuerza()`. No hay que
   pedirle nada a nadie —ni a la API ni al usuario— y una liga entera pesa
   unas decenas de kilobytes.

   Y cada liga trae SUS números: goles de local, de visitante y media de
   rating. Sin eso, simular la Premier con la media argentina daría todos los
   marcadores bajos y nadie entendería por qué.                           */
const ligasParaSimular = () => (window.LIGAS_DISPONIBLES || [])
  .map(sl => (window.LIGAS || {})[sl]).filter(Boolean);

/* ── LO QUE LA APP DICE DE CADA LIGA, INCLUIDA LA PROPIA ─────────────────
   El backtest mide, liga por liga, cuánto le gana el modelo a la vara: dar
   siempre la frecuencia histórica de esa liga (gana el local, empatan,
   gana la visita). Ese número estaba medido y guardado desde agosto, y no
   se mostraba en ningún lado.

   Ahora se muestra, y se muestra ENTERO: en Portugal el modelo le saca
   bastante, en Argentina casi nada. Decir solo lo primero sería marketing;
   decir las dos cosas es lo que hace creíble a la primera. Es la misma
   jugada que contar cuán raro fue el marcador que se acaba de ver: el dato
   incómodo, dicho por nosotros, vale más que el dato lindo.

   Tres escalones y no cinco, porque la diferencia entre 0,047 y 0,053 no
   significa nada para el que lo lee, y fingir precisión es otra forma de
   mentir. Sin `ventajaBacktest` no se dice nada: una liga recién sumada
   todavía no tiene medida propia.

   ── CÓMO SE DICE, Y POR QUÉ ASÍ ──────────────────────────────────────────
   Primero se dijo en la jerga del backtest: "le gana al promedio". Es
   exacto y no le habla a nadie. Ahora se dice por el lado del acierto, que
   es lo que el hincha entiende, y el escalón de abajo nombra a la liga en
   vez de al modelo: Argentina no es un problema del modelo, es la liga más
   pareja de las once, y eso es una característica del fútbol argentino que
   cualquiera que lo mire reconoce.

   Lo que NO cambia: el escalón lo sigue decidiendo el número medido, y el
   orden coincide con el acierto real en todas las ligas donde lo tenemos
   (Perú 54,4% · Portugal 53,9% · Alemania 52,0% · México 51,5% arriba;
   Brasil 49,7% y Colombia 46,5% en el medio). Si alguna vez un escalón deja
   de coincidir con su etiqueta, se cambia la etiqueta, no el número.      */
const MEDIDA = [
  { desde: 0.04,  corto: "Índice de acierto más alto",
    largo: "Índice de acierto más alto: entre las ligas medidas, es de las que el modelo lee mejor." },
  { desde: 0.015, corto: "Índice de acierto alto",
    largo: "Índice de acierto alto: el modelo la lee bien, aunque menos que a las europeas." },
  { desde: -99,   corto: "Liga más impredecible",
    largo: "La liga más impredecible de las once: acá el fútbol se deja anticipar menos que en ninguna otra, y eso hace que simular sea más interesante, no menos." },
];
const medidaDe = L => (L && L.ventajaBacktest != null)
  ? MEDIDA.find(m => L.ventajaBacktest >= m.desde) : null;
/* Estadística dura abajo de la lista: de dónde sale todo esto. El "más de
   13.000" es deliberadamente redondo hacia abajo —el conteo exacto es
   13.345 de trece ligas, desglosado en `construir-sitio.mjs`—: un número
   que se queda corto nunca hay que salir a defenderlo. */
const QUE_ES_EL_PROMEDIO = "El modelo se probó contra más de 13.000 partidos ya jugados de trece ligas, " +
  "y se recalibra con cada temporada: los números de cada liga salen de sus propios partidos.";

/* ── LAS BANDERAS ────────────────────────────────────────────────────────
   Dibujadas acá, en SVG, y no traídas de ningún lado. Tres razones, y la
   primera es la que manda:

   1. La app no carga NADA de terceros. Un set de banderas de un CDN sería
      la primera excepción, y las excepciones a esa regla no vuelven.
   2. Pesan nada y no parpadean: ya están en la página cuando se dibuja.
   3. Son banderas de países, no escudos de clubes. Es la única imagen que
      esta app puede mostrar sin pisar la propiedad de nadie.

   Están simplificadas a propósito —el sol argentino es un círculo, la
   esfera portuguesa es un anillo—: a treinta píxeles de ancho el detalle no
   se ve y solo agrega bytes. Lo que tiene que leerse al instante son los
   colores y su disposición, y eso está exacto.                          */
const BANDERAS = {
  argentina: '<rect width="30" height="20" fill="#74ACDF"/><rect y="6.67" width="30" height="6.66" fill="#fff"/><circle cx="15" cy="10" r="2.1" fill="#F6B40E"/>',
  portugal:  '<rect width="30" height="20" fill="#FF0000"/><rect width="12" height="20" fill="#006600"/><circle cx="12" cy="10" r="3.6" fill="none" stroke="#FFD700" stroke-width="1.1"/><circle cx="12" cy="10" r="1.7" fill="#fff"/>',
  italia:    '<rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#009246"/><rect x="20" width="10" height="20" fill="#CE2B37"/>',
  inglaterra:'<rect width="30" height="20" fill="#fff"/><rect x="12" width="6" height="20" fill="#CE1124"/><rect y="7" width="30" height="6" fill="#CE1124"/>',
  espana:    '<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>',
  francia:   '<rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#002395"/><rect x="20" width="10" height="20" fill="#ED2939"/>',
  alemania:  '<rect width="30" height="20" fill="#000"/><rect y="6.67" width="30" height="6.66" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>',
  brasil:    '<rect width="30" height="20" fill="#009C3B"/><path d="M15 2.6 26.4 10 15 17.4 3.6 10Z" fill="#FFDF00"/><circle cx="15" cy="10" r="3.3" fill="#002776"/>',
  colombia:  '<rect width="30" height="20" fill="#FCD116"/><rect y="10" width="30" height="5" fill="#003893"/><rect y="15" width="30" height="5" fill="#CE1126"/>',
  /* México y Italia son verde-blanco-rojo: sin el escudo en el medio, a
     treinta píxeles son la misma bandera. El círculo no es un águila, pero
     alcanza para que no se confundan, que es para lo que está. */
  mexico:    '<rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#006847"/><rect x="20" width="10" height="20" fill="#CE1126"/><circle cx="15" cy="10" r="2.1" fill="#8C6239"/>',
  peru:      '<rect width="30" height="20" fill="#D91023"/><rect x="10" width="10" height="20" fill="#fff"/>',
};
/* El borde va SIEMPRE, aunque la bandera no sea blanca: sin él, la de
   Inglaterra y la de Italia se derriten contra el fondo claro y quedan como
   manchas de color flotando. */
const bandera = slug => `<svg class="fl" viewBox="0 0 30 20" aria-hidden="true">${
  BANDERAS[slug] || '<rect width="30" height="20" fill="#8894A6"/>'
}<rect x=".4" y=".4" width="29.2" height="19.2" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".8"/></svg>`;

function poolDeLiga(L, equipoId){
  const e = L.equipos[equipoId] || L.equipos[String(equipoId)];
  if(!e) return [];
  /* `puestoDe` y no `j.p` tal cual: hasta el 20/9 los archivos de liga
     guardaban "A" para los delanteros —`/players/squads` contesta "Attacker"
     y alguien le tomó la inicial— y "A" no es una categoría de ninguna
     formación. `autoXI` no los podía ubicar y salían improvisados por toda
     la cancha, pagando castigo por jugar de lo que son.

     Traducirlo ACÁ y no solo al bajar los datos es lo que hace que los
     archivos que ya están publicados se curen con este zip, en vez de
     dentro de 24 horas, que es cada cuánto se rehacen. */
  return e.j.map(j => ({ id:j.i, nombre:j.n, pos:puestoDe(j.p),
                         ratings: (j.r!=null ? [j.r] : []), mins: j.m||0 }));
}
/* El dibujo habitual que viene en el archivo de liga. Se comprueba contra
   FORMS y no se usa tal cual: un valor raro en un archivo bajado no puede
   convertirse en una formación inexistente adentro de `slotsDe`. */
function dibujoDeEquipo(L, equipoId){
  const e = (L.equipos||{})[equipoId] || (L.equipos||{})[String(equipoId)] || {};
  return (FORMS.includes(e.f) ? e.f : FORMA_DE_RESPALDO);
}

const nombreDeEquipo = (L, id) =>
  (L.equipos[id] || L.equipos[String(id)] || {}).n || "?";

/* Cuándo se juega, en la hora del que está mirando. Antes se recortaba la
   cadena a mano —"09-20"— para no tocar husos horarios, y así quedaba un
   mes-día al revés del que se usa acá y sin hora.

   La hora importa más que nunca desde que la pantalla avisa si las
   formaciones están confirmadas: el once del DT sale alrededor de una hora
   antes, así que saber a qué hora juega es saber cuándo volver.

   `new Date` hace la conversión de zona sola y bien —la fecha viene con
   zona, "...T21:30:00+00:00"— y de ahí se arma el texto A MANO en vez de
   con `toLocaleString`. No es capricho: `toLocaleString("es-AR")` depende
   de qué tablas de idioma trajo el navegador, y en uno con ICU recortado
   devolvió "sáb 05-09 · 02:00 p. m." —mes y día al revés, y en doce horas,
   que no es como se lee una hora acá—. Cinco líneas de padStart dan
   siempre lo mismo en todos lados.

   Si algún día llegara una fecha rara, el catch devuelve el recorte de
   siempre en vez de romper la lista entera. */
/* Qué fecha es, dicho como se dice acá. La API manda "Regular Season - 5",
   que no significa nada para un hincha.

   Se escribe SIEMPRE, aunque todos los partidos sean de la misma: cuando la
   fecha en curso está casi jugada, la lista suma la siguiente, y dos
   partidos con tres semanas de diferencia uno al lado del otro sin nada que
   los distinga es exactamente lo que estaba mal. */
function nombreDeFecha(ronda){
  const r = String(ronda || "").trim();
  if(!r) return "";
  const m = /(\d+)\s*$/.exec(r);
  if(!m) return r;
  if(/regular season/i.test(r)) return "Fecha " + m[1];
  const antes = r.replace(/\s*-\s*\d+\s*$/, "").trim();
  return antes ? antes + ", fecha " + m[1] : "Fecha " + m[1];
}

const DIAS_CORTOS = ["dom","lun","mar","mié","jue","vie","sáb"];
function cuandoJuega(fecha){
  try{
    const d = new Date(fecha);
    if(isNaN(d)) throw 0;
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return DIAS_CORTOS[d.getDay()] + " " + dd + "/" + mm + " · " + hh + ":" + mi;
  }catch(e){
    const s = String(fecha).slice(5,10).split("-");
    return s.length === 2 ? s[1] + "/" + s[0] : String(fecha).slice(0,10);
  }
}

/* ── BAJAR SOLO A LOS PARTIDOS ───────────────────────────────────────────
   Con once ligas agrupadas por continente, el que elige Italia la tiene
   abajo de todo: la lista de partidos aparece FUERA de la pantalla y la
   app se ve como si el toque no hubiera hecho nada. Fausto lo pidió
   derecho: "que se desplace automáticamente hacia abajo".

   Dos cuidados:

   - Va dentro de un `requestAnimationFrame` porque `pintar()` rehace el
     HTML entero: un instante antes, `.partidos` todavía no existe.
   - Se deja un margen arriba (`ARRIBA`) en vez de pegar la lista al borde,
     para que el botón de la liga recién elegida quede a la vista. Si no,
     la persona ve una lista de partidos y perdió de vista de qué liga son.

   Y se respeta a quien pidió menos movimiento en su sistema: para alguien
   con sensibilidad al movimiento, un salto suave de media pantalla no es
   un detalle lindo. */
function bajarALosPartidos(){
  if(typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    try{
      const lista = document.querySelector(".partidos");
      if(!lista) return;
      const ARRIBA = 76;
      const quieto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const y = window.scrollY + lista.getBoundingClientRect().top - ARRIBA;
      window.scrollTo({ top: Math.max(0, y), behavior: quieto ? "auto" : "smooth" });
    }catch(e){}
  });
}

/* ── LOS ONCE DE LA CANCHA ───────────────────────────────────────────────
   Un solo lugar donde se decide con qué once arranca cada lado, y los dos
   caminos —el partido de tu club y el de otra liga— pasan por acá.

   La regla es una sola: SI EL DT YA PUBLICÓ SU ONCE, ESE ES EL QUE VA. Y si
   no salió, o salió y no se puede armar con él, lo arma la app como siempre.

   Se llama al ELEGIR el partido y no al pintar: el once del DT es el punto
   de partida, no una corrección que aparece encima. Si alguien entró antes
   de que saliera la formación y movió cuatro nombres, no se le pisa el
   trabajo a mitad de camino.                                             */
function ponerOnces(){
  const al = (window.CACHE || {})["/fixtures/lineups?fixture=" + J.fx.fixture.id]
          || onceGuardado(J.fx.fixture.id) || [];
  J.delDT = { A:false, B:false };
  for(const lado of ["A","B"]){
    const t = Array.isArray(al) ? al.find(x => x.team?.id === J.id[lado]) : null;
    const dib = t && dibujoDelOnce(t.startXI, t.formation);
    const xi  = dib && xiDelDT(t.startXI, J.pool[lado], dib);
    if(xi){ J["form"+lado] = dib; J["xi"+lado] = xi; J.delDT[lado] = true; }
    else  { J["xi"+lado] = autoXI(J.pool[lado], J["form"+lado]); }
  }
  /* El punto de partida contra el que se cuentan los cambios. Cuando la
     cancha arranca con el del DT, "3 cambios en el once" pasa a querer
     decir lo que uno espera que quiera decir: tres cambios AL DEL DT. */
  J.auto = { xiA: J.xiA.filter(Boolean).map(p=>p.id), formA: J.formA };
}

function simularDeLiga(slug, fixtureId){
  const L = (window.LIGAS || {})[slug];
  const p = L && L.partidos.find(x => String(x.id) === String(fixtureId));
  if(!p){ J.err = "Ese partido ya no está en la lista."; return pintar(); }

  /* Los tres números de la liga. Si la liga vino sin calibrar —porque recién
     arranca la temporada— `usarLiga` se queda con el respaldo en vez de
     inventar uno. */
  usarLiga({ id:L.id, nombre:L.nombre, media:L.media, local:L.local, visita:L.visita });

  /* UN PARTIDO DE VERDAD, AUNQUE VENGA DEL ARCHIVO DE LA LIGA. Esto era
     `J.fx = null`, y por eso las otras ligas no tenían el once del DT: todo
     el revelado -¿ya salió?, simularlo contra el tuyo- cuelga de `J.fx`. El
     archivo de la liga trae lo justo, así que se arma el mismo objeto que da
     la API con lo que hay: id, fecha, los dos equipos. Goles en null porque
     todavía no se jugó -a las otras ligas solo se les mira el once, no el
     resultado-, y `status` en NS por lo mismo. */
  /* EL ESTADO Y LOS GOLES SALEN DEL ARCHIVO. Esto estaba clavado en "NS" y
     goles en null, que era verdad mientras el archivo traía solo partidos
     por jugar. Desde que trae la fecha entera hay partidos terminados
     adentro, y decir que no se jugaron sería mentir en la pantalla: el
     resultado real es justamente lo que hace que simularlo tenga gracia. */
  J.liga = slug; J.real = null; J.sim = null; J.err = "";
  J.fx = {
    fixture: { id: p.id, date: p.fecha, status: { short: p.estado || "NS" } },
    teams: { home: { id: p.local, name: nombreDeEquipo(L, p.local) },
             away: { id: p.visita, name: nombreDeEquipo(L, p.visita) } },
    goals: { home: p.golL ?? null, away: p.golV ?? null },
    league: { id: L.id, name: L.nombre, round: p.ronda || "" },
  };
  J.jugado = JUGADO(J.fx);
  J.esLocalA = true;
  J.id = { A:p.local, B:p.visita };
  J.nom = { A:nombreDeEquipo(L,p.local), B:nombreDeEquipo(L,p.visita) };
  J.pool.A = poolDeLiga(L, p.local);
  J.pool.B = poolDeLiga(L, p.visita);
  J.desde = { minuto:0, golesA:0, golesB:0, rojasA:0, rojasB:0, faltanA:[], faltanB:[] };

  if(J.pool.A.length < 11 || J.pool.B.length < 11){
    J.err = "Todavía no hay partidos previos suficientes de esos equipos.";
    J.paso = "liga"; return pintar();
  }
  /* EL DIBUJO DE CADA EQUIPO, no 4-3-3 para todos. Desde el 20/9 el archivo
     de liga trae `f`: el dibujo habitual de los últimos partidos, calculado
     al bajar los datos con la misma función que usa la página de un club.

     Antes acá había un `FORMA_DE_RESPALDO` clavado para los dos lados, y era
     la misma queja que los testers hicieron en agosto para los clubes
     argentinos: "toma todas las formaciones como 4-3-3, no las adapta al
     equipo". Estaba arreglado para Argentina y seguía roto para las otras
     diez ligas.

     Si un equipo no tiene `f` —liga recién arrancada, pocos partidos— se usa
     el de respaldo SOLO para ese equipo. `formacionHabitual` nunca inventa
     un dibujo, así que un null acá quiere decir "no sé", no "4-3-3". */
  J.formA = dibujoDeEquipo(L, p.local);
  J.formB = dibujoDeEquipo(L, p.visita);
  J.K = { linea:0, presion:0, ancho:0, ritmo:0 }; J.KB = { linea:0, presion:0, ancho:0, ritmo:0 };
  J.IND = { ...INDICACIONES_POR_DEFECTO }; J.INDB = { ...INDICACIONES_POR_DEFECTO };
  ponerOnces();
  J.msg = L.nombre + " · " + (L.calibrada
    ? "calibrada con " + L.calibrada.partidos + " partidos de " + L.calibrada.temporada
    : "sin calibrar todavía: uso los números de respaldo");
  J.paso = "armar";
  pintar();
}

/* Volver al partido del club de esta página. Hay que devolverle al motor los
   números de la liga local: si no, el próximo partido de tu club se
   simularía con la media de la Premier. */
function volverAMiClub(){
  /* `J.fx` también se suelta: el que vuelve elige de nuevo su partido, y
     dejar colgado el de la Premier haría que el pie del resultado hablara
     de un partido que ya no es el que está en pantalla. */
  J.liga = null; J.fx = null; J.sim = null; J.real = null; J.err = ""; J.msg = "";
  usarLiga(null);
  J.id.A = CLUB.apiId;
  J.desde = { minuto:0, golesA:0, golesB:0, rojasA:0, rojasB:0, faltanA:[], faltanB:[] };
  J.paso = PORTADA ? "liga" : "fixture";
  pintar();
}

async function elegirPartido(i){
  usarLiga(null);            /* el partido del club propio va con su liga */
  J.liga=null;
  J.err=""; J.fx=J.fixtures[i]; J.jugado=JUGADO(J.fx); J.real=null; J.sim=null;
  J.esLocalA = J.fx.teams.home.id===J.id.A;
  J.id.B = J.esLocalA? J.fx.teams.away.id : J.fx.teams.home.id;
  J.nom.A = J.esLocalA? J.fx.teams.home.name : J.fx.teams.away.name;
  J.nom.B = J.esLocalA? J.fx.teams.away.name : J.fx.teams.home.name;
  J.msg="Armando los planteles con los partidos ANTERIORES. No miro este.";
  pintar();
  try{
    const antes = f => new Date(f.fixture.date) < new Date(J.fx.fixture.date);
    /* Cinco partidos y no tres. Con tres, el que se perdió una fecha por
       molestia desaparece del plantel, y el hincha lo nota enseguida. */
    /* LOS CINCO DE VERDAD, PARA LOS DOS. Esto decia `J.fixtures.filter(antes)`,
       y J.fixtures ya viene recortada a los dos partidos jugables -el proximo
       y el ultimo-, asi que "los ultimos cinco" del club propio eran UNO.
       Medido con el cache real de Talleres: el rival llegaba con 26
       jugadores con minutos y cinco apariciones cada uno; el propio, con 16
       y una sola. Con un partido de muestra el nivel de cada uno es ruido,
       la mitad del plantel sale "sin minutos" y el dibujo deducido es el de
       ESE partido, no el habitual. El rival ya lo hacia bien: se copia. */
    const cincoAntes = lista => lista
      .filter(f=>["FT","AET","PEN"].includes(f.fixture.status.short)&&antes(f))
      .sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date)).slice(-5);
    let mios=[], rivales=[];
    try{ mios=cincoAntes(await api("/fixtures",{team:J.id.A,season:J.temporada,league:LEAGUE})); }
    catch(e){ mios=J.fixtures.filter(antes).slice(-5); }
    try{ rivales=cincoAntes(await api("/fixtures",{team:J.id.B,season:J.temporada,league:LEAGUE})); }
    catch(e){}
    const pa=await plantel(mios, J.id.A), pb=await plantel(rivales, J.id.B);
    J.pool.A=sinLosQueSeFueron(
      fusionar(pa.jugadores, await plantilla(J.id.A)), await salidas(J.id.A));
    J.pool.B=sinLosQueSeFueron(
      fusionar(pb.jugadores, await plantilla(J.id.B)), await salidas(J.id.B));
    /* CADA EQUIPO CON SU DIBUJO. Antes los dos arrancaban en 4-3-3 fijo, que
       era la queja: "no las adapta al equipo". Sale de cómo se pararon en
       los partidos anteriores; si no alcanza el dato, recién ahí el de
       respaldo. Se puede cambiar a mano igual que siempre. */
    J.formA = pa.forma || FORMA_DE_RESPALDO;
    J.formB = pb.forma || FORMA_DE_RESPALDO;
    J.K = { linea:0, presion:0, ancho:0, ritmo:0 }; J.KB = { linea:0, presion:0, ancho:0, ritmo:0 };
    J.IND = { ...INDICACIONES_POR_DEFECTO }; J.INDB = { ...INDICACIONES_POR_DEFECTO };
    if(J.pool.A.length<11||J.pool.B.length<11)
      throw new Error("No hay suficientes partidos previos. Elegí uno más avanzado en la temporada.");
    ponerOnces();
    J.msg=J.pool.A.length+" jugadores tuyos · "+J.pool.B.length+" del rival · "+J.reqs+" pedidos";
    J.paso="armar";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* Gasta una simulación y deja `CUPO` al día. Con cuenta, contra la base;
   sin cuenta, contra el navegador. Si la red falla, la simulación sale
   igual: quedarse sin poder jugar porque no se pudo contar es peor que
   contar de menos. */
/* Qué liga se está simulando. Las páginas de club son todas argentinas, así
   que sin liga elegida la liga es Argentina. Es un slug y no un id porque es
   lo que usa todo lo demás —el archivo bajado, el selector, el servidor—. */
const ligaAhora = () => J.liga || "argentina";

/* Devuelve `true` si se pudo gastar. Desde el 18/9/2026 puede devolver
   `false`: el servidor frena cuando la liga no entra en el plan o cuando se
   acabaron las diez del mes, y en ese caso NO se simula. Antes esto no podía
   fallar y por eso no devolvía nada.

   Si la red falla, la simulación sale igual: quedarse sin poder jugar porque
   no se pudo contar es peor que contar de menos. Lo que no se hace es tratar
   un "no" del servidor como si fuera un problema de red. */
async function gastarSimulacion(){
  const liga = ligaAhora();
  /* EL NÚMERO QUE IMPORTA. Meta sabe cuántos entraron y lo cobra; lo que
     no puede saber es cuántos de esos jugaron. Acá es el único lugar por
     donde pasan TODAS las simulaciones —la larga y el flash—, así que es
     el único lugar donde hay que contarlo. Va antes del pedido al
     servidor y no después: lo que se está contando es que la persona
     apretó simular, no que el servidor le dio permiso. */
  contar("simulo");
  usar("simulo");
  if(conBackend && typeof usarSimulacion === "function"){
    try{
      const r = await usarSimulacion(liga);
      if(r){ CUPO = { plan: r.plan || "gratis", usadas: r.usadas | 0,
                      hasta: r.hasta || null, ligas: r.ligas || [],
                      cobra: r.cobra }; return true; }
    }catch(e){
      const m = String(e && e.message || "");
      if(/otra liga|sin cupo/.test(m)){
        /* El servidor dijo que no. Se refresca el estado para que la pantalla
           muestre exactamente por qué, y se corta. */
        try{ const c = await miCupo();
             if(c) CUPO = { plan:c.plan||"gratis", usadas:c.usadas|0,
                            hasta:c.hasta||null, ligas:c.ligas||[], cobra:c.cobra }; }catch(x){}
        return false;
      }
    }
  }
  CUPO = { plan: CUPO.plan || "gratis", usadas: sumarLocal(liga),
           hasta: CUPO.hasta, ligas: ligasLocales() };
  return true;
}

/* `flash` es la segunda devolucion de los testers dicha dos veces: "tarda
   mucho prepararla" y "me da paja". Ninguno dijo que no se entendia:
   entendieron y no quisieron. Simula con el once y el planteo que ya vienen
   puestos y muestra el resultado sin los veinte segundos. Gasta una del cupo
   igual - una simulacion es una simulacion- y por eso el boton lleva escrito
   cuantas quedan: un toque sin querer que se come una de diez es de las
   cosas que hacen desinstalar.

   Y el aviso publicitario no se rompe: `tocaAviso` mide TIEMPO desde el
   ultimo, no simulaciones, asi que tres flashes seguidos no muestran tres
   avisos. Muestran menos, que es un problema de ingreso y no de politica. */
/* El gol esperado de un partido entre dos onces, con las perillas y las
   indicaciones que estan puestas. Antes vivia adentro de `simular11`; se
   saco para poder correrlo con OTRO once -el del DT- y comparar. */
function golEsperadoDe(xiA, xiB){
  const t=tacticas(J.K);
  /* Las líneas primero, las indicaciones después: una indicación no cambia
     quién juega, cambia a qué se dedica. Y devuelve sus propias notas, que
     es lo que permite discutir el número en vez de creerlo. */
  const tB=tacticas(J.KB);
  const ind=indicacionesDeLosDos(lineas(xiA), lineas(xiB), J.IND, J.INDB, xiA, xiB,
                                 partidoPropio() ? "vos" : "el");
  const LA=ind.A, LB=ind.B;
  /* Cada planteo pesa sobre su propio ataque y sobre el del otro. Con el
     rival en neutro, `tacticas` devuelve todo en 1 y la cuenta queda
     exactamente igual a la de antes: nada de lo viejo se movió. */
  /* `ind.regaloB` es el pelotazo DEL RIVAL: su salida directa regala la
     pelota y eso te suma gol esperado a vos, igual que el tuyo se lo suma
     a él. Faltaba porque hasta ahora el rival no tenía indicaciones. */
  const xgA=xgDe(LA,LB, J.esLocalA, t.mine*tB.theirs, bonusAncho(xiA,t.ancho))
            + tB.theirsFlat + ind.regaloB;
  const xgB=xgDe(LB,LA,!J.esLocalA, tB.mine*t.theirs, bonusAncho(xiB,tB.ancho))
            + t.theirsFlat + ind.regalo;
  return { xgA, xgB, t, ind };
}

/* ── EL ONCE DEL DT, SIMULADO ────────────────────────────────────────────
   Fausto: "armo el mio, lo simulo, armo las formaciones oficiales, simulo, y
   despues veo el resultado final". Esa es la funcion para el hincha medio:
   tres columnas -tu once, el del DT, lo que paso- y la pregunta de siempre,
   "con los mios ganabamos?", contestada con un numero.

   Faltaba el del medio: al revelar se mostraba el once del DT pero no se lo
   simulaba. Aca se arma el once del DT con los mismos jugadores del plantel
   -asi tienen su nivel-, en los puestos que dice la formacion oficial, y se
   corre la MISMA cuenta que corrio el tuyo: mismo rival, mismas perillas,
   mismas indicaciones. Lo unico que cambia es quien juega. No gasta del
   cupo: es la segunda mitad de la simulacion que ya pagaste. */
function simularOnceDelDT(once){
  if(!once || once.length < 10) return null;
  const xi = once.map(x => {
    const p = J.pool.A.find(q => q.id === x.id) ||
              J.pool.A.find(q => plano2(apellidoDe(q.nombre)) === plano2(apellidoDe(x.name)));
    /* Si no esta en el plantel -un juvenil que debuta- entra con el nivel
       medio de la liga, que es lo que el modelo sabe de el: nada. */
    const base = p || { id: x.id, nombre: x.name, pos: x.pos || "M", ratings: [], mins: 0, apar: 0 };
    return { ...base, slotCat: x.pos || base.pos || "M" };
  });
  const { xgA, xgB } = golEsperadoDe(xi, J.xiB);
  const rnd = azarDe(semillaDe(firmaDeAjustes() + "|DT"));
  const s = simular(xgA, xgB, 6000, rnd);
  s.xi = xi;
  return s;
}

/* ── EL AVISO: "salió el once del DT" ────────────────────────────────────
   Un botón, dos estados. Se muestra solo si el navegador puede recibir
   avisos y el sitio tiene la clave pública; si no, no aparece nada -un
   botón que no puede hacer lo que dice es peor que ninguno-. */
let AVISO_ON = false, avisoOcupado = false, avisoMsg = "";
async function leerAviso(){
  if(typeof avisoActivo !== "function") return;
  try{ AVISO_ON = await avisoActivo(CLUB.id); }catch(e){ AVISO_ON = false; }
  pintar();
}
function bloqueAviso(chico){
  if(typeof avisosDisponibles !== "function" || !avisosDisponibles()) return "";
  const txt = avisoOcupado ? "Un momento…"
    : AVISO_ON ? "Te avisamos cuando salga el once del DT" : "Avisame cuando salga el once del DT";
  return `<button class="${AVISO_ON ? "gh" : "acc"} baviso${chico ? " chico" : ""}" data-aviso="1"
      ${avisoOcupado ? "disabled" : ""} aria-pressed="${AVISO_ON}">
      <span class="campana" aria-hidden="true">${AVISO_ON ? "🔔" : "🔕"}</span>${txt}${
      AVISO_ON ? `<small>tocá para apagarlo</small>` : ""}</button>
    ${avisoMsg ? `<p class="aviso">${esc(avisoMsg)}</p>` : ""}`;
}
async function tocarAviso(){
  if(avisoOcupado) return;
  avisoOcupado = true; avisoMsg = ""; pintar();
  try{
    if(AVISO_ON){ await desactivarAviso(); AVISO_ON = false; avisoMsg = "Listo, sin avisos."; }
    else { await activarAviso(CLUB.id); AVISO_ON = true;
           avisoMsg = "Listo. Cuando salga el once de " + CLUB.nom + ", te llega al teléfono."; }
  }catch(e){ avisoMsg = e.message; }
  avisoOcupado = false; pintar();
}

/* ¿Ya salió el once del DT de este partido? Se mira en lo bajado, sin pedir
   nada: la ronda corta del workflow lo mete en el cache cuando aparece,
   unos sesenta minutos antes del pitazo. Vacío = todavía no. */
function hayOnceDelDT(){
  if(!J.fx) return false;
  const clave = "/fixtures/lineups?fixture=" + J.fx.fixture.id;
  const al = window.CACHE?.[clave] || onceGuardado(J.fx.fixture.id);
  return Array.isArray(al) && al.some(x => x.team?.id === J.id.A && (x.startXI||[]).length >= 10);
}

/* ── ¿ESTOS ONCES SON DE VERDAD O LOS ARMÓ LA APP? ───────────────────────
   Fausto, 19/9: "un aviso si esas formaciones ya están confirmadas o son
   tentativas al ingresar al Armá el 11 de ese partido".

   Hay una distinción que la pantalla daba por sabida y no lo es: **los once
   que se ven en la cancha SIEMPRE los armó la app**, con los que vienen
   jugando en cada equipo. Nunca son los del DT, ni siquiera cuando el DT ya
   los publicó: el once del DT se simula aparte, con el botón de abajo.

   Sin decirlo, alguien que entra media hora antes del partido puede creer
   que está mirando la formación confirmada y que la app se equivocó en
   cuatro nombres. Es la clase de malentendido que hace que una persona
   deje de confiar en todo lo demás.

   Así que el aviso dice las dos cosas: qué son los once de la cancha, y si
   el del DT ya salió o todavía no.

   Devuelve `null` cuando no hay partido —el modo suelto, sin fixture—,
   porque ahí no hay once del DT que esperar ni nada que aclarar.        */
function formacionesConfirmadas(){
  if(!J.fx) return null;
  const clave = "/fixtures/lineups?fixture=" + J.fx.fixture.id;
  const al = window.CACHE?.[clave] || onceGuardado(J.fx.fixture.id);
  if(!Array.isArray(al)) return 0;
  /* Diez y no once: la API a veces publica el once sin el arquero cargado
     todavía, y esperar al jugador número once dejaría el aviso en
     "tentativa" con la formación ya en la calle. */
  const tiene = id => al.some(x => x.team?.id === id && (x.startXI||[]).length >= 10);
  return (tiene(J.id.A) ? 1 : 0) + (tiene(J.id.B) ? 1 : 0);
}

/* ── "ESTO QUE ESTÁS VIENDO ES DE ANTEAYER" ──────────────────────────────
   Solo adentro de la app de iPhone, y solo cuando corresponde.

   El .ipa viaja con una foto de los datos del día que se compiló, y se
   pone al día contra armael11.com al abrir. Si no hubo red —un iPhone
   recién instalado en modo avión, que es exactamente como lo prueba el
   revisor de Apple— lo que se muestra es la foto, y puede tener una fecha
   ya jugada.

   Mostrar eso como si fuera lo de ahora es la misma confusión que
   arreglamos con el aviso de formaciones tentativas: la persona no piensa
   "los datos están viejos", piensa "la app se equivoca". Y una vez que
   pensó eso, deja de creerle también a lo que sí está bien.

   En la web esto no existe: los archivos los baja el navegador cada vez.  */
function avisoDeLaFoto(){
  try{
    if(typeof fechaDeLosDatos !== "function" || typeof datosViejos !== "function") return "";
    const f = fechaDeLosDatos();
    if(!datosViejos(f, Date.now())) return "";
    const d = new Date(f);
    const cuando = DIAS_CORTOS[d.getDay()] + " " +
      String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
    return `<div class="pendiente" style="margin:12px 0 0">
      <b>Datos del ${cuando}.</b>
      No me pude conectar para actualizarlos, así que los partidos y los
      planteles son los de esa fecha. Con conexión se ponen al día solos.</div>`;
  }catch(e){ return ""; }
}

function avisoDeFormaciones(){
  if(!J.fx) return "";
  const losArmoLaApp = "los armó la app con los que vienen jugando; " +
    "los podés cambiar jugador por jugador.";
  const dt = J.delDT || { A:false, B:false };

  /* Los dos reales: no hay nada que aclarar sobre cómo se armaron, porque
     no los armamos nosotros. Lo que sí hay que decir es qué se puede hacer
     con ellos, que es la gracia. */
  if(dt.A && dt.B) return `<div class="pendiente salio" style="margin:12px 0 0">
      <b>Estos son los once que pusieron los DT.</b>
      Las dos formaciones están confirmadas y la cancha arranca con ellas.
      Cambiá lo que vos cambiarías y simulá.</div>`;

  /* Uno sí y otro no es el caso incómodo: en la misma cancha conviven un
     once real y uno armado por la app. Decir cuál es cuál —con nombre y
     apellido del equipo— es lo único que evita que el de la app pase por
     confirmado. */
  if(dt.A || dt.B){
    const real = dt.A ? "A" : "B", otro = dt.A ? "B" : "A";
    return `<div class="pendiente salio" style="margin:12px 0 0">
      <b>Salió el once de ${esc(nombreCorto(real))}.</b>
      Ese es el que puso el DT y es el que está en la cancha. El de
      ${esc(nombreCorto(otro))} todavía no salió: ${losArmoLaApp}</div>`;
  }

  return `<div class="pendiente" style="margin:12px 0 0">
      <b>Formaciones tentativas.</b>
      Los once de la cancha ${losArmoLaApp} El que pone el DT sale alrededor
      de una hora antes del partido, y cuando salga la cancha va a arrancar
      con ese.</div>`;
}

/* Lo que va al pie de la tarjeta del resultado, segun el momento:
     jugado            → revelar el once del DT y lo que paso
     por jugar, salio  → simular el once del DT (y guardar el link)
     por jugar, no     → explicar que sale una hora antes (y guardar el link) */
function pieDelResultado(){
  if(!J.fx) return "";
  if(J.jugado){
    /* En las otras ligas el once del DT solo existe si la ronda corta lo
       alcanzó a bajar, y se poda a las 24 horas. Ofrecer el botón sin eso
       es ofrecer un error: el resultado real ya está arriba, a la vista. */
    if(J.liga && !onceGuardado(J.fx.fixture.id)) return "";
    return `<button class="acc" id="brev" style="width:100%;margin-top:12px">
      Revelar el once del DT y lo que pasó</button>`;
  }
  const link = (clase) => `<button class="${clase}" id="bguardar" style="width:100%;margin-top:10px">
      Copiar el link de mi pronóstico</button><p class="aviso" id="avisoLink"></p>`;
  /* CAMBIÓ EL SENTIDO DE ESTE BOTÓN. Antes el once del DT estaba escondido
     y esto lo traía a la pantalla. Ahora la cancha YA arranca con él, así
     que "simular el once del DT" solo dice algo si vos lo tocaste: es tu
     versión contra la original. Si no cambiaste nada, las dos simulaciones
     serían la misma y ofrecerla sería un botón que miente. */
  if(hayOnceDelDT()){
    const tocaste = (J.delDT || {}).A &&
      J.xiA.filter(Boolean).some(p => !(J.auto.xiA || []).includes(p.id));
    return `<div class="pendiente salio" style="margin-top:12px">
      <b>${(J.delDT || {}).A ? "En la cancha está el once del DT."
                             : "¡Salió el once del DT!"}</b>
      Todavía no se jugó${(J.delDT || {}).A
        ? ", pero la formación ya es la de verdad." : ", pero la formación ya está."}
      ${tocaste ? "Compará tu versión contra la que puso él."
                : "Cambiá lo que cambiarías y simulá."}</div>
    ${tocaste || !(J.delDT || {}).A
      ? `<button class="acc" id="brev" style="width:100%;margin-top:10px">Simular el once del DT</button>`
      : ""}
    ${J.liga ? "" : link("gh")}`;
  }
  /* En una liga que no es la de tu club no va el aviso al teléfono -los
     avisos son por club, nadie se suscribió al Bayern- ni el link del
     pronóstico, que guarda el club de la página y volvería con otro partido.
     Queda lo único que sí se puede hacer acá: esperar el once. */
  if(J.liga) return `<div class="pendiente" style="margin-top:12px">
      <b>Este partido todavía no se jugó.</b><br>
      El once del DT sale una hora antes: cuando aparezca, la cancha va a
      arrancar con ese y vas a poder cambiar lo que cambiarías.</div>`;
  return `<div class="pendiente" style="margin-top:12px">
      <b>Este partido todavía no se jugó.</b><br>
      El once del DT sale una hora antes: cuando aparezca, la cancha va a
      arrancar con ese. Y cuando termine, vas a ver el resultado de verdad.</div>
    ${bloqueAviso(false)}
    ${link(AVISO_ON ? "acc" : "gh")}`;
}

/* Cuanta probabilidad le daba cada simulacion a LO QUE PASO. Es la vara
   justa para decir quien leyo mejor el partido: no "acerto el ganador", que
   con tres resultados posibles es casi una moneda, sino cuanto se jugo por
   el resultado que finalmente se dio. */
function leyoMejor(sim, misG, susG){
  if(!sim) return null;
  return misG > susG ? sim.win : misG === susG ? sim.draw : sim.loss;
}

async function simular11(flash){
  if(J.animando) return;

  /* El freno, antes de gastar nada. Con `bloquea` apagado esto nunca corta;
     el mensaje aparece igual cuando se pasó del tope, así la persona sabe
     que hay un tope antes de que empiece a existir. */
  /* ── NADA CAMBIO, NADA QUE SIMULAR ────────────────────────────────────
     El video del tester: doce veces "Simular" sin tocar nada, doce marcadores
     distintos, y la conclusion obvia -"es un dado"-. Con la semilla puesta
     los porcentajes ya salen identicos, pero ademas no tiene sentido cobrar
     una simulacion por repetir la misma cuenta. Asi que si no cambio nada y
     se pide solo el resultado, no se simula: se explica. El que quiere VER
     otro de los 6.000 partidos posibles tiene el otro boton, y ese si es
     otro partido. */
  const firma = firmaDeAjustes();
  if(flash && J.sim && J.ultimaFirma === firma){
    J.err = "";
    J.msg = "No cambiaste nada desde la última simulación, así que el resultado es el mismo: " +
            "con los mismos datos el modelo da los mismos números. Movés una perilla, un jugador " +
            "o la formación y volvés a simular. Si querés ver cómo se juega uno de los 6.000 " +
            "partidos posibles, elegí «Ver el partido».";
    pintar();
    setTimeout(()=>document.querySelector(".res")?.scrollIntoView({behavior:"smooth",block:"center"}),60);
    return;
  }

  const antes = estadoCupo({ ...CUPO, bloquea: frenaElCupo(), liga: ligaAhora() });
  if(!antes.puedeSimular){
    J.err = textoCupo(antes, CUPO.hasta, ligaAhora()) + " Mirá los planes acá abajo para seguir.";
    pintar();
    document.getElementById("cuenta")?.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }

  /* Si el servidor dice que no, no se simula. Pasa cuando la pantalla tenía
     una foto vieja del cupo —otra pestaña, otro teléfono— y es justamente el
     caso en el que el cliente no puede ser el que decide. */
  if(!await gastarSimulacion()){
    const ahora = estadoCupo({ ...CUPO, bloquea: true, liga: ligaAhora() });
    J.err = textoCupo(ahora, CUPO.hasta, ligaAhora()) + " Mirá los planes acá abajo para seguir.";
    pintar();
    document.getElementById("cuenta")?.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  await momentoDeAviso();
  const { xgA, xgB, t, ind } = golEsperadoDe(J.xiA, J.xiB);

  const d=J.desde, empezado=d.minuto>0||d.golesA||d.golesB||d.rojasA||d.rojasB;

  /* El resto del partido se juega con el gol esperado ya recortado por el
     tiempo que queda y por las expulsiones. Así lo que se ve en pantalla y
     lo que dice la barra salen de la misma cuenta. */
  const resto=(90-d.minuto)/90;
  let ax=xgA*resto, bx=xgB*resto;
  for(let i=0;i<d.rojasA;i++){ ax*=ROJA.ataca; bx*=ROJA.concede; }
  for(let i=0;i<d.rojasB;i++){ bx*=ROJA.ataca; ax*=ROJA.concede; }

  /* El partido se sortea ACA, se mire o no. Queda guardado para poder verlo
     despues sin volver a gastar. */
  J.partido = generarPartido(ax, bx, empezado ? d : null);
  J.visto = false;

  const cerrar = marc => {
    J.animando=false;
    /* Con semilla: los mismos ajustes dan los mismos porcentajes. */
    const rnd = azarDe(semillaDe(firma));
    J.sim = empezado
      ? simDesde({ xgA, xgB, minuto:d.minuto, golesA:d.golesA, golesB:d.golesB,
                   rojasA:d.rojasA, rojasB:d.rojasB,
                   faltanA:puestosQueFaltan("A"), faltanB:puestosQueFaltan("B"), rnd })
      : simular(xgA, xgB, 6000, rnd);
    J.ultimaFirma = firma;
    /* Las del rival van con el nombre del equipo adelante. Sin eso, "carga
       sobre el lado más flojo del rival" en la misma lista que las tuyas se
       lee como si la hubieras dado vos, y dice lo contrario de lo que pasa. */
    /* Sin `esc` acá: la pantalla ya escapa cada nota al pintarla, y
       escapar dos veces deja "Newell&amp;s" a la vista. */
    /* Se siguen calculando y guardando, y no se pintan abajo del resultado:
       son aclaraciones sobre el motor y desde el 20/9 eso no va ahí. Quedan
       en `J.sim.notas` porque cuestan cero y porque el día que haya una
       pantalla de "por qué este número" —una, en otro lado, para el que la
       busque— el dato ya está calculado. */
    const suyas = (ind.notasB || []).map(n => nombreCorto("B") + ": " + n);
    J.sim.notas=[...t.notas, ...ind.notas, ...suyas];
    J.sim.estaVez=marc;
    J.sim.ajustes=ajustes(); J.sim.conQue=conQue(J.sim.ajustes);
    J.paso="resultado"; pintar();
    setTimeout(()=>document.querySelector(".res")?.scrollIntoView({behavior:"smooth",block:"center"}),90);
  };

  if(flash) return cerrar(J.partido.marc);

  J.animando=true; J.visto=true;
  const b=$("bsim"); if(b){ b.disabled=true; b.textContent="Jugando…"; }
  /* Mientras se ve el partido, la caja pegada al pie taparia el tanteador
     del campo. Se suelta: no hay nada que apretar hasta que termine. */
  document.querySelector(".simbox")?.classList.add("jugando");
  document.getElementById("campo")?.scrollIntoView({behavior:"smooth",block:"center"});
  mostrarPartido(J.partido, cerrar);
}

/* Volver a ver el MISMO partido. No gasta nada y no vuelve a calcular: los
   porcentajes y el xG que ya estan en pantalla no se mueven, porque el
   partido es el mismo. Lo unico que cambia es que ahora se ve. */
function verElPartido(){
  if(J.animando || !J.partido) return;
  J.animando=true; J.visto=true;
  document.querySelector(".simbox")?.classList.add("jugando");
  document.getElementById("campo")?.scrollIntoView({behavior:"smooth",block:"center"});
  mostrarPartido(J.partido, () => { J.animando=false; pintar(); });
}

async function revelar(){
  /* El segundo momento: las formaciones confirmadas. Es una simulación más
     —cuenta para el reloj— pero casi siempre cae horas después de la
     primera, así que el aviso sale. El resumen con el resultado, no: eso se
     ve gratis siempre. */
  await momentoDeAviso();
  J.err=""; J.msg=J.jugado ? "Buscando el once del DT y lo que pasó…" : "Buscando el once del DT…"; pintar();
  try{
    /* ANTES DEL PARTIDO no hay eventos ni goles: solo la formación. Es el
       momento con más gracia -"salió el once, ¿con los míos ganábamos?"- y
       antes no se podía porque el sitio recién tenía la formación después
       del partido. Ahora la ronda corta la trae una hora antes. */
    /* LOS EVENTOS SON OPCIONALES, EL ONCE NO. En las otras ligas lo único
       bajado es el once del DT: no hay eventos, y sin API key pedirlos tira
       "por ahora están cargados…". Con `Promise.all` ese error se llevaba
       puesto al once, que sí estaba, y el revelado entero fallaba. Ahora
       los eventos que no se pueden traer son una lista vacía: se revela el
       once igual y lo único que falta son las expulsiones. */
    const [al,ev]=await Promise.all([
      api("/fixtures/lineups",{fixture:J.fx.fixture.id}),
      J.jugado ? api("/fixtures/events",{fixture:J.fx.fixture.id}).catch(()=>[])
               : Promise.resolve([]),
    ]);
    const mio=al.find(x=>x.team.id===J.id.A);
    if(!mio || !(mio.startXI||[]).length)
      throw new Error(J.jugado ? "Todavía no tengo la formación de este partido."
        : "El once del DT todavía no salió. Suele aparecer una hora antes del partido; volvé a entrar un rato antes.");
    const rojas=(ev||[]).filter(e=>e.type==="Card"&&/Red/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed||45, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const penales=(ev||[]).filter(e=>e.type==="Goal"&&/Missed Penalty/i.test(e.detail))
      .map(e=>({min:e.time?.elapsed, esMio:e.team.id===J.id.A, quien:e.player?.name}));
    const g=J.fx.goals, misG=J.esLocalA?g.home:g.away, susG=J.esLocalA?g.away:g.home;
    J.real={ once:(mio?.startXI||[]).map(x=>x.player), formacion:mio?.formation,
      misG, susG, rojas, penales, pendiente: !J.jugado,
      simConRojas: rojas.length? simExpulsion(J.sim.xgA,J.sim.xgB,rojas) : null };
    J.real.simDT = simularOnceDelDT(J.real.once);
    J.msg=""; J.paso="revelado";
  }catch(e){ J.err=e.message; J.msg=""; }
  pintar();
}

/* ── LA CANCHA ────────────────────────────────────────────────────────────
   Los dos equipos en el MISMO campo, como en PC Fútbol: el tuyo abajo
   atacando para arriba, el rival arriba atacando para abajo. Tocás un
   globito y elegís quién lo ocupa.                                       */
function coordsDe(form, arriba){
  const slots=slotsDe(form), filas=slots.length, out=[];
  /* LOS DOS EQUIPOS NO PUEDEN CAER EN LA MISMA COLUMNA. Con la misma
     formación de los dos lados —4-3-3 contra 4-3-3 es lo más común— las x
     salían idénticas, y cuando las líneas se cruzaban los globitos quedaban
     uno EXACTAMENTE encima del otro: dos nombres superpuestos, ilegibles,
     que parecen un error de dibujo.

     Tres puntos y medio de corrimiento alcanzan para que se vean los dos y
     además queda más real: un marcador no se para arriba del delantero, se
     para al lado. */
  const corrido = arriba ? 3.5 : -3.5;
  slots.forEach((l,i)=>{
    const t=i/(filas-1);
    const y = arriba ? 7 + t*36 : 93 - t*36;
    for(let j=0;j<l.n;j++)
      out.push({ x:(j+1)/(l.n+1)*100 + corrido, y, cat:l.cat });
  });
  return out;
}
/* ── LAS PERILLAS SE TIENEN QUE VER EN LA CANCHA ─────────────────────────
   Hasta acá movían el resultado y nada más: subías la línea, cambiaban las
   probabilidades y los once puntos seguían exactamente donde estaban. Un
   hincha que mueve "línea alta" espera ver a los defensores subir, y si no
   los ve, la perilla no significa nada.

   Se mueve SOLO tu equipo. El rival no tiene por qué reacomodarse porque vos
   toques una perilla tuya, y además así se ve claro qué cambiaste.       */
function ajustarTactica(coords, arriba, K){
  const lin=(K.linea||0)/100, pre=(K.presion||0)/100, anc=(K.ancho||0)/100;
  const dir = arriba ? 1 : -1;                       // hacia el arco rival
  const campo = coords.filter(c => c.cat !== "G");
  const cy = campo.reduce((a,c)=>a+c.y,0) / Math.max(1, campo.length);

  /* Adónde puede llegar cada uno. No es cosmética: sin topes, con la línea
     al máximo los delanteros se meten en el área rival y con la línea al
     mínimo el arquero se va abajo del borde de la cancha.              */
  const banda   = arriba ? [12, 60] : [40, 88];      // los de campo
  const bandaGK = arriba ? [6, 15]  : [85, 94];

  /* La y que le tocaría a cada uno según las perillas. */
  const ys = coords.map(c => {
    if(c.cat === "G") return c.y + dir*lin*4;
    /* La línea sube o baja el bloque entero. */
    let y = c.y + dir*lin*13;
    /* La presión junta las líneas entre sí y adelanta un poco: un equipo
       que presiona alto es un equipo CORTO, no solo adelantado.       */
    return cy + (y - cy) * (1 - 0.30*pre) + dir*pre*6;
  });

  /* ── El bloque se corre entero ────────────────────────────────────────
     Recortar a cada jugador por separado aplastaba las líneas una contra
     otra: con la línea al mínimo, defensores y volantes terminaban todos
     pegados al tope y encimados. Un equipo que no entra en la cancha
     retrocede completo y conserva su forma.                           */
  const deCampo = ys.filter((_, i) => coords[i].cat !== "G");
  const sobra = Math.max(0, Math.max(...deCampo) - banda[1]);
  const falta = Math.max(0, banda[0] - Math.min(...deCampo));
  const corrimiento = sobra - falta;

  return coords.map((c, i) => {
    const arquero = c.cat === "G";
    const b = arquero ? bandaGK : banda;
    const y = Math.max(b[0], Math.min(b[1], ys[i] - (arquero ? 0 : corrimiento)));
    /* El ancho abre a los de afuera y junta a los del medio. */
    const x = arquero ? c.x : 50 + (c.x - 50) * (1 + 0.38*anc);
    return { ...c, x: Math.max(8, Math.min(92, x)), y };
  });
}

/* Mueve los puntos que ya están en pantalla, sin repintar: si repintáramos
   la vista entera en cada movimiento del dedo, el slider perdería el foco. */
function colocarJugadores(){
  const campo=$("campo"); if(!campo || J.animando) return;
  const cA=ajustarTactica(coordsDe(J.formA,false), false, J.K);
  const cB=coordsDe(J.formB,true);
  campo.querySelectorAll(".jug").forEach(el=>{
    const c=(el.dataset.lado==="A"?cA:cB)[+el.dataset.slot];
    if(!c) return;
    el.style.left=c.x+"%"; el.style.top=c.y+"%";
  });
}

const apellido = nom => { const w=String(nom||"").trim().split(/\s+/); return w[w.length-1]||"—"; };

/* ── QUIÉN NO ESTÁ EN LA CANCHA ──────────────────────────────────────────
   Fausto, 20/9/2026: "no es lo mismo simular si echaron un defensor, pero
   con los cambios queda jugando con un delantero menos, que quedar jugando
   con uno menos en abstracto".

   `J.desde.faltanA` guarda ids y no puestos: el id es lo que permite decir
   el nombre y apagar el globito. El puesto se deduce del once, que es donde
   vive la verdad de en qué línea jugaba.

   IMPORTANTE, Y NO ES OBVIO: al que falta NO se lo saca de `J.xiA`. Las
   líneas se calculan con el once completo y el golpe de jugar con uno menos
   lo pone `ROJA`, que está MEDIDO. Si además lo sacáramos del promedio de su
   línea, el golpe se contaría dos veces — y peor: como `lineas` promedia,
   sacar al PEOR defensor MEJORARÍA la defensa, que es exactamente al revés.
   El once queda entero para la cuenta y el hueco se dibuja aparte.      */
function faltan(lado){
  const l = (J.desde && J.desde["faltan" + lado]) || [];
  return Array.isArray(l) ? l : [];
}
function estaAfuera(lado, id){ return id != null && faltan(lado).includes(id); }

/* Los PUESTOS de los que faltan, que es lo único que mira el motor. */
function puestosQueFaltan(lado){
  const xi = J["xi" + lado] || [];
  return faltan(lado).map(id => {
    const p = xi.find(x => x && x.id === id);
    return p ? (p.slotCat || p.pos || null) : null;
  });
}

/* Los que se pueden sacar: el once menos el arquero. Si al arquero lo
   echaron, entra el suplente y sale un jugador de campo — el hueco que
   queda es el de ESE. Es justo lo que decía Fausto, y por eso el arquero no
   está en la lista. */
function candidatosAFaltar(lado){
  return (J["xi" + lado] || []).filter(p => p && p.slotCat !== "G");
}

const PUESTO_LARGO = { G:"arquero", D:"defensor", M:"volante", F:"delantero" };

/* ── ELEGIR AL QUE NO ESTÁ ───────────────────────────────────────────────
   Aparece solo cuando ese equipo tiene un expulsado. Es OPCIONAL: si no
   elegís a nadie, la cuenta sale igual que siempre, con el promedio medido.
   Elegir no agrega precisión falsa, agrega la que tenés vos.

   El arquero no está en la lista, y ese es el punto entero: si al que
   echaron fue al arquero, entra el suplente y sale un jugador de campo. El
   hueco en la cancha es el de ese, y ese es el que se elige acá.       */
function quienFaltaHTML(lado){
  const rojas = lado === "A" ? J.desde.rojasA : J.desde.rojasB;
  if(!rojas) return "";
  const cands = candidatosAFaltar(lado);
  if(!cands.length) return "";
  const elegidos = faltan(lado);
  const quien = cands.find(p => elegidos.includes(p.id));
  const titulo = partidoPropio()
    ? (lado === "A" ? "¿Quién no está en tu equipo?" : "¿Quién no está en el rival?")
    : "¿Quién no está en " + esc(nombreCorto(lado)) + "?";
  return `<div style="margin-top:12px">
    <label>${titulo}</label>
    <nav class="filtros" style="padding-bottom:4px">
      <button class="chip" data-falta="${lado}" data-faltaid="0"
        aria-pressed="${!quien}">No lo digo</button>
      ${cands.map(p=>`<button class="chip" data-falta="${lado}" data-faltaid="${p.id}"
        aria-pressed="${quien && quien.id===p.id}">${esc(apellido(p.nombre))}<small
        style="opacity:.7"> ${p.slotCat}</small></button>`).join("")}
    </nav>
    <p class="aviso" style="margin:0">${quien
      ? "Juegan sin " + esc(apellido(quien.nombre)) + ", que es " +
        PUESTO_LARGO[quien.slotCat] + ": el golpe pega más " +
        (quien.slotCat === "D" ? "atrás que adelante."
         : quien.slotCat === "F" ? "adelante que atrás."
         : "parejo, que es el promedio.")
      : "Sin elegir a nadie se usa el promedio de todas las expulsiones."}</p>
  </div>`;
}

function campoHTML(){

    <div class="ln" style="left:38%;right:38%;bottom:-2px;height:5%"></div>
    ${cB.map((c,i)=>globo(J.xiB[i],c,"B",i)).join("")}

    <div class="gol" id="golazo">¡GOL!</div>
  </div>
  <div class="equipos">
    <span class="e"><span class="pt" style="background:${CLUB.color}"></span><span class="nm">${esc(J.nom.A)}</span><b class="tanto" id="golA" hidden>0</b></span>
    <div class="reloj" id="reloj" hidden>0'</div>

/* ══════════════════ EL LUGAR DEL AVISO ══════════════════
   Acá NO hay publicidad. Hay un LUGAR donde algún día va a haber una, y las
   reglas de cuándo corresponde mostrarla. Está separado a propósito:

   · Hoy `SITIO.publicidad` no existe, así que `hayRed()` da falso, esto
     resuelve en el acto y la app sigue sin cargar un solo script de terceros
     —que es una propiedad del proyecto y tiene una prueba que la cuida.
   · Cuando entre la red, se enchufa en UN lugar y las reglas de abajo ya
     están escritas y probadas. Las reglas son la parte difícil; el script de
     Google es la parte fácil.

   LAS REGLAS, y por qué cada una:

   1. UNA CADA SESENTA SEGUNDOS DE RELOJ DE PARED. No es una elección
      nuestra: es el mínimo que impone AdSense entre dos avisos. Lo
      replicamos acá para que la app sepa lo mismo que sabe Google y no
      prometa un aviso que no va a salir. Como la simulación dura veinte
      segundos, esto da un aviso cada tres simulaciones sin programar nada
      más — y de paso cumple sola la política de AdMob, que permite como
      mucho uno cada dos acciones.

   2. LA PRIMERA SIMULACIÓN NUNCA LLEVA AVISO. La primera vez que alguien
      aprieta el botón está decidiendo si esta app le gusta. Cobrarle un
      aviso ahí vale centavo y medio y cuesta un usuario.

   3. EL RELOJ VIVE EN EL TELÉFONO, no en memoria. Si viviera en memoria,
      recargar la página lo pondría en cero y dos avisos podrían salir
      seguidos. Si el navegador no deja guardar nada, se falla hacia el lado
      de NO mostrar: perder un aviso es barato, mostrar dos seguidos es una
      infracción.                                                          */
const AVISO = { LLAVE:"armaEl11.ultimoAviso", ESPERA:60000, CADA:2,
                DURACION_SIM:20000, DURACION_PAGA:6000 };

/* ── QUÉ SE COMPRA, EXACTAMENTE ──────────────────────────────────────────
   Los veinte segundos SON el aviso: son el rato durante el cual la app
   puede mostrar uno sin interrumpir nada. Por eso lo que se vende es
   sacarlos, y por eso las dos cosas —la espera y el aviso— salen del mismo
   lugar y no pueden quedar desacopladas. Un premium que no ve avisos pero
   igual espera veinte segundos no compró nada.

   `PREMIUM.activo` lo pone `arrancarCuenta` leyendo la base, y se compara
   contra el reloj del teléfono, que se puede mover. Eso está bien acá: lo
   único que decide es cuánto dura una animación. Lo que de verdad importa
   —hasta cuándo pagó— lo tiene el servidor.                              */
let PREMIUM = { activo:false, hasta:null };
const duracionSim = () => PREMIUM.activo ? AVISO.DURACION_PAGA : AVISO.DURACION_SIM;

const hayRed = () => !!(window.SITIO && window.SITIO.publicidad);
function ultimoAviso(){
  try{ return +localStorage.getItem(AVISO.LLAVE) || 0; }catch(e){ return Infinity; }
}
function anotarAviso(t){
  try{ localStorage.setItem(AVISO.LLAVE, String(t)); }catch(e){}
}
let simulacionesHechas = 0;
/* Simulaciones desde el último aviso. En memoria y no en disco a propósito:
   al recargar vuelve a cero, y eso falla hacia MENOS avisos, que es el lado
   barato de equivocarse. */
let simsDesdeAviso = 0;

/* ══════════════════ EL CUPO DE SIMULACIONES ══════════════════════════════
   Diez por mes son gratis y llevan publicidad. De ahí en adelante hay que
   tener un plan: 40, 100 o sin límite.

   DOS ACLARACIONES QUE CONVIENE TENER ESCRITAS, porque cambian cómo se
   cuenta esto en pantalla:

   1. UNA SIMULACIÓN NO CUESTA NADA. Corre en el teléfono, con datos que ya
      están bajados. El tope no está recuperando un costo: separa al que le
      saca jugo del que pasa a mirar. Es una razón perfectamente buena para
      cobrar — pero es esa, así que la pantalla no dice "el servidor se
      satura", porque sería mentira y alguien lo iba a notar.

   2. EL QUE NO TIENE CUENTA SE CUENTA EN EL NAVEGADOR, y eso se esquiva
      borrando los datos del sitio. Está bien que se esquive: bloquear al
      anónimo con algo serio significaría pedirle cuenta para simular una
      vez, y eso ahuyenta justo al que todavía no sabe si le gusta. El que
      quiere que le cuenten bien, entra.

   `bloquea` viene de sitio.json y hoy está en false: durante la prueba
   cerrada el contador CUENTA Y SE MUESTRA pero no frena a nadie. Un tester
   frenado a la mitad no puede probar nada, y catorce días son catorce días.
   Se prende cambiando un booleano.                                       */
const CUPO_CFG = Object.assign({ gratis: 10, bloquea: false, cobrando: false },
                               (window.SITIO && window.SITIO.cupo) || {});
/* ── 18/9/2026: SE VENDEN LIGAS, NO CANTIDAD ─────────────────────────────
   Simular no cuesta nada, así que cobrar por cantidad cobraba por algo que
   no existe y castigaba al que más usa la app. Ahora lo gratis son diez por
   mes EN UNA LIGA, y los planes abren una, tres o todas.

   Cuál es "tu liga" no se elige en ninguna pantalla: es la primera que
   simulás en el período y queda tomada hasta que el período termina. Sin
   selector y sin arrepentimiento. El que paga tres las va tomando a medida
   que las usa.

   El que manda es el servidor: `sumar_simulacion` corta con `otra liga` o
   `sin cupo` y no gasta nada. Esto de acá es para que la pantalla lo diga
   ANTES y no después de un error.                                        */
const TOPES = { gratis: CUPO_CFG.gratis, liga: Infinity, tres: Infinity, todas: Infinity };
const LIGAS_DEL_PLAN = { gratis: 1, liga: 1, tres: 3, todas: 99 };
const LLAVE_CUPO = "armaEl11.cupo";

/* Pura, para poder probarla con casos concretos. `liga` es la que se está
   por simular; sin ella —una pantalla que solo muestra el contador— no se
   juzga ninguna liga. */
/* El freno lo decide la BASE, no el zip: `mi_cupo` y `sumar_simulacion`
   devuelven `cobra`, que sale de una fila que se cambia con una linea de SQL
   el dia que Google apruebe el paquete con su facturacion. Hasta que eso
   pase, frenar a alguien adentro de la app seria ponerle una puerta sin
   llave. `sitio.json` queda solo como respaldo para cuando todavia no hubo
   ninguna respuesta del servidor. */
const frenaElCupo = () => (CUPO && CUPO.cobra != null) ? !!CUPO.cobra : CUPO_CFG.bloquea;

function estadoCupo({ plan, usadas, bloquea, ligas, liga }){
  const tope = TOPES[plan] ?? TOPES.gratis;
  const ilimitado = tope === Infinity;
  const quedan = ilimitado ? Infinity : Math.max(0, tope - usadas);
  const topeLigas = LIGAS_DEL_PLAN[plan] ?? 1;
  const tomadas = Array.isArray(ligas) ? ligas.filter(Boolean) : [];
  const yaEsta = !liga || tomadas.includes(liga);
  const entraLiga = yaEsta || tomadas.length < topeLigas;
  return {
    plan, tope, usadas, quedan, ilimitado,
    seAcabo: !ilimitado && quedan === 0,
    tomadas, topeLigas, entraLiga, yaEsta,
    libresDeLiga: Math.max(0, topeLigas - tomadas.length),
    /* Con el freno apagado se puede simular igual: lo único que cambia es
       que la pantalla avisa que se pasó. El freno de la liga va junto: si
       uno frena y el otro no, la pantalla y el servidor dicen cosas
       distintas, que es peor que cualquiera de las dos. */
    puedeSimular: (ilimitado || quedan > 0 || !bloquea) && (entraLiga || !bloquea),
  };
}

/* ── EL CICLO NO ES EL MES DEL CALENDARIO ────────────────────────────────
   Primero esto se contaba por mes calendario y estaba mal de una forma que
   se ve sola con un ejemplo: el que compraba el 30 se llevaba cuarenta
   simulaciones por un día, y el 1 le entraban cuarenta más. Un plan que se
   paga el 20 dura hasta el 20 del mes que viene.

   EL ANCLA es el día del pago; para el que nunca pagó, el día que empezó a
   usar la app. El ciclo se calcula SIEMPRE desde el ancla sumando meses
   enteros, nunca sumándole un mes al ciclo anterior. La diferencia aparece
   con los días 29, 30 y 31: el 31 de enero más un mes es el 28 de febrero,
   y sumando de a uno ese 28 se quedaría clavado para siempre. Contando
   desde el ancla, marzo vuelve a caer 31. Es la misma cuenta que hace
   Postgres del otro lado, y tiene que serlo: si las dos no coinciden, el
   contador que muestra la pantalla no es el que cuenta el servidor.      */
function sumarMeses(d, n){
  const dia = d.getDate();
  const r = new Date(d.getTime());
  r.setDate(1);
  r.setMonth(r.getMonth() + n);
  const ultimo = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(dia, ultimo));
  return r;
}

function inicioDeCiclo(ancla, ahora = new Date()){
  const a = new Date(ancla);
  let n = (ahora.getFullYear() - a.getFullYear()) * 12 +
          (ahora.getMonth() - a.getMonth());
  if(sumarMeses(a, n) > ahora) n--;
  return sumarMeses(a, Math.max(0, n));
}

/* La fecha EN LA ZONA DEL TELÉFONO, no en UTC. Con `toISOString`, alguien en
   Madrid que abre la app a las 00:30 del día 20 tendría guardado el 19: la
   conversión a UTC le corre el día para atrás. El ciclo de una persona tiene
   que ser el día que esa persona ve en su calendario. */
const enDia = d => d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");

/* El contador del que no tiene cuenta. Guarda el ancla —el día de su primera
   simulación— junto al ciclo que está corriendo: al cambiar de ciclo vuelve
   a cero solo, sin ninguna tarea programada. */
function guardadoLocal(){
  try{ return JSON.parse(localStorage.getItem(LLAVE_CUPO) || "{}") || {}; }
  catch(e){ return {}; }
}
function usoLocal(){
  const g = guardadoLocal();
  if(!g.ancla) return 0;
  return g.ciclo === enDia(inicioDeCiclo(new Date(g.ancla))) ? (g.usadas | 0) : 0;
}
/* Hasta cuándo corre el ciclo del que no tiene cuenta. Sin esto, el que
   vuelve al día siguiente ve el contador bien y la fecha vacía. */
function hastaLocal(){
  const g = guardadoLocal();
  if(!g.ancla) return null;
  return enDia(sumarMeses(inicioDeCiclo(new Date(g.ancla)), 1));
}
/* Las ligas que tomó en este ciclo el que no tiene cuenta. Mismo criterio
   que el contador: vale mientras el ciclo sea el mismo. */
function ligasLocales(){
  const g = guardadoLocal();
  if(!g.ancla) return [];
  return g.ciclo === enDia(inicioDeCiclo(new Date(g.ancla))) && Array.isArray(g.ligas)
    ? g.ligas : [];
}
function sumarLocal(liga){
  const g = guardadoLocal();
  const ancla = g.ancla ? new Date(g.ancla) : new Date();
  const usadas = usoLocal() + 1;
  const ciclo = inicioDeCiclo(ancla);
  const ligas = ligasLocales();
  if(liga && !ligas.includes(liga)) ligas.push(liga);
  try{ localStorage.setItem(LLAVE_CUPO, JSON.stringify({
       ancla: ancla.toISOString(), ciclo: enDia(ciclo), usadas, ligas })); }catch(e){}
  CUPO.hasta = enDia(sumarMeses(ciclo, 1));
  return usadas;
}

/* Arranca con lo que sepa el navegador. Si hay cuenta, `arrancarCuenta` lo
   pisa con lo que dice la base, que es lo que vale. */
let CUPO = { plan:"gratis", usadas: usoLocal(), hasta: hastaLocal(), ligas: ligasLocales() };

/* "hasta el 20 de octubre" y no "el 1 de cada mes": el ciclo arranca el día
   que se pagó, así que la fecha es distinta para cada persona y hay que
   decirla, no darla por sabida. */
/* `diaDe` ya existe y sirve para el feed: dice "Hoy", "Ayer", "Martes". Acá
   hace falta lo contrario —una fecha futura, siempre con día y mes—, así que
   va con su propio nombre en vez de agrandar aquella con un modo. */
const diaFuturo = iso => {
  if(!iso) return "";
  const d = new Date(iso + (String(iso).length === 10 ? "T12:00:00" : ""));
  return isNaN(d) ? "" : d.toLocaleDateString("es-AR", { day:"numeric", month:"long" });
};

/* El nombre de la liga tal como se ve, a partir del slug. Si no está bajada
   —o si se está simulando el club propio— se dice "tu liga", que es lo que
   la persona entiende igual. */
const nombreDeLiga = slug => {
  const L = (window.LIGAS || {})[slug];
  return L ? L.pais : (slug === "argentina" ? "Argentina" : "tu liga");
};
const listaDeNombres = ls => ls.map(nombreDeLiga).join(" y ");

function textoCupo(e, hasta, liga){
  const cuando = diaFuturo(hasta);
  const renueva = cuando ? " Se renueva el " + cuando + "." : "";
  /* Lo primero es lo que FRENA. Que te sobren simulaciones no sirve de nada
     si la liga que querés no entra en tu plan, y decirlo al revés manda a
     comprar simulaciones a alguien que ya las tiene. */
  if(liga && !e.entraLiga){
    const tuyas = listaDeNombres(e.tomadas);
    return e.topeLigas === 1
      ? "Tu plan cubre una liga y este mes es " + tuyas + ". Para simular " +
        nombreDeLiga(liga) + " hace falta el plan de tres ligas o el de todas."
      : "Tu plan cubre " + e.topeLigas + " ligas y ya están tomadas (" + tuyas +
        "). Para sumar " + nombreDeLiga(liga) + " hace falta el plan de todas.";
  }
  if(e.ilimitado){
    if(e.topeLigas >= 99) return "Simulaciones sin límite en todas las ligas.";
    if(e.libresDeLiga > 0 && e.tomadas.length)
      return "Simulaciones sin límite en " + listaDeNombres(e.tomadas) + ". Te " +
             (e.libresDeLiga === 1 ? "queda 1 liga más" : "quedan " + e.libresDeLiga + " ligas más") +
             " para elegir este mes.";
    if(e.tomadas.length)
      return "Simulaciones sin límite en " + listaDeNombres(e.tomadas) + ".";
    return "Simulaciones sin límite en " + (e.topeLigas === 1 ? "la liga" : e.topeLigas + " ligas") +
           " que elijas este mes.";
  }
  const donde = e.tomadas.length ? " en " + listaDeNombres(e.tomadas) : "";
