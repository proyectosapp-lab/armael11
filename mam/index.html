<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mano a mano</title>
<meta name="description" content="Desafíos de fútbol, tenis y NBA con tus amigos. Simula cada partido y juega contra el modelo.">
<meta name="theme-color" content="#14110F">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mam.css">
</head>
<body class="mam-cargando">
<div class="mam-app" id="mam-app">
  <header class="mam-cab">
    <div class="mam-marca"><span class="mam-loseta" aria-hidden="true"><i class="f"></i><i class="t"></i><i class="n"></i></span><b>Mano a mano</b></div>
    <nav class="mam-deportes" id="mam-deportes" aria-label="Deporte">
      <button type="button" data-deporte="futbol" aria-selected="false"><i></i>Fútbol</button>
      <button type="button" data-deporte="tenis" aria-selected="false"><i></i>Tenis</button>
      <button type="button" data-deporte="nba" aria-selected="false"><i></i>NBA</button>
    </nav>
  </header>

  <main class="mam-cuerpo" id="mam-cuerpo">
    <div class="mam-marcos" id="mam-marcos">
      <iframe id="mam-futbol" title="Fútbol" hidden></iframe>
      <iframe id="mam-tenis" title="Tenis" hidden></iframe>
      <iframe id="mam-nba" title="NBA" hidden></iframe>
    </div>
    <section class="mam-pantalla" id="mam-juga" hidden></section>
    <section class="mam-pantalla" id="mam-desafios" hidden></section>
    <section class="mam-pantalla" id="mam-cuenta" hidden></section>
  </main>

  <nav class="mam-barra" id="mam-barra" aria-label="Secciones">
    <button type="button" data-pestana="partidos" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Partidos</button>
    <button type="button" data-pestana="juga" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l-1 9H7zM9 13v7h6v-7"/></svg>Jugar</button>
    <button type="button" data-pestana="desafios" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l6-6M14 10l6-6M4 4l16 16M9 4H4v5M15 20h5v-5"/></svg>Desafíos<i class="mam-globo" id="mam-globo" hidden></i></button>
    <button type="button" data-pestana="cuenta" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Cuenta</button>
  </nav>

  <!-- la primera vez: ¿qué seguís? Una sola pantalla, una sola vez -->
  <section class="mam-bienvenida" id="mam-bienvenida" hidden>
    <div class="mam-bienvenida-caja">
      <span class="mam-loseta grande" aria-hidden="true"><i class="f"></i><i class="t"></i><i class="n"></i></span>
      <h1>Mano a mano</h1>
      <p>Simula cada partido. Desafía a tus amigos. Juega contra el modelo.</p>
      <h2>¿Qué sigues?</h2>
      <div class="mam-elegir" id="mam-elegir">
        <button type="button" data-deporte="futbol" aria-pressed="true"><i></i><b>Fútbol</b><small>once ligas · fantasy</small></button>
        <button type="button" data-deporte="tenis" aria-pressed="false"><i></i><b>Tenis</b><small>ATP · el saque</small></button>
        <button type="button" data-deporte="nba" aria-pressed="false"><i></i><b>NBA</b><small>la baja de la noche</small></button>
      </div>
      <button type="button" class="mam-boton" id="mam-empezar">Empezar</button>
      <p class="mam-nota">Se cambia cuando quieras desde Cuenta. App independiente, sin relación con ligas, torneos ni jugadores.</p>
    </div>
  </section>
</div>
<script src="sitio-mam.js"></script>
<script src="nativo-mam.js"></script>
<script src="mam-cuentas.js"></script>
<script src="tienda-mam.js"></script>
<script src="juegos.js"></script>
<script src="desafios.js"></script>
<script src="mam.js"></script>
</body>
</html>
