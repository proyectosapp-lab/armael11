# ══════════════════════════════════════════════════════════════════════════
#  MANO A MANO — compilar para iPhone y para Android sin tener una Mac
#
#  Reemplaza al codemagic.yaml de Armá el 11 (misma app, com.armael11.app,
#  ahora con los tres deportes adentro). Va suelto en la raíz del repo
#  `armael11`, se sube arrastrando. Codemagic compila cuando se crea una
#  etiqueta (v1.1.0, v1.1.1, …), y sube el .ipa a TestFlight. El .aab de
#  Android queda para bajar y subirlo a mano a Play Console (prueba interna
#  → producción), que es lo que ya hacés.
#
#  LO QUE HAY QUE TENER EN CODEMAGIC (una sola vez):
#   · Integrations → Developer Portal: la clave de App Store Connect, con el
#     nombre `armael11` (ya está: es la de siempre).
#   · Code signing identities → iOS: certificado y perfil llamados `armael11`
#     (ya están).
#   · Code signing identities → Android keystores: subir `signing.keystore`
#     (el del paquete de Play que generó PWABuilder) con el nombre
#     `armael11_play`, y sus contraseñas y alias tal como dice
#     `signing-key-info.txt`. ES LA MISMA CLAVE DE SIEMPRE: con otra, Play
#     rechaza la actualización ("el paquete está firmado con otra clave").
#   · (Opcional, para que el link de un desafío abra la app en el iPhone)
#     Environment variables → grupo `manoamano`: APPLE_TEAM_ID = tu Team ID
#     de Apple (Developer → Membership details). Sin esto compila igual: el
#     link abre la página web del desafío, que manda a la tienda.
# ══════════════════════════════════════════════════════════════════════════

definitions:
  empaquetar: &empaquetar
    name: Armar el www que va adentro (las tres webs + el cascarón)
    script: |
      set -e
      node empaquetar-mam.mjs
      # Se planta solo si un sitio no bajó, si quedó publicidad adentro o si
      # el paquete está vacío. La comprobación vive en ese archivo.
  instalar: &instalar
    name: Instalar Capacitor
    script: |
      set -e
      npm install
      npm ls @revenuecat/purchases-capacitor || true

workflows:
  ios:
    name: Mano a mano · iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      groups:
        - manoamano
      vars:
        BUNDLE_ID: "com.armael11.app"
      ios_signing:
        certificates:
          - armael11
        provisioning_profiles:
          - armael11
    integrations:
      app_store_connect: armael11
    triggering:
      events:
        - tag
    scripts:
      - *empaquetar
      - *instalar
      - name: Generar el proyecto de Xcode
        script: |
          set -e
          npx cap add ios || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 1[0-9]\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '1[0-9]\.[0-9]*'/platform :ios, '15.0'/" ios/App/Podfile
          # íconos y splash de la app, generados de assets/ (icon-only.png 1024, splash.png 2732)
          npx @capacitor/assets generate --ios --iconBackgroundColor '#14110F' --iconBackgroundColorDark '#14110F' --splashBackgroundColor '#14110F' --splashBackgroundColorDark '#14110F'
          # ── EL ÍCONO DE LA APP, A MANO Y SIN CONFIAR EN NADIE ──────────
          # @capacitor/assets genera íconos y splash, pero el de 1024 de la
          # App Store se escribe explícito: el día que la herramienta cambie
          # de formato, la app no vuelve a TestFlight con el logo de Capacitor.
          ICO=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICO"
          cp apple-icono-1024.png "$ICO/AppIcon-1024.png"
          cat > "$ICO/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          echo "── ícono ──"
          ls -la "$ICO"
          # Sin alfa, o la subida a App Store Connect rebota. Se comprueba acá.
          python3 - <<'PY'
          from struct import unpack
          d = open("apple-icono-1024.png","rb").read()
          w,h = unpack(">II", d[16:24]); color = d[25]
          print("   %d × %d, tipo de color %d" % (w,h,color))
          assert (w,h) == (1024,1024), "el ícono de Apple tiene que ser 1024 × 1024"
          assert color in (0,2,3), "el ícono de Apple no puede tener canal alfa"
          PY
          npx cap sync ios
      - name: Los textos que Apple exige en el Info.plist
        script: |
          set -e
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Mano a mano" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$P" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.0" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$P"
          # Compartir la imagen de la tabla guarda un png en el caché de la app: no toca la galería, no hace falta pedir permiso.
          plutil -p "$P" | head -40
      - name: El link universal (armael11.com/desafio.html → abre la app), si hay Team ID
        script: |
          set -e
          if [ -z "${APPLE_TEAM_ID:-}" ]; then echo "sin APPLE_TEAM_ID: los links abren la web"; exit 0; fi
          E=ios/App/App/App.entitlements
          cat > "$E" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.associated-domains</key>
            <array><string>applinks:armael11.com</string></array>
          </dict></plist>
          XML
          # que el proyecto use ese archivo
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = [^;]*;//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.armael11.app;/PRODUCT_BUNDLE_IDENTIFIER = com.armael11.app; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -c "App.entitlements" ios/App/App.xcodeproj/project.pbxproj
          # Y en el servidor: armael11.com/.well-known/apple-app-site-association tiene que decir
          # {"applinks":{"apps":[],"details":[{"appID":"TEAMID.com.armael11.app","paths":["/desafio.html"]}]}}
          # (está en el zip, en sitio-futbol/.well-known/, con TEAMID para reemplazar). Y en Apple Developer,
          # el App ID necesita "Associated Domains" tildado.
      - name: Poner el perfil en el proyecto
        script: |
          xcode-project use-profiles
      - name: Compilar
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - steelsmartshomes@gmail.com
        notify:
          success: true
          failure: true

  android:
    name: Mano a mano · Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      android_signing:
        - armael11_play
    triggering:
      events:
        - tag
    scripts:
      - *empaquetar
      - *instalar
      - name: Generar el proyecto de Android
        script: |
          set -e
          npx cap add android || true
          npx @capacitor/assets generate --android --iconBackgroundColor '#14110F' --iconBackgroundColorDark '#14110F' --splashBackgroundColor '#14110F' --splashBackgroundColorDark '#14110F'
          npx cap sync android
          G=android/app/build.gradle
          # la versión: el número de compilación de Codemagic (tiene que ser mayor que el de la TWA que está en Play)
          BASE=${ANDROID_VERSION_CODE_BASE:-100}
          sed -i "s/versionCode [0-9]*/versionCode $((BASE + BUILD_NUMBER))/" "$G"
          sed -i 's/versionName "[^"]*"/versionName "1.1.0"/' "$G"
          grep -E "versionCode|versionName|applicationId" "$G"
          # el nombre que se ve debajo del ícono
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Mano a mano</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">Mano a mano</string>|' android/app/src/main/res/values/strings.xml
          # solo vertical, y el link de un desafío (armael11.com/desafio.html) abre la app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' "$M"
          python3 - "$M" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p).read()
          filtro='''            <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="armael11.com" android:pathPrefix="/desafio.html" />
                      </intent-filter>
          '''
          if 'armael11.com' not in s:
              s=s.replace('</activity>', filtro+'        </activity>',1)
          open(p,'w').write(s)
          PY
          grep -n "armael11.com\|portrait" "$M"
      - name: Firmar y compilar el .aab
        script: |
          set -e
          cd android
          # la firma: Codemagic deja las variables del keystore (CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD)
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
          ./gradlew bundleRelease
          ls -la app/build/outputs/bundle/release/
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - steelsmartshomes@gmail.com
        notify:
          success: true
          failure: true
